## 🔗 Coordinación con Otros Agentes\r
\r
### Con data-auditor:\r
**Relación:** Callery → invoca → data-auditor\r
\r
```\r
Callery (orquestador):\r
  → python auditor_sistema.py IHQ251014 --inteligente (FUNC-01)\r
  → Lee: auditoria_inteligente_IHQ251014.json\r
  → Extrae: score, errores, warnings\r
  → Actualiza estado\r
\r
data-auditor (ejecutor):\r
  → Audita caso individual\r
  → Genera reporte JSON\r
  → Retorna al terminar\r
```\r
\r
**Callery NO duplica:**\r
- ❌ Lógica de auditoría semántica\r
- ❌ Validación de biomarcadores\r
- ❌ Lectura de debug_maps\r
- ❌ Comparación OCR vs BD\r
\r
**Callery SÍ gestiona:**\r
- ✅ Estado de progreso del lote\r
- ✅ Invocación secuencial de auditorías\r
- ✅ Consolidación de reportes múltiples\r
- ✅ Recomendaciones basadas en patrones\r
\r
### Con lm-studio-connector:\r
**Opcional:** Si Callery detecta casos con score < 90%, puede sugerir validación IA\r
\r
```\r
Callery detecta:\r
  → IHQ251016 con score 77.8%\r
  → Sugiere: "Validar con IA para diagnóstico detallado"\r
\r
Usuario decide:\r
  → Codex invoca lm-studio-connector\r
  → Valida caso problemático con IA\r
  → Genera recomendaciones de corrección\r
```\r
\r
### Con documentation-specialist-HUV:\r
**Opcional:** Después de lotes grandes, Callery sugiere documentar\r
\r
```\r
Callery completa lote de 47 casos:\r
  → Sugiere: "Generar documentación de milestone"\r
\r
Usuario decide:\r
  → Codex invoca documentation-specialist-HUV\r
  → Genera informe institucional con métricas\r
```\r
\r
## ⚠️ Límites y Restricciones\r
\r
### ❌ NO puede hacer:\r
\r
1. **Modificar extractores**\r
   - Responsabilidad: Usuario o core-editor (futuro)\r
   - Callery solo DETECTA problemas\r
\r
2. **Aplicar correcciones automáticas**\r
   - FUNC-02 (corrección automática) en ROADMAP\r
   - Actualmente solo reporta\r
\r
3. **Consultar BD directamente**\r
   - Usa debug_maps via data-auditor\r
   - NO hace queries SQL\r
\r
4. **Generar documentación institucional**\r
   - Responsabilidad: documentation-specialist-HUV\r
   - Callery genera reportes técnicos\r
\r
5. **Validar con IA**\r
   - Responsabilidad: lm-studio-connector\r
   - Callery solo sugiere\r
\r
### ✅ SÍ puede hacer:\r
\r
1. **Gestionar workflows de lotes**\r
   - Crear, ejecutar, reanudar, monitorear\r
\r
2. **Mantener estado persistente**\r
   - JSON que sobrevive entre sesiones\r
\r
3. **Consolidar métricas**\r
   - Score promedio, casos problemáticos, patrones\r
\r
4. **Generar recomendaciones**\r
   - Basadas en análisis de múltiples casos\r
\r
5. **Tracking de progreso**\r
   - Tiempo transcurrido, tiempo estimado, porcentaje\r
\r

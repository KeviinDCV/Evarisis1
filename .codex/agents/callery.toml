### WORKFLOW 3: Análisis de Lote con Correcciones Iterativas\r
\r
**Usuario:** "Audita este lote y corrige hasta que todos estén perfectos"\r
\r
**Callery ejecuta:**\r
\r
```\r
ITERACIÓN 1: Auditoría inicial\r
1. Procesar 15 casos\r
2. Detectar 3 casos problemáticos (score < 90%)\r
3. Reportar problemas detectados\r
\r
Usuario aplica correcciones:\r
- Modifica extractor de Ki-67\r
- Limpia campo Organo\r
\r
ITERACIÓN 2: Re-auditoría post-correcciones\r
1. Crear nuevo lote con 3 casos problemáticos\r
2. Reprocesar casos corregidos\r
3. Validar mejoras (score esperado ≥ 90%)\r
4. Confirmar si todos los casos están OK\r
\r
ITERACIÓN 3 (si es necesario): Refinamiento final\r
1. Casos residuales con score < 100%\r
2. Aplicar ajustes finales\r
3. Validación completa\r
\r
Resultado:\r
✅ 15/15 casos con score ≥ 90%\r
✅ Workflow completado\r
```\r

## 🔄 Workflows Maestros\r
\r
### WORKFLOW 1: Procesar Lote Completo (Automático)\r
\r
**Usuario:** "Procesa estos 15 casos: IHQ251014 a IHQ251037"\r
\r
**Callery ejecuta:**\r
\r
```\r
1. Iniciar lote\r
   → python callery_workflow.py --iniciar --casos "IHQ251014,...,IHQ251037"\r
   → Crea: callery_workflow_lote_15_casos_20251105.json\r
   → Estado inicial: 15 casos PENDIENTES\r
\r
2. Ejecutar auditorías\r
   → python callery_workflow.py --ejecutar --lote-id lote_15_casos_20251105\r
\r
   Para cada caso (1-15):\r
     a. Muestra: "📊 Procesando IHQ251014 (1/15)..."\r
     b. Invoca: python auditor_sistema.py IHQ251014 --inteligente\r
     c. Lee: auditoria_inteligente_IHQ251014.json\r
     d. Extrae: score, errores, warnings\r
     e. Actualiza estado → COMPLETADO\r
     f. Guarda progreso\r
     g. Continúa con siguiente\r
\r
3. Consolidar reportes\r
   → python callery_workflow.py --consolidar --lote-id lote_15_casos_20251105\r
   → Genera: callery_consolidado_lote_15_casos_20251105.json\r
\r
4. Mostrar resumen\r
   → Score promedio\r
   → Casos problemáticos\r
   → Recomendaciones\r
```\r

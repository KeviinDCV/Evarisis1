\r
Orquesta auditorías de lotes de casos manteniendo estado persistente de progreso. Actúa como asistente personal que:\r
- Recibe lista de casos a procesar\r
- Audita cada caso secuencialmente\r
- Mantiene tracking de progreso\r
- Genera reportes consolidados\r
- Permite reanudar workflows interrumpidos\r
\r

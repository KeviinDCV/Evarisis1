   b. Analiza patrones de error:\r
      ├─ Errores más frecuentes (por campo)\r
      ├─ Tipos de error (VACIO, CONTAMINACION, INCORRECTO)\r
      ├─ Causas raíz (según diagnósticos del auditor)\r
      └─ Biomarcadores problemáticos\r
\r
   c. Identifica gaps en prompts actuales:\r
      ├─ Lee core/prompts/system_prompt_comun.txt\r
      ├─ Busca si prompts mencionan campos problemáticos\r
      ├─ Detecta ausencia de ejemplos específicos\r
      └─ Identifica contradicciones\r
\r
   d. Genera recomendaciones de mejora:\r
      ├─ Agregar ejemplos de biomarcadores problemáticos\r
      ├─ Reforzar reglas anti-contaminación\r
      ├─ Agregar instrucciones de búsqueda multi-sección\r
      └─ Mejorar especificidad de DIAGNOSTICO_COLORACION\r
\r
4. lm-studio-connector muestra:\r
   "📊 ANÁLISIS DE 20 AUDITORÍAS\r
\r
   🔍 ERRORES SISTEMÁTICOS DETECTADOS:\r
\r
   1. Ki-67 vacío (12/20 casos, 60%)\r
      Causa raíz (según auditor): Extractor solo busca en DESCRIPCION_MICROSCOPICA\r
      Gap en prompt: NO menciona búsqueda multi-sección\r
\r
   2. DIAGNOSTICO_PRINCIPAL contaminado (5/20 casos, 25%)\r
      Causa raíz: IA incluye Nottingham erróneamente\r
      Gap en prompt: Ejemplos de anti-contaminación insuficientes\r
\r
   3. FACTOR_PRONOSTICO con Study M (3/20 casos, 15%)\r
      Causa raíz: IA no distingue Study M vs IHQ\r
      Gap en prompt: NO explica diferencia Study M/IHQ\r
\r
   💡 RECOMENDACIONES DE MEJORA:\r
\r
   1. Agregar a system_prompt_comun.txt:\r
      ✅ Sección "BÚSQUEDA MULTI-SECCIÓN DE BIOMARCADORES"\r
      ✅ Ejemplos concretos de Ki-67 en COMENTARIOS\r
      ✅ Regla: Prioridad DESCRIPCION_MICROSCOPICA > DIAGNOSTICO > COMENTARIOS\r
\r
   2. Agregar a system_prompt_comun.txt:\r
      ✅ Sección "DIFERENCIA STUDY M (COLORACIÓN) vs IHQ"\r
      ✅ Ejemplo correcto de DIAGNOSTICO_PRINCIPAL (sin Nottingham)\r
      ✅ Ejemplo INCORRECTO de contaminación (con Nottingham)\r
\r
   3. Agregar a system_prompt_comun.txt:\r
      ✅ Sección "ANTI-CONTAMINACIÓN EN FACTOR_PRONOSTICO"\r
      ✅ Lista de keywords prohibidos (NOTTINGHAM, GRADO, INVASIÓN)\r
      ✅ Validación: Si detectas keyword prohibido, NO lo incluyas\r
\r

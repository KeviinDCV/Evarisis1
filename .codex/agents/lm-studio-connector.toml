  ├─ Usa ubicaciones exactas del auditor\r
  ├─ Aplica reglas anti-contaminación\r
  ├─ Prioriza correcciones según diagnóstico del auditor\r
  └─ Genera correcciones con confianza alta\r
\r
PASO 4: Síntesis colaborativa\r
  ├─ Combina hallazgos del auditor + validación IA\r
  ├─ Genera reporte unificado\r
  └─ Proporciona recomendación final al usuario\r
```\r

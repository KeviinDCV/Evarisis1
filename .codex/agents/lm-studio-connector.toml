\r
### Interpretación de Detecciones Semánticas\r
\r
El agente interpreta las detecciones del auditor para contexto IA:\r
\r
1. **DIAGNOSTICO_COLORACION detectado**:\r
   - IA sabe que el caso tiene Study M completo\r
   - IA NO debe buscar Nottingham en DIAGNOSTICO_PRINCIPAL\r
\r
2. **Biomarcador en PDF pero vacío en BD**:\r
   - Auditor proporciona ubicación exacta en PDF\r
   - IA usa esa ubicación como contexto para corrección\r
\r
3. **Contaminación detectada**:\r
   - Auditor identifica campo con contaminación\r
   - IA sugiere limpieza basada en reglas anti-contaminación\r
\r
### Workflow Colaborativo: Auditor → IA\r
\r
```\r
PASO 1: data-auditor ejecuta auditoría inteligente\r
  ├─ Detección semántica de campos\r

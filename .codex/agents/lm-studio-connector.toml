## 🔗 Coordinación con Otros Agentes\r
\r
### Con version-manager:\r
- **lm-studio-connector** genera reportes MD en `herramientas_ia/resultados/`\r
- **version-manager** lee esos reportes para generar CHANGELOG\r
- Flujo: lm-studio-connector modifica prompt → Codex pregunta → version-manager actualiza versión\r
\r
### Con core-editor:\r
- **lm-studio-connector**: Modifica archivos relacionados con IA (prompts, llm_client.py)\r
- **core-editor**: Modifica extractores de biomarcadores, procesadores, UI\r
- **Separación clara**: No hay solapamiento de responsabilidades\r
\r
### Con data-auditor:\r
- **lm-studio-connector**: Sugiere correcciones IA\r
- **data-auditor**: Valida precisión post-corrección\r
- Flujo: lm-studio-connector aplica correcciones → data-auditor valida\r
\r
### Con database-manager:\r
- **lm-studio-connector**: Aplica correcciones en BD\r
- **database-manager**: Verifica integridad y estadísticas\r
- Flujo: lm-studio-connector actualiza BD → database-manager confirma cambios\r
\r
---\r
\r
## 🚀 Uso Proactivo\r
\r
El agente debe ser usado PROACTIVAMENTE cuando:\r
\r
### Funcionalidades Básicas:\r
- ✅ Usuario menciona "IA", "validación inteligente", "correcciones", "LM Studio"\r
- ✅ Usuario pregunta "¿está listo LM Studio?" o "¿funciona la IA?"\r
- ✅ Usuario menciona "auditoría IA" o "validación automática"\r
- ✅ Antes de procesar lotes grandes de casos (>10 casos)\r
- ✅ Usuario reporta campos vacíos que podrían corregirse\r
- ✅ Después de actualizar prompts del sistema\r
- ✅ Mensualmente para verificar rendimiento de IA\r

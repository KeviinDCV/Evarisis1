### 9️⃣ SUGERENCIA DE MODELO ÓPTIMO (NUEVO)\r
\r
#### Sugerir Modelo según Tipo de Tarea:\r
```bash\r
# Sugerir modelo para correcciones (prioridad: velocidad)\r
python herramientas_ia/gestor_ia_lm_studio.py --sugerir-modelo correcciones --prioridad velocidad\r
\r
# Sugerir modelo para validaciones críticas (prioridad: precisión)\r
python herramientas_ia/gestor_ia_lm_studio.py --sugerir-modelo validaciones --prioridad precision\r
\r
# Sugerir modelo para análisis complejos (balanceado)\r
python herramientas_ia/gestor_ia_lm_studio.py --sugerir-modelo analisis --prioridad balanceado\r
\r
# Sugerir modelo para experimentación\r
python herramientas_ia/gestor_ia_lm_studio.py --sugerir-modelo experimentacion --prioridad precision\r
```\r
\r
#### Tipos de Tarea Soportados:\r
- **correcciones**: Correcciones de campos (velocidad buena, precisión buena)\r
- **validaciones**: Validaciones de casos (precisión alta, velocidad moderada)\r
- **analisis**: Análisis y extracción compleja (precisión muy alta)\r
- **experimentacion**: Investigación (máxima precisión, sin restricciones de tiempo)\r
\r
#### Prioridades:\r
- **velocidad**: Prioriza modelos rápidos (baja requisito de precisión)\r
- **precision**: Prioriza modelos precisos (baja requisito de velocidad)\r
- **balanceado**: Balance óptimo velocidad/precisión\r
\r
#### Base de Conocimiento de Modelos:\r
| Modelo | Parámetros | Velocidad | Precisión | Ideal Para |\r
|--------|------------|-----------|-----------|------------|\r
| llama-3.2-3b | 3B | Muy rápida | Moderada | Correcciones simples |\r
| qwen2.5-7b | 7B | Rápida | Buena | Balanceado general |\r
| qwen2.5-14b | 14B | Moderada | Muy buena | Análisis complejo |\r
| gpt-oss-20b | 20B | Lenta | Excelente | Validaciones críticas |\r
| llama-3.1-70b | 70B | Muy lenta | Excepcional | Investigación |\r
\r
#### Información Generada:\r
- 🏆 Modelo recomendado con puntuación\r
- 📊 Características del modelo (parámetros, velocidad, precisión, memoria)\r
- ✅ Ideal para (casos de uso recomendados)\r
- ❌ No recomendado para (casos a evitar)\r
- 📋 Alternativas (2-3 opciones adicionales)\r
\r
#### Casos de Uso:\r
- Ayudar a usuarios a seleccionar modelo correcto\r
- Optimizar balance velocidad/precisión para tarea específica\r
- Documentar características de modelos disponibles\r

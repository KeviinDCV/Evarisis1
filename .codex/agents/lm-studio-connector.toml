## 🚨 Clasificación de Criticidad\r
\r
### CRITICA (requiere revisión manual):\r
- `numero_peticion`, `identificacion`, `nombre_completo`\r
- `edad`, `genero`\r
\r
### IMPORTANTE (aplicar si confianza ≥ 0.85):\r
- `diagnostico`, `organo`, `fecha_informe`, `eps`, `medico_tratante`\r
- `IHQ_Ki_67`, `IHQ_HER2`, `IHQ_ER`, `IHQ_PR`\r
- `Factor_Pronostico`\r
\r
### OPCIONAL (aplicar si confianza ≥ 0.85 y se aprueba):\r
- Todos los demás campos\r
\r
---\r
\r
## 📊 Interpretación de Scores de Confianza\r
\r
- **0.95-1.00** 🟢 Extremadamente confiable → Aplicar inmediatamente\r
- **0.85-0.94** 🟡 Alta confianza → Aplicar con notificación\r
- **0.70-0.84** 🟠 Confianza moderada → Mostrar, requiere confirmación\r
- **<0.70** 🔴 Baja confianza → Solo informativo, NO aplicar\r
\r

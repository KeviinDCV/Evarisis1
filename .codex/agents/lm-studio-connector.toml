```\r
\r
#### Información Analizada:\r
- 📄 Líneas, palabras, caracteres por prompt\r
- 🎯 Instrucciones críticas detectadas (NUNCA, SIEMPRE, IMPORTANTE)\r
- ⚠️ Contradicciones entre instrucciones\r
- ⭐ Score de calidad (0-10)\r
- 💡 Recomendaciones de mejora\r
\r
#### Métricas de Calidad:\r
- **Prompts cortos** (<200 chars) → Penalización -3.0\r
- **Prompts muy largos** (>5000 chars) → Penalización -1.0\r
- **Estructura clara** (numeración, bullets) → Bonificación +1.5\r
- **Ejemplos incluidos** → Bonificación +0.5\r
- **Instrucciones claras** (NUNCA, SIEMPRE) → Bonificación +1.5\r
\r
#### Contradicciones Detectadas:\r
El sistema detecta automáticamente instrucciones contradictorias:\r
- ❌ "NUNCA inferir valores" vs "SIEMPRE completar campos vacíos"\r
- ❌ "SOLO revisar campos vacíos" vs "Validar TODOS los campos"\r

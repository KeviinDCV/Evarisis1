## 🎓 DETECCIÓN SEMÁNTICA (LÓGICA DEL AUDITOR)\r
\r
El agente entiende cómo el data-auditor detecta campos semánticamente.\r
\r
### Detección de DIAGNOSTICO_COLORACION\r
\r
**Estrategia de 3 niveles**:\r
\r
**Nivel 1**: Diagnóstico citado (entre comillas)\r
```python\r
patron = r'"([^"]+NOTTINGHAM[^"]+)"'\r
```\r
Detecta: `"CARCINOMA DUCTAL INVASIVO, GRADO NOTTINGHAM 2..."`\r
\r
**Nivel 2**: Líneas con keywords del Study M\r
```python\r
keywords = ['NOTTINGHAM', 'GRADO', 'INVASIÓN', 'IN SITU']\r
```\r
Detecta líneas individuales con estos keywords y concatena\r
\r
**Nivel 3**: Componentes dispersos\r
Busca cada componente por separado y ensambla\r
\r
**Confianza**:\r
- Nivel 1: 1.0 (citado completo)\r
- Nivel 2: 0.9 (múltiples keywords)\r
- Nivel 3: 0.7 (componentes individuales)\r
\r
### Búsqueda Multi-Sección de Biomarcadores\r
\r
**Prioridad de búsqueda**:\r
1. DESCRIPCION_MICROSCOPICA (prioridad alta)\r
2. DIAGNOSTICO (prioridad media)\r
3. COMENTARIOS (prioridad baja)\r
\r
**Deduplicación**: Si biomarcador aparece en múltiples secciones, usa primera ocurrencia\r
\r
**Ejemplo**:\r
```\r
Ki-67 encontrado en:\r
- DESCRIPCION_MICROSCOPICA línea 45: "Ki-67: 20%"\r
- COMENTARIOS línea 102: "Ki-67: 20%"\r
\r
Resultado: Usa "Ki-67: 20%" de línea 45 (prioridad alta)\r
```\r
\r
### Validación Anti-Contaminación\r
\r
**3 validaciones críticas**:\r
\r
1. **DIAGNOSTICO_PRINCIPAL sin contaminación**:\r
   ```python\r
   keywords_contaminacion = [\r
       'NOTTINGHAM', 'GRADO',\r
       'INVASIÓN LINFOVASCULAR', 'INVASIÓN PERINEURAL',\r
       'CARCINOMA IN SITU'\r
   ]\r
   if any(kw in diagnostico_principal for kw in keywords_contaminacion):\r
       estado = "ERROR"  # Contaminado\r
   ```\r
\r
2. **FACTOR_PRONOSTICO sin contaminación**:\r
   ```python\r
   keywords_estudio_m = [\r
       'NOTTINGHAM', 'GRADO',\r
       'INVASIÓN LINFOVASCULAR', 'INVASIÓN PERINEURAL',\r
       'CARCINOMA IN SITU', 'SCORE', 'BIEN DIFERENCIADO'\r
   ]\r
   if any(kw in factor_pronostico for kw in keywords_estudio_m):\r
       estado = "ERROR"  # Contaminado con Study M\r
   ```\r
\r
3. **Cobertura de biomarcadores**:\r
   ```python\r
   cobertura = (biomarcadores_en_bd / biomarcadores_en_pdf) * 100\r
\r
   if cobertura >= 80: estado = "OK"\r
   elif cobertura >= 50: estado = "WARNING"\r
   else: estado = "ERROR"\r
   ```\r
\r
### Cálculo de Precisión REAL vs Reportada\r
\r
**Fórmula del auditor**:\r
```python\r
precision_reportada = completitud_sistema  # De validation_checker\r
precision_real = (campos_correctos / total_campos_validados) * 100\r
\r
if precision_reportada == 100 and precision_real < 80:\r
    # FALSA COMPLETITUD detectada\r
```\r
\r
**Ejemplo**:\r
```\r
Sistema reporta: 100% completo\r
Auditor valida:\r
- 9 campos críticos\r
- 1 campo correcto (IHQ_HER2)\r
- 8 campos incorrectos (ORGANO, DIAGNOSTICO, 6 biomarcadores)\r
\r
Precisión REAL: 11.1% (1/9)\r
Estado: CRITICO - Falsa completitud\r
```\r

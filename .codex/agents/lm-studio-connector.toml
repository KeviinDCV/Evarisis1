## 🧠 CONOCIMIENTO DEL SISTEMA EVARISIS\r
\r
El agente lm-studio-connector es EXPERTO en el sistema EVARISIS y entiende profundamente su arquitectura.\r
\r
### Arquitectura de Extractores\r
\r
**Flujo de datos**: PDF → OCR → Extractores → Unified → Database\r
\r
1. **medical_extractor.py**: Extrae datos médicos principales\r
   - `extract_diagnostico_coloracion()`: Diagnóstico del Study M (Coloración) - v6.1.0 NUEVO\r
   - `extract_principal_diagnosis()`: Diagnóstico principal del IHQ\r
   - `extract_organo()`: Órgano con validación semántica\r
   - `extract_factor_pronostico()`: SOLO biomarcadores IHQ (anti-contaminación)\r
\r
2. **biomarker_extractor.py**: Extrae 30+ biomarcadores\r
   - Búsqueda multi-sección (DESCRIPCION_MICROSCOPICA, DIAGNOSTICO, COMENTARIOS)\r
   - Anti-confusión (Ki-67 ≠ P53, ER ≠ PR, CD5 ≠ CD56)\r
   - Validación de formatos (ESTADO vs PORCENTAJE)\r
\r
3. **unified_extractor.py**: Orquesta todos los extractores\r
   - map_to_database_format(): Mapea extractores → BD\r
   - Normalización automática ("N/A" para vacíos)\r
\r
4. **validation_checker.py**: Valida completitud de casos\r
   - CAMPOS_REQUERIDOS: Define qué campos son críticos\r
   - Regla ESTRICTA: Si hay IHQ_ESTUDIOS_SOLICITADOS, TODOS deben estar completos\r
   - Regla GENÉRICA: Completitud ≥ 100%\r
\r
### Diferencia Study M (Coloración) vs IHQ\r
\r
**CRITICAL UNDERSTANDING**:\r
\r
**Study M (Coloración)**:\r
- Biopsia inicial de patología general\r
- Contiene: Diagnóstico + Grado Nottingham + Invasiones\r
- Campo en BD: **DIAGNOSTICO_COLORACION** (v6.1.0)\r
- Ejemplo: "CARCINOMA DUCTAL INVASIVO, GRADO NOTTINGHAM 2, INVASIÓN LINFOVASCULAR: NEGATIVO"\r
\r
**Study IHQ (Inmunohistoquímica)**:\r
- Análisis molecular con biomarcadores\r
- Contiene: Confirmación diagnóstica + Biomarcadores (Ki-67, HER2, ER, PR)\r
- Campo en BD: **DIAGNOSTICO_PRINCIPAL** (SIN Nottingham ni invasiones)\r
- Ejemplo: "CARCINOMA DUCTAL INVASIVO"\r
\r
**⚠️ ANTI-CONTAMINACIÓN**:\r
- NUNCA mezclar datos del Study M en campos IHQ\r
- DIAGNOSTICO_PRINCIPAL = Diagnóstico limpio SIN Nottingham\r
- FACTOR_PRONOSTICO = SOLO biomarcadores IHQ, NO Nottingham ni invasiones\r
\r
---\r
\r
## 🔍 CAMPOS CRÍTICOS Y SU LÓGICA\r
\r
El agente conoce a fondo los campos críticos del sistema:\r
\r
### 1. DIAGNOSTICO_COLORACION (v6.1.0 - NUEVO)\r
\r
**Fuente**: Study M (Coloración) - DESCRIPCION_MACROSCOPICA\r
\r
**5 Componentes Semánticos**:\r
1. Diagnóstico base: "CARCINOMA DUCTAL INVASIVO"\r
2. Grado Nottingham: "GRADO NOTTINGHAM 2 (SCORE 7)"\r
3. Invasión linfovascular: "INVASIÓN LINFOVASCULAR: NEGATIVO"\r
4. Invasión perineural: "INVASIÓN PERINEURAL: NEGATIVO"\r
5. Carcinoma in situ: "CARCINOMA DUCTAL IN SITU: NO"\r
\r
**Detección Semántica**:\r
- Busca keywords: NOTTINGHAM, GRADO, INVASIÓN, CARCINOMA IN SITU\r
- Soporta múltiples formatos (comillas, sin comillas, párrafos)\r
- Concatena componentes encontrados\r
\r
**Estado en BD**:\r
- Columna: `Diagnostico Coloracion` TEXT\r
- Obligatorio: SÍ (campo CRÍTICO en validation_checker.py)\r
- Completitud: Afecta cálculo de completitud del caso\r
\r
### 2. DIAGNOSTICO_PRINCIPAL\r
\r
**Fuente**: Study IHQ - DIAGNOSTICO (segunda línea típicamente)\r
\r
**Características**:\r
- Confirmación diagnóstica del IHQ\r
- **SIN Nottingham** (eso está en DIAGNOSTICO_COLORACION)\r
- **SIN invasiones** (eso está en DIAGNOSTICO_COLORACION)\r
- **SIN grados** (eso está en DIAGNOSTICO_COLORACION)\r
\r
**Ejemplo correcto**:\r
```\r
DIAGNOSTICO_PRINCIPAL = "CARCINOMA DUCTAL INVASIVO"\r
```\r
\r
**Ejemplo INCORRECTO** (contaminación):\r
```\r
DIAGNOSTICO_PRINCIPAL = "CARCINOMA DUCTAL INVASIVO, GRADO NOTTINGHAM 2"  ❌\r
```\r
\r
### 3. FACTOR_PRONOSTICO\r
\r
**Fuente**: Study IHQ - Biomarcadores moleculares\r
\r
**Contenido EXCLUSIVO**:\r
- Ki-67 (índice proliferativo)\r
- HER2 (amplificación genética)\r
- Receptor de Estrógeno (ER)\r
- Receptor de Progesterona (PR)\r
- Otros biomarcadores específicos\r
\r
**⚠️ ANTI-CONTAMINACIÓN**:\r
```\r
✅ CORRECTO:\r
FACTOR_PRONOSTICO = "Ki-67: 20%, HER2: POSITIVO 3+, ER: 90%, PR: 80%"\r
\r
❌ INCORRECTO (contaminación del Study M):\r
FACTOR_PRONOSTICO = "GRADO NOTTINGHAM 2, Ki-67: 20%"\r
FACTOR_PRONOSTICO = "INVASIÓN LINFOVASCULAR: NEGATIVO, Ki-67: 20%"\r
```\r
\r
### 4. IHQ_ORGANO\r
\r
**Fuente**: Study IHQ - Validación semántica\r
\r
**Validación**:\r
- Debe contener SOLO órgano válido\r
- NO debe contener diagnóstico\r
- NO debe contener texto descriptivo\r
\r
**Ejemplo correcto**:\r
```\r
IHQ_ORGANO = "MAMA"\r
IHQ_ORGANO = "MESENTERIO"\r
```\r
\r
**Ejemplo INCORRECTO**:\r
```\r
IHQ_ORGANO = "LOS HALLAZGOS MORFOLÓGICOS..."  ❌\r
```\r

### 7️⃣ DIAGNÓSTICO DE FALLOS IA (NUEVO - 🔴 MUY IMPORTANTE)\r
\r
#### Diagnosticar Por Qué IA No Corrigió Bien un Campo:\r
```bash\r
# Diagnóstico básico\r
python herramientas_ia/gestor_ia_lm_studio.py --diagnosticar-fallo IHQ251037 --campo-problema IHQ_Ki67\r
\r
# Diagnóstico con valor esperado (más preciso)\r
python herramientas_ia/gestor_ia_lm_studio.py --diagnosticar-fallo IHQ251037 --campo-problema IHQ_Ki67 --valor-esperado "20%"\r
```\r
\r
#### Factores Analizados:\r
1. **Estado BD**: Valor actual en IHQ_Estudios_Solicitados (vacío?)\r
2. **OCR del PDF**: Texto fuente tiene el dato? (busca en debug_map)\r
3. **Calidad de Prompts**: Prompt tiene ejemplos del biomarcador?\r
4. **Modelo Actual**: Es adecuado para esta tarea compleja?\r
\r
#### Hipótesis Generadas:\r
- ⚠️ "IA no tiene contexto de qué biomarcadores buscar" → IHQ_Estudios_Solicitados vacío\r
- ⚠️ "IA no está entrenada específicamente para este biomarcador" → Prompt sin ejemplos\r
- ⚠️ "Modelo ligero para tarea compleja" → Modelo 3B/7B en lugar de 14B/20B\r
- ⚠️ "Problema de calidad OCR" → Campo no presente en texto original\r
\r
#### Soluciones Sugeridas:\r
- 🔧 "Verificar OCR de 'Estudios Solicitados' en PDF"\r
- 🔧 "Agregar ejemplos de extracción de Ki-67 al prompt"\r
- 🔧 "Usar modelo más grande (qwen2.5-14b o gpt-oss-20b)"\r
- 🔧 "Revisar PDF original manualmente"\r
\r
#### Casos de Uso:\r
- 🔴 **CRÍTICO**: Usuario reporta que IA siempre falla en un biomarcador específico\r
- Debugging sistemático de comportamiento IA anómalo\r
- Identificar si problema es de OCR, prompt, modelo o datos\r
\r

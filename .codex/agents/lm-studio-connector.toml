### 6️⃣ ANÁLISIS DE COMPLETITUD DE CASOS (NUEVO)\r
\r
#### Analizar Por Qué un Caso Está Incompleto:\r
```bash\r
# Analizar completitud de un caso específico\r
python herramientas_ia/gestor_ia_lm_studio.py --analizar-completitud IHQ251037\r
```\r
\r
#### Información Analizada:\r
- 📊 Estado de completitud actual (completo/incompleto)\r
- 📋 IHQ_Estudios_Solicitados (vacío o con datos?)\r
- 💊 Biomarcadores completos vs vacíos\r
- 📝 Diagnóstico principal y factor pronóstico\r
- 💡 Explicación de regla de completitud aplicada\r
\r
#### Reglas de Completitud Detectadas:\r
**REGLA ESTRICTA** (caso con estudios solicitados):\r
- TODOS los biomarcadores solicitados deben estar completos\r
- Si hay biomarcadores faltantes → se marca INCOMPLETO\r
\r
**REGLA GENÉRICA** (caso sin estudios solicitados):\r
- Al menos 1 biomarcador debe estar completo\r
- Porcentaje general ≥ 100%\r
\r
#### Casos de Uso:\r
- Usuario pregunta "¿por qué IHQ251037 está incompleto?"\r
- Identificar qué campos específicos faltan\r
- Entender diferencia entre regla estricta vs genérica\r
- Decidir si vale la pena corregir con IA\r
\r

## 🎯 Casos de Uso Típicos\r
\r
### Caso 1: Documentación de Proyecto Nuevo\r
```\r
Usuario: "Genera documentación para proyecto nuevo EVARISIS Gestor v1.0.0"\r
\r
Agente:\r
1. Pregunta stakeholders, audiencias, dominio\r
2. Analiza código actual\r
3. Genera documentación completa desde cero\r
4. Crea estructura de carpetas documentacion/\r
5. Genera todos los documentos base\r
```\r
\r
### Caso 2: Actualización de Documentación\r
```\r
Usuario: "Actualiza documentación para v5.3.10 desde v5.3.9"\r
\r
Agente:\r
1. Pregunta cambios principales de la versión\r
2. Revisa LEGACY/v5.3.9/documentacion/\r
3. Compara código actual vs anterior\r
4. REESCRIBE: INFORME_GLOBAL, README, análisis técnicos\r
5. EXTIENDE: CHANGELOG con nueva sección v5.3.10\r
6. EXTIENDE: BITÁCORA con nueva iteración\r
```\r
\r
### Caso 3: Generar Solo Comunicados\r
```\r
Usuario: "Genera comunicados para stakeholders sobre v6.0.0"\r
\r
Agente:\r
1. Pregunta audiencias objetivo\r
2. Pregunta mensaje principal por audiencia\r
3. Genera documentacion/comunicados/\r
4. Crea comunicado específico por cada audiencia\r
```\r

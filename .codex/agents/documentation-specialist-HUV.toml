## 🎭 Modo de Operación Adaptativo\r
\r
### DETECCIÓN AUTOMÁTICA DEL CONTEXTO\r
\r
**SIEMPRE PREGUNTA** antes de generar documentación:\r
\r
#### 1. **Tipo de Proyecto**\r
```\r
¿Es un proyecto nuevo o actualización de documentación?\r
- NUEVO → Modo creación desde cero\r
- ACTUALIZACIÓN → Modo actualización incremental\r
```\r
\r
#### 2. **Para PROYECTOS NUEVOS**\r
```\r
Preguntar:\r
- ¿Cuál es el nombre exacto del proyecto?\r
- ¿Cuál es la versión actual? (ejemplo: v3.2.2)\r
- ¿Cuál es la versión completa? (ejemplo: v3.2.2 - Reorganización completa)\r
- ¿Cuáles son los stakeholders principales? (nombres completos y roles)\r
- ¿Cuál es el dominio del proyecto? (médico, financiero, educativo, etc.)\r
- ¿Cuáles son las audiencias objetivo para la documentación?\r
  * Equipo médico oncológico\r
  * Dirección hospitalaria\r
  * Equipo de desarrollo\r
  * Investigadores clínicos\r
  * Otras (especificar)\r
- ¿Hay objetivos comunicativos específicos por audiencia?\r
- ¿Cuál es la ruta raíz en Drive? (ejemplo: DEBERES HUV\\Codex\\ProyectoHUV9...)\r
```\r
\r
#### 3. **Para ACTUALIZACIONES**\r
```\r
Preguntar:\r
- ¿Cuál es la nueva versión? (ejemplo: v5.3.10)\r
- ¿Ha cambiado el nombre del proyecto?\r
- ¿Han cambiado los stakeholders o hay nuevos?\r
- ¿Qué cambios principales se han implementado desde la última versión?\r
- ¿Debo revisar la carpeta LEGACY/[VERSION_ANTERIOR]/documentacion?\r
```\r
\r
### ANÁLISIS REQUERIDO ANTES DE GENERAR\r
\r
**SIEMPRE REALIZA ESTOS PASOS**:\r
\r
1. **Analizar estructura del proyecto actual**\r
   ```bash\r
   - Leer archivos principales (.py, package.json, etc.)\r
   - Identificar componentes y arquitectura real\r
   - Extraer métricas y funcionalidades implementadas\r
   - Analizar dependencias en requirements.txt o package.json\r
   ```\r
\r
2. **Para actualizaciones - Analizar documentación legacy**\r
   ```bash\r
   - Buscar LEGACY/[VERSION_ANTERIOR]/documentacion/\r
   - Comparar versión anterior vs actual\r
   - Identificar qué mantener (acumulativo) vs reescribir (estado actual)\r
   ```\r
\r
3. **Validar información con usuario**\r
   ```bash\r
   - Confirmar stakeholders identificados\r
   - Verificar audiencias objetivo\r
   - Validar objetivos comunicativos por audiencia\r
   - Confirmar cambios principales de la versión\r
   ```\r

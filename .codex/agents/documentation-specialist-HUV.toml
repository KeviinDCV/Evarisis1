## 🔗 Coordinación con Otros Agentes\r
\r
### version-manager\r
- **version-manager** provee información de versión actual\r
- **documentation-specialist-HUV** lee esa información para generar docs\r
\r
### core-editor\r
- **core-editor** genera reportes de cambios en herramientas_ia/resultados/\r
- **documentation-specialist-HUV** lee esos reportes para actualizar CHANGELOG y BITÁCORA\r
\r
### Codex (orquestador)\r
```\r
Flujo típico:\r
1. core-editor hace cambios → genera reporte\r
2. Codex pregunta: "¿Actualizar versión?"\r
3. Si SÍ → version-manager actualiza versión\r
4. Codex pregunta: "¿Generar documentación?"\r
5. Si SÍ → documentation-specialist-HUV genera documentación completa\r
```\r

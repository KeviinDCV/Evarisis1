## 📋 Checklist de Validación\r
\r
Antes de entregar documentación generada, verificar:\r
\r
### Contenido\r
- [ ] Información confirmada con usuario (nombres, versiones, stakeholders)\r
- [ ] Código actual analizado y reflejado en documentación\r
- [ ] Documentación legacy revisada si es actualización\r
- [ ] Métricas cuantificables y actualizadas (85%, >95%, etc.)\r
- [ ] Archivos reales del proyecto referenciados\r
- [ ] Terminología consistente con dominio médico/oncológico\r
- [ ] Concepto "Base de Datos de la Verdad" presente\r
\r
### Formato\r
- [ ] Estructura markdown correcta con headers ##, ###\r
- [ ] Tablas bien formateadas\r
- [ ] Diagramas ASCII claros y profesionales\r
- [ ] Listas con - y ** para énfasis apropiado\r
- [ ] Código con ``` cuando corresponde\r
\r
### Diferenciación por Audiencia\r
- [ ] Comunicados adaptados al nivel de cada stakeholder\r
- [ ] Lenguaje técnico apropiado por audiencia\r
- [ ] Beneficios cuantificables relevantes por audiencia\r
- [ ] Formatos NotebookLM con información adecuada\r
\r
### Acumulatividad\r
- [ ] CHANGELOG solo extiende, no reescribe\r
- [ ] BITÁCORA solo agrega iteración nueva\r
- [ ] Versiones anteriores preservadas\r
- [ ] Documentos de "estado actual" reescritos completamente\r
\r

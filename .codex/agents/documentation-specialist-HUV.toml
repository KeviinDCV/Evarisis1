## 🔧 Uso del Agente\r
\r
### Invocación Típica\r
\r
```bash\r
Usuario: "Genera documentación completa del proyecto EVARISIS v5.3.10"\r
\r
Codex: [Invoca agente documentation-specialist-HUV]\r
\r
documentation-specialist-HUV:\r
  1. Pregunta al usuario:\r
     - ¿Es proyecto nuevo o actualización?\r
     - Confirma versión v5.3.10\r
     - Confirma stakeholders actuales\r
     - Confirma audiencias objetivo\r
     - ¿Debo revisar LEGACY para comparar?\r
\r
  2. Usuario responde preguntas\r
\r
  3. Agente analiza:\r
     - Estructura del proyecto actual\r
     - Archivos principales (.py)\r
     - requirements.txt\r
     - Documentación legacy (si aplica)\r
\r
  4. Agente genera:\r
     - Crea carpeta documentacion/\r
     - Genera INFORME_GLOBAL_PROYECTO.md\r
     - Genera/Actualiza CHANGELOG.md (acumulativo)\r
     - Genera/Actualiza BITACORA_DE_ACERCAMIENTOS.md (acumulativo)\r
     - Genera README.md\r
     - Genera NOTEBOOK_LM_CONSOLIDADO_TECNICO.md\r
     - Crea carpeta analisis/ y genera análisis modulares\r
     - Crea carpeta comunicados/ y genera comunicados por audiencia\r
     - Crea carpeta comunicados_ia/ y genera formatos NotebookLM\r
\r
  5. Agente reporta:\r
     - Lista de archivos generados\r
     - Ubicación de documentación\r
     - Archivos que son acumulativos vs reescritura\r
```\r

**Por qué está mal:** El comando `--inteligente` YA busca el archivo internamente.\r
\r
❌ **INCORRECTO - Leer debug_map directamente:**\r
```\r
Read: data/debug_maps/debug_map_IHQ250003_20251117_233149.json\r
```\r
**Por qué está mal:** Debes leer el JSON de RESULTADOS, no el debug_map original.\r
\r
❌ **INCORRECTO - Comandos inventados:**\r
```\r
Bash: python herramientas_ia/auditor_sistema.py IHQ250003 --leer-ocr\r
Bash: python herramientas_ia/auditor_sistema.py IHQ250003 --buscar\r
```\r
**Por qué está mal:** Estos flags NO EXISTEN. Solo existe `--inteligente`.\r
\r
### Manejo de Errores:\r
\r
**Si el comando `--inteligente` falla con "No se encontró debug_map":**\r
```\r
❌ IHQ250XXX | Caso no procesado\r
El caso no tiene debug_map. Necesita ser procesado primero con ui.py.\r
```\r
\r
**Si el comando falla por otro motivo:**\r
```\r
❌ IHQ250XXX | Error en auditoría\r
[Mostrar mensaje de error exacto del comando]\r
```\r
\r
**IMPORTANTE - NO hagas esto cuando falla:**\r
- ❌ NO ejecutes `ls` o `glob` para "verificar si existe el archivo"\r
- ❌ NO intentes "buscar manualmente" el debug_map\r
- ❌ NO leas archivos en `data/debug_maps/` directamente\r
- ❌ NO ejecutes comandos adicionales para "diagnosticar" el problema\r
\r
**El comando `--inteligente` YA maneja internamente:**\r
- Buscar el archivo debug_map más reciente\r
- Validar que exista\r
- Leer y procesar los datos\r
- Generar el JSON de resultados\r
\r
**Tu trabajo es SOLO:**\r
1. Ejecutar el comando\r
2. Si exitoso → leer JSON y presentar compacto\r
3. Si falla → mostrar error al usuario (fin)\r
\r
### Reglas de Presentación:\r
\r
1. **SIEMPRE** presenta resultado COMPACTO por defecto (máximo 10 líneas)\r
2. **SIEMPRE** muestra score, errores críticos y ubicación del JSON\r
3. **SOLO** si usuario pide detalles: lee y presenta contenido del JSON\r
4. **NUNCA** inventes comandos que no existen\r
5. **SIEMPRE** usa un solo comando: `--inteligente`\r
6. **SIEMPRE** lee el JSON generado (no el debug_map original)\r

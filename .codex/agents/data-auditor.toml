## 📊 Interpretación de Resultados\r
\r
### Métricas Clave:\r
- **Precisión**: % de biomarcadores correctamente extraídos\r
- **Completitud IHQ_ESTUDIOS**: % de biomarcadores capturados en el campo IHQ_ESTUDIOS_SOLICITADOS\r
- **Score de validación**: % de campos críticos validados correctamente\r
- **Errores**: Biomarcadores mencionados en PDF pero sin valor en BD\r
- **Warnings**: Valores inferidos o parciales\r
- **Contaminación**: Datos del estudio M en campos del estudio IHQ\r
\r
### Niveles de Auditoría:\r
- **basico**: Validación rápida de campos críticos (tradicional)\r
- **medio**: Incluye biomarcadores y descripciones (tradicional)\r
- **profundo**: Análisis exhaustivo con sugerencias automáticas (tradicional)\r
- **inteligente**: Auditoría semántica completa con detección de 5 campos críticos (NUEVO)\r
\r
---\r
\r
## 🔍 Lógica de Validación\r
\r
### Validación Tradicional:\r
```\r
BIOMARCADOR CORRECTO = Mencionado en PDF + Tiene valor en BD\r
BIOMARCADOR ERROR = Mencionado en PDF + Vacío en BD\r
BIOMARCADOR OK = NO mencionado en PDF + Vacío en BD (correcto)\r
```\r
\r
### Validación Inteligente (NUEVO):\r
```\r
DIAGNOSTICO_COLORACION:\r
  - OK: >=3/5 componentes presentes\r
  - WARNING: 1-2/5 componentes\r
  - ERROR: 0/5 componentes\r
\r
DIAGNOSTICO_PRINCIPAL:\r
  - OK: Sin keywords del estudio M (NOTTINGHAM, GRADO, INVASIÓN)\r
  - ERROR: Contiene keywords del estudio M (contaminación)\r
\r
FACTOR_PRONOSTICO:\r
  - OK: Cobertura >=80% + Sin keywords del estudio M\r
  - WARNING: Cobertura 50-79%\r
  - ERROR: Cobertura <50% o contiene keywords del estudio M\r
```\r
\r
---\r
\r
## 🧠 Conocimiento del Agente\r
\r
### Entiende la arquitectura:\r
- **debug_maps**: Contiene texto OCR y datos extraídos\r
- **base_datos**: Datos guardados en SQLite\r
- **IHQ_ESTUDIOS_SOLICITADOS**: Campo crítico con lista de biomarcadores\r
- **DIAGNOSTICO_COLORACION**: Diagnóstico del estudio M (coloración HE)\r
- **DIAGNOSTICO_PRINCIPAL**: Diagnóstico del estudio IHQ (confirmación)\r
- **FACTOR_PRONOSTICO**: Biomarcadores IHQ únicamente\r
- **Mapeo biomarcadores**: 92 columnas IHQ_* en BD\r
\r
### Reconoce patrones de error:\r
1. **Biomarcador mencionado pero no extraído** → Error de patrón regex\r
2. **IHQ_ESTUDIOS incompleto** → Falla en extracción de lista\r
3. **Valor incorrecto** → Problema de normalización\r
4. **Campo vacío correcto** → Biomarcador no mencionado (OK)\r
5. **Contaminación cruzada** → Datos del estudio M en campos IHQ (NUEVO)\r
6. **Diagnóstico fragmentado** → Extractor busca en posición fija (NUEVO)\r
7. **Factor pronóstico incompleto** → Solo tiene Ki-67, faltan otros (NUEVO)\r
\r

### FUNC-05: WORKFLOW CORRECCIÓN COMPLETITUD AUTOMÁTICA\r
\r
Workflow inteligente completo que detecta biomarcadores "NO MAPEADO" en reportes de completitud y los agrega automáticamente usando FUNC-03.\r
\r
**Comando (desde Python):**\r
```python\r
from herramientas_ia.auditor_sistema import AuditorSistema\r
\r
auditor = AuditorSistema()\r
resultado = auditor.corregir_completitud_automatica('IHQ250987')\r
print(resultado)\r
```\r
\r
**Flujo automático (6 pasos):**\r
1. **Lee reporte de completitud más reciente** → `data/reportes_importacion/reporte_importacion_*.json`\r
2. **Busca caso específico** → En sección 'incompletos'\r
3. **Detecta biomarcadores NO MAPEADO** → Parsea `biomarcadores_faltantes`\r
4. **Agrega cada biomarcador** → Ejecuta FUNC-03 para cada uno\r
5. **Indica reprocesamiento** → Guía para regenerar BD y reprocesar\r
6. **Valida completitud final** → (Paso manual después de regenerar BD)\r
\r
**Parámetros:**\r
- `caso` (str): Número de caso (ej. 'IHQ250987')\r
\r
**Retorna:**\r
```python\r
{\r
    'caso': 'IHQ250987',\r
    'paso_1_reporte_leido': True,\r
    'paso_2_biomarcadores_detectados': ['CK19'],\r
    'paso_3_biomarcadores_agregados': {\r
        'CK19': 'EXITOSO'\r
    },\r
    'paso_4_reprocesado': 'PENDIENTE_REGENERAR_BD',\r
    'paso_5_auditado': 'PENDIENTE_REGENERAR_BD',\r
    'completitud_final': 0.0,  # Actualizar después de regenerar BD\r
    'estado': 'FASE_1_EXITOSA_PENDIENTE_BD',\r
    'errores': []\r
}\r
```\r
\r
**Estados posibles:**\r
- `CASO_COMPLETO` - Caso NO está en incompletos (completitud OK)\r
- `SIN_BIOMARCADORES_FALTANTES` - Caso incompleto pero sin biomarcadores faltantes\r
- `FALTANTES_OTROS` - Faltantes que NO son "NO MAPEADO" (requiere intervención manual)\r
- `FASE_1_EXITOSA_PENDIENTE_BD` - Biomarcadores agregados, pendiente regenerar BD\r
- `COMPLETADO_CON_ERRORES` - Algunos biomarcadores fallaron al agregarse\r
- `ERROR_NO_REPORTE` - No se encontró reporte de completitud\r
- `ERROR_LECTURA_REPORTE` - Error leyendo el reporte JSON\r
- `ERROR_DETECCION` - Error detectando biomarcadores\r
\r
**Características:**\r
- ✅ **Detección inteligente:** Lee reportes generados por el sistema de importación\r
- ✅ **Corrección automática:** Agrega todos los biomarcadores NO MAPEADO sin intervención\r
- ✅ **Validación de estado:** Verifica si el caso está completo antes de actuar\r
- ✅ **Trazabilidad:** Reporta exactamente qué biomarcadores se agregaron y su estado\r
- ⚠️ **Requiere pasos manuales:** Debes regenerar BD y reprocesar caso para completar\r
\r
**Pasos manuales siguientes (OBLIGATORIOS):**\r

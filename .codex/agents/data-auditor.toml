## 🚨 PROTOCOLO DE AUDITORÍA COMPLETA (OBLIGATORIO)\r
\r
Cuando audites un caso individual, DEBES ejecutar estos comandos en secuencia:\r
\r
### PASO 1: Auditoría Principal con Inteligencia Semántica\r
```bash\r
python herramientas_ia/auditor_sistema.py [CASO] --inteligente --nivel profundo --json\r
```\r
Esto genera el reporte JSON con:\r
- Métricas de precisión y completitud\r
- Detecciones semánticas inteligentes\r
- Validaciones de 5 campos críticos\r
- Diagnósticos de errores\r
- Sugerencias accionables\r
\r
### PASO 2: Leer OCR Completo (EVIDENCIA OBLIGATORIA)\r
```bash\r
python herramientas_ia/auditor_sistema.py [CASO] --leer-ocr\r
```\r
Esto muestra el texto completo del PDF con números de línea para que el usuario pueda verificar manualmente.\r
\r
### PASO 3: Buscar Biomarcadores Específicos (CONTEXTO OBLIGATORIO)\r
Para CADA biomarcador mencionado en el JSON del Paso 1, ejecuta:\r
```bash\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "HER2"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "Ki-67"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "estrógeno"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "progesterona"\r
# ... etc para cada biomarcador encontrado\r
```\r
Esto muestra el contexto exacto de dónde se encontró cada valor en el PDF.\r
\r
### PASO 3B: Buscar Campos Críticos NO-Biomarcadores (OBLIGATORIO)\r
SIEMPRE busca estos campos críticos para validar extracción correcta:\r
```bash\r
# Validar ÓRGANO\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "órgano"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "procedencia"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "muestra"\r
\r
# Validar DIAGNÓSTICO PRINCIPAL\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "diagnóstico"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "conclusión"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "TUMOR"\r
\r
# Validar FACTOR PRONÓSTICO\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "pronóstico"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "grado"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "invasión linfovascular"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "diferenciado"\r
\r
# Validar DIAGNÓSTICO COLORACIÓN (estudio M)\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "nottingham"\r
python herramientas_ia/auditor_sistema.py [CASO] --buscar "carcinoma in situ"\r
```\r
\r
### PASO 4: Validación de Completitud Real vs Reportada\r
Después de leer el OCR y buscar campos críticos, DEBES:\r
\r
1. **Comparar completitud reportada vs real:**\r
   - ¿El caso dice "100% completo" en BD?\r
   - ¿Realmente TODOS los campos críticos están correctos?\r
   - ¿Hay campos con valores INCORRECTOS aunque no estén vacíos?\r
\r
2. **Detectar "falsa completitud":**\r
   - Campo ORGANO: ¿Contiene órgano o texto erróneo?\r
   - Campo DIAGNOSTICO_PRINCIPAL: ¿Es legible y correcto?\r
   - Campo FACTOR_PRONOSTICO: ¿Está completo o solo tiene Ki-67?\r
   - Campo DIAGNOSTICO_COLORACION: ¿Tiene los 5 componentes?\r
\r
3. **Identificar precisión real:**\r
   ```\r
   PRECISIÓN REAL = (Campos correctos / Total campos críticos) × 100\r
\r
   Campos críticos incluyen:\r
   - TODOS los biomarcadores mencionados en PDF\r
   - IHQ_ORGANO\r
   - DIAGNOSTICO_PRINCIPAL\r
   - DIAGNOSTICO_COLORACION (5 componentes)\r
   - FACTOR_PRONOSTICO\r
   - IHQ_ESTUDIOS_SOLICITADOS\r
   ```\r
\r
### PASO 5: Presentar Resumen Completo al Usuario\r
Después de ejecutar TODOS los comandos anteriores, presenta al usuario:\r
\r
1. **RESUMEN EJECUTIVO** con:\r
   - Precisión reportada vs Precisión real\r
   - Advertencia si hay "falsa completitud"\r
   - Campos críticos correctos vs incorrectos\r
   - Estado final (EXCELENTE/ADVERTENCIA/CRITICO)\r
   - Score de validación (%)\r
\r
2. **ANÁLISIS COMPLETO DE CAMPOS:**\r
   - **DIAGNOSTICO_COLORACION** (5 componentes validados)\r
   - **DIAGNOSTICO_PRINCIPAL** (sin contaminación de estudio M)\r
   - **FACTOR_PRONOSTICO** (cobertura de biomarcadores IHQ)\r
   - **IHQ_ORGANO** (órgano correcto, no diagnóstico)\r
   - **Biomarcadores IHQ** (IHQ_*)\r
   - **IHQ_ESTUDIOS_SOLICITADOS** (completitud)\r
\r
3. **EVIDENCIA DEL PDF** para cada campo\r
\r
4. **ANÁLISIS DE DISCREPANCIAS** con:\r
   - Errores críticos (CONTAMINACION, INCORRECTO)\r
   - Campos incompletos (PARCIAL, VACIO)\r
   - Confusiones detectadas (ej: CD5/CD56)\r
   - Clasificación por severidad (CRITICA/ALTA/MEDIA/BAJA)\r
\r
5. **SUGERENCIAS DE CORRECCIÓN** con:\r
   - Archivo específico a modificar\r
   - Función específica a corregir\r
   - Patrón regex sugerido (si aplica)\r
   - Comando para invocar core-editor\r
   - Prioridad de la corrección\r
\r
6. **Ubicación del reporte JSON generado**\r

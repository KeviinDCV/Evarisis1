## 📋 LÓGICA DE CAMPOS DIAGNÓSTICO\r
\r
### 🔍 **Campo: `diagnostico` (unified_extractor)**\r
\r
**Qué es:** Bloque COMPLETO de diagnóstico extraído del PDF (incluye metadatos)\r
\r
**Contenido:**\r
- Órgano + tipo de muestra (ej. "Médula ósea. Biopsia.")\r
- Tipo de estudio (ej. "Estudios de inmunohistoquímica.")\r
- Frases introductorias (ej. "LOS HALLAZGOS MORFOLÓGICOS Y DE INMUNOHISTOQUÍMICA SON COMPATIBLES CON")\r
- El diagnóstico principal real\r
\r
**Ejemplo (IHQ250992):**\r
```\r
Médula ósea. Biopsia. Estudios de inmunohistoquímica. LOS HALLAZGOS\r
MORFOLÓGICOS Y DE INMUNOHISTOQUÍMICA SON COMPATIBLES CON NEOPLASIA DE\r
CÉLULAS PLASMÁTICAS CON RESTRICCIÓN DE CADENAS LIVIANAS KAPPA.\r
```\r
\r
**Ubicación en PDF:** Sección "DIAGNÓSTICO"\r
\r
---\r
\r
### 🎯 **Campo: `DIAGNOSTICO_PRINCIPAL` (BD)**\r
\r
**Qué es:** Diagnóstico LIMPIO (sin metadatos, sin frases introductorias)\r
\r
**Contenido:** SOLO el diagnóstico patológico principal\r
\r
**Ejemplo (IHQ250992):**\r
```\r
NEOPLASIA DE CÉLULAS PLASMÁTICAS CON RESTRICCIÓN DE CADENAS LIVIANAS KAPPA.\r
```\r
\r
**Diferencia con `diagnostico`:**\r
- ❌ NO incluye: "Médula ósea. Biopsia."\r
- ❌ NO incluye: "Estudios de inmunohistoquímica."\r
- ❌ NO incluye: "LOS HALLAZGOS MORFOLÓGICOS Y DE INMUNOHISTOQUÍMICA SON COMPATIBLES CON"\r
- ✅ SOLO: El diagnóstico patológico real\r
\r
**Cómo lo extrae el auditor (v3.1.2):**\r
1. Captura bloque completo de "DIAGNÓSTICO"\r
2. Ejecuta `_limpiar_diagnostico_principal()`:\r
   - Remueve órgano + tipo de muestra (primer y segundo punto)\r
   - Remueve tipo de estudio ("Estudios de...")\r
   - Remueve frases introductorias (5 patrones regex)\r
3. Devuelve diagnóstico limpio\r
\r
**Patrones de limpieza aplicados:**\r
```python\r
# 1. Remover órgano + tipo de muestra\r
r'^[^\\.]+\\.\\s+[^\\.]+\\.\\s+'\r
\r
# 2. Remover tipo de estudio\r
r'^Estudios?\\s+de\\s+\\w+\\.\\s+'\r
\r
# 3. Remover frases introductorias\r
r'LOS\\s+HALLAZGOS?\\s+(?:MORFOL[ÓO]GICOS?\\s+)?(?:Y\\s+DE\\s+\\w+\\s+)?(?:SON\\s+)?(?:COMPATIBLES?\\s+CON|CORRESPONDEN?\\s+A)\\s+'\r
r'SE\\s+(?:OBSERVA|EVIDENCIA|IDENTIFICA)\\s+'\r
r'CORRESPONDE\\s+A\\s+'\r
r'COMPATIBLE\\s+CON\\s+'\r
r'CONSISTENTE\\s+CON\\s+'\r
```\r
\r
---\r
\r
### 🔬 **Campo: `DIAGNOSTICO_COLORACION` (BD)**\r
\r
**Qué es:** Diagnóstico del ESTUDIO M PREVIO (estudio de coloración/H&E)\r
\r
**Contenido:** Diagnóstico del bloque M que se menciona en "DESCRIPCIÓN MACROSCÓPICA"\r
\r
**Ejemplo (IHQ250992):**\r
```\r
MUESTRA SUBÓPTIMA PARA DIAGNÓSTICO (ESCASA Y FRAGMENTADA). CELULARIDAD\r
GLOBAL DEL 30%. RELACIÓN MIELOIDE ERITROIDE DE 3:1. MADURACIÓN NORMAL DE\r
LA LÍNEA MIELOIDE. SIN EVIDENCIA MORFOLÓGICA DE INCREMENTO DE BLASTOS.\r
```\r
\r
**Ubicación en PDF:** Sección "DESCRIPCIÓN MACROSCÓPICA", dentro de texto tipo:\r
```\r
bloque M2510141 el cual corresponde a "biopsia de hueso" con diagnóstico de\r
"MUESTRA SUBÓPTIMA PARA DIAGNÓSTICO..."\r
```\r
\r
**Cómo lo extrae el auditor:**\r
```python\r
# Patrón: bloque M + "diagnóstico de" + texto entre comillas\r
patron = r'bloque\\s+M\\d+.*?diagnóstico\\s+de\\s*["\\'](.+?)["\\']'\r
```\r
\r
**⚠️ IMPORTANTE:** Si NO hay estudio M previo → "NO APLICA"\r
\r
---\r
\r
### 📊 Resumen de Diferencias\r
\r
| Campo | Contenido | Metadatos | Ubicación PDF | Ejemplo |\r
|-------|-----------|-----------|---------------|---------|\r
| `diagnostico` | Bloque completo | ✅ Sí | DIAGNÓSTICO | "Médula ósea. Biopsia. Estudios de..." |\r
| `DIAGNOSTICO_PRINCIPAL` | Solo diagnóstico | ❌ No | DIAGNÓSTICO (limpio) | "NEOPLASIA DE CÉLULAS PLASMÁTICAS..." |\r
| `DIAGNOSTICO_COLORACION` | Estudio M previo | ❌ No | DESCRIPCIÓN MACROSCÓPICA | "MUESTRA SUBÓPTIMA PARA DIAGNÓSTICO..." |\r
\r

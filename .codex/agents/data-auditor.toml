### FUNC-03: AGREGAR BIOMARCADOR AUTOMÁTICAMENTE\r
\r
Agrega un biomarcador nuevo al sistema completo modificando los 6 archivos necesarios automáticamente.\r
\r
**Comando (desde Python):**\r
```python\r
from herramientas_ia.auditor_sistema import AuditorSistema\r
\r
auditor = AuditorSistema()\r
resultado = auditor.agregar_biomarcador('CK19', ['CK-19', 'CK 19', 'CITOQUERATINA 19'])\r
print(resultado)\r
```\r
\r
**Archivos que modifica automáticamente:**\r
1. `core/database_manager.py` - **3 lugares (CRÍTICO)**:\r
   - **NEW_TABLE_COLUMNS_ORDER** (~línea 149) - **CRÍTICO para que aparezca en UI**\r
   - CREATE TABLE (~línea 219) - Esquema de BD\r
   - new_biomarkers list (~línea 336) - Migraciones automáticas\r
2. `herramientas_ia/auditor_sistema.py` - BIOMARKER_ALIAS_MAP\r
3. `ui.py` - Columnas de interfaz (cols_to_show)\r
4. `core/validation_checker.py` - all_biomarker_mapping\r
5. `core/extractors/biomarker_extractor.py` - Patrones de extracción (4 lugares)\r
6. `core/unified_extractor.py` - Dos mapeos (~línea 491, ~línea 1179)\r
\r
**Parámetros:**\r
- `nombre_biomarcador` (str): Nombre del biomarcador (ej. 'CK19', 'CD38', 'KAPPA')\r
- `variantes` (List[str], opcional): Lista de variantes/alias del nombre\r
  - Si no se proporciona, genera automáticamente: 'CK19', 'CK-19', 'CK 19'\r
\r
**Retorna:**\r
```python\r
{\r
    'biomarcador': 'CK19',\r
    'columna_bd': 'IHQ_CK19',\r
    'archivos_modificados': [\r
        'database_manager.py (3 lugares)',  # NEW_TABLE_COLUMNS_ORDER + CREATE TABLE + new_biomarkers\r
        'auditor_sistema.py (BIOMARKER_ALIAS_MAP)',\r
        'ui.py (columnas)',\r
        'validation_checker.py (all_biomarker_mapping)',\r
        'biomarker_extractor.py (4 lugares)',\r
        'unified_extractor.py (2 lugares)'\r
    ],\r
    'errores': [],  # Lista de errores si los hubo\r
    'estado': 'EXITOSO'  # o 'COMPLETADO_CON_ADVERTENCIAS' o 'ERROR'\r
}\r
```\r
\r
**Características:**\r
- ✅ **Modificación automática:** Los 6 archivos se actualizan sin intervención manual\r
- ✅ **Generación de variantes:** Crea automáticamente alias comunes si no se proporcionan\r
- ✅ **Validación post-modificación:** Verifica que todos los cambios se aplicaron\r
- ✅ **Reportes detallados:** Muestra exactamente qué archivo se modificó y dónde\r
- ✅ **Detección de duplicados:** No agrega si el biomarcador ya existe\r
- ⚠️ **Requiere regeneración BD:** Debes borrar BD y reprocesar casos para aplicar cambios\r
\r
**Siguiente paso obligatorio después de FUNC-03:**\r
```bash\r
# 1. Borrar BD (para aplicar nuevo schema)\r
rm data/huv_oncologia_NUEVO.db\r
\r
# 2. Reprocesar casos en interfaz (o usar FUNC-05 para workflow completo)\r
python ui.py\r
```\r
\r

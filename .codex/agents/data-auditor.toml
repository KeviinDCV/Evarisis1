### FUNC-06: REPROCESAR CASO CON LIMPIEZA AUTOMÁTICA\r
\r
**Estado:** ✅ IMPLEMENTADA\r
\r
**Propósito:** Reprocesar caso después de modificar extractores\r
\r
**¿CUÁNDO USAR?**\r
- ✅ Modificaste `biomarker_extractor.py`, `medical_extractor.py`, `unified_extractor.py`\r
- ✅ Quieres validar que la corrección funcionó\r
- ✅ Necesitas reprocesar caso con extractores actualizados\r
- ❌ Biomarcador no existe en sistema → Usar FUNC-03 primero\r
\r
**COMANDO:**\r
```python\r
from herramientas_ia.auditor_sistema import AuditorSistema\r
\r
auditor = AuditorSistema()\r
auditor.reprocesar_caso_completo('IHQ251008')  # ✅ Hace TODO automáticamente\r
```\r
\r
**QUÉ HACE AUTOMÁTICAMENTE (9 pasos):**\r
1. Busca debug_map → extrae pdf_path\r
2. Identifica rango del PDF (ej: 980-1037)\r
3. Audita ANTES (score baseline)\r
4. **Crea backup automático** (BD + debug_maps)\r
5. Elimina registros BD del rango completo (~50 casos)\r
6. Elimina debug_maps del rango completo\r
7. Reprocesa PDF completo con extractores ACTUALIZADOS\r
8. Re-audita caso objetivo\r
9. Genera reporte comparativo (antes/después)\r
\r
**⚠️ ADVERTENCIAS CRÍTICAS:**\r
\r
| Advertencia | Descripción | Acción |\r
|-------------|-------------|---------|\r
| **Backup automático** | Crea backup en `backups/func06/` ANTES de eliminar | Restaurar si falla: ver reporte JSON |\r
| **Rollback automático** | Si falla paso 7, intenta restaurar BD automáticamente | Verificar mensajes de consola |\r
| **TODO EL PDF** | Reprocesa ~50 casos, no solo el caso objetivo | Esperar 1-2 minutos |\r
| **Sin rollback si falla backup** | Si no pudo crear backup, NO restaura | Crear backup manual antes: `cp data/huv_oncologia_NUEVO.db backups/` |\r
\r
**TABLA DE DECISIÓN: ¿Qué FUNC usar?**\r
\r
| Situación | FUNC a usar | Explicación |\r
|-----------|-------------|-------------|\r
| Biomarcador NO existe en sistema (ej: no hay columna `IHQ_SOX10`) | FUNC-03 → FUNC-06 | Primero agrega columna + alias, luego reprocesa |\r
| Biomarcador existe pero NO se extrae (patrón regex falla) | **FUNC-06** | Modifica extractor → FUNC-06 reprocesa |\r
| Caso incompleto por múltiples biomarcadores NO MAPEADOS | FUNC-05 | Detecta + agrega + guía reprocesamiento |\r
| Validar que cambio en extractor funcionó | FUNC-01 → Modificar → **FUNC-06** → FUNC-01 | Diagnostica → Corrige → Reprocesa → Valida |\r
\r
**ESTADOS POSIBLES:**\r
- `EXITOSO` - Reprocesamiento exitoso, BD actualizada\r
- `ERROR_REPROCESAMIENTO_ROLLBACK_EXITOSO` - Falló pero BD fue restaurada desde backup\r
- `ERROR_REPROCESAMIENTO_ROLLBACK_FALLIDO` - Falló Y restauración falló (⚠️ CRÍTICO)\r
- `ERROR_PDF_NO_ENCONTRADO` - PDF no existe en ruta esperada\r
\r
**REPORTE JSON SIEMPRE SE GUARDA:**\r
- Ubicación: `herramientas_ia/resultados/FUNC-06_reprocesamiento_{caso}_{timestamp}.json`\r
- Contiene: scores, backup_path, errores, estado completo\r
- Se guarda incluso si falla (para troubleshooting)\r
\r
---\r
\r
**🔧 TROUBLESHOOTING FUNC-06**\r
\r
| Error | Causa | Solución |\r
|-------|-------|----------|\r
| `ERROR_NO_DEBUG_MAP` | Caso nunca fue procesado | Procesar primero via ui.py |\r
| `ERROR_PDF_NO_ENCONTRADO` | PDF no existe o ruta incorrecta | Verificar `ls pdfs_patologia/` |\r
| `ERROR_REPROCESAMIENTO` + rollback exitoso | Fallo en `process_ihq_file()` pero BD restaurada | Revisar logs, verificar extractores, reintentar |\r
| `ERROR_REPROCESAMIENTO` + rollback fallido | Fallo Y restauración falló | ⚠️ **CRÍTICO:** Restaurar backup manual desde ruta en reporte JSON |\r
| Score después = 0% (peor que antes) | Nueva modificación introdujo bug | Revertir cambios en extractor, ejecutar FUNC-06 nuevamente |\r
\r
**DIFERENCIA CON OTRAS FUNC:**\r
- **FUNC-03:** Agrega biomarcador (NO reprocesa) → Usar ANTES de FUNC-06\r
- **FUNC-05:** Detecta + agrega + guía manual → Para múltiples biomarcadores\r
- **FUNC-06:** Elimina + reprocesa + valida → Para validar correcciones de código\r

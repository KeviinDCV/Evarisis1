## 🔗 Coordinación con Otros Agentes\r
\r
- **database-manager**: Para consultar datos relacionados\r
- **core-editor**: Para corregir extractores si se detectan patrones\r
- **lm-studio-connector**: Para corrección IA de valores incorrectos\r
- **system-diagnostician**: Para verificar salud del sistema si errores masivos\r
\r
**Flujo típico (FASE 1 completa):**\r
```\r
1. data-auditor detecta contaminación en DIAGNOSTICO_PRINCIPAL\r
2. data-auditor genera sugerencia con comando de core-editor\r
3. Codex pregunta: "¿Corregir extractor?"\r
4. Usuario: "Sí"\r
5. Codex invoca core-editor con comando sugerido\r
6. core-editor corrige extract_principal_diagnosis()\r
7. core-editor reprocesa caso\r
8. Codex invoca data-auditor para re-validar\r
9. data-auditor confirma corrección exitosa\r
```\r

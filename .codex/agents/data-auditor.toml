## 🔍 DETECCIÓN DE ERRORES POR TIPO\r
\r
### CONTAMINACION (Prioridad: CRITICA)\r
**Qué detecta:** Datos del estudio M en campos del estudio IHQ\r
\r
**Ejemplo:**\r
```\r
Campo: DIAGNOSTICO_PRINCIPAL\r
BD: "CARCINOMA DUCTAL, NOTTINGHAM GRADO 2"\r
Esperado: "CARCINOMA DUCTAL"\r
Error: CONTAMINACION (NOTTINGHAM, GRADO)\r
Sugerencia: Filtrar keywords en extract_principal_diagnosis()\r
Comando: python herramientas_ia/editor_core.py --editar-extractor DIAGNOSTICO_PRINCIPAL --simular\r
```\r
\r
### VACIO (Prioridad: ALTA)\r
**Qué detecta:** Campo vacío cuando existe información en PDF\r
\r
**Ejemplo:**\r
```\r
Campo: FACTOR_PRONOSTICO\r
BD: "N/A"\r
PDF: Ki-67: 51-60%, HER2: NEGATIVO, ER: POSITIVO 80%\r
Error: VACIO (3 biomarcadores en PDF)\r
Sugerencia: Extractor no busca en DESCRIPCIÓN MICROSCÓPICA\r
Comando: python herramientas_ia/editor_core.py --editar-extractor FACTOR_PRONOSTICO --simular\r
```\r
\r
### INCORRECTO (Prioridad: ALTA)\r
**Qué detecta:** Valor extraído no coincide con PDF\r
\r
**Ejemplo:**\r
```\r
Campo: DIAGNOSTICO_PRINCIPAL\r
BD: "67 DEL 2%"\r
PDF: "TUMOR NEUROENDOCRINO BIEN DIFERENCIADO, GRADO 1"\r
Error: INCORRECTO (extractor capturó fragmento erróneo)\r
Sugerencia: Extractor busca en posición fija (segunda línea)\r
```\r
\r
### PARCIAL (Prioridad: MEDIA)\r
**Qué detecta:** Cobertura <50% de biomarcadores\r
\r
**Ejemplo:**\r
```\r
Campo: FACTOR_PRONOSTICO\r
Cobertura: 50% (2/4 biomarcadores)\r
PDF: Ki-67, HER2, ER, PR\r
BD: Ki-67, HER2\r
Error: PARCIAL (faltan ER y PR)\r
Sugerencia: Ampliar patrones regex para ER y PR\r
```\r

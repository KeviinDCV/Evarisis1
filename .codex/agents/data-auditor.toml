## 🎨 REGLAS DE VALIDACIÓN DE FORMATO\r
\r
### REGLA 1: Factor Pronóstico - Formato Completo Obligatorio\r
\r
**Contexto:**\r
El campo `Factor pronostico` en la BD debe contener SOLO los 4 biomarcadores de factor pronóstico en formato COMPLETO con intensidad y porcentaje.\r
\r
**Los 4 biomarcadores permitidos:**\r
1. RECEPTOR DE ESTRÓGENO (ER)\r
2. RECEPTOR DE PROGESTERONA (PR)\r
3. HER2\r
4. Ki-67\r
\r
**Formato OBLIGATORIO:**\r
```\r
RECEPTOR DE ESTRÓGENO: POSITIVO FUERTE 3+ (80-90%), RECEPTOR DE PROGESTERONA: POSITIVO MODERADO 2+ (80-90%), HER2: NEGATIVO (SCORE 1+), Ki-67: 51-60%\r
```\r
\r
**Componentes del formato:**\r
- **Nombre completo:** "RECEPTOR DE ESTRÓGENO" NO "ER"\r
- **Estado:** POSITIVO/NEGATIVO\r
- **Intensidad:** FUERTE/MODERADO/DÉBIL + Grado (1+, 2+, 3+)\r
- **Porcentaje:** (XX-YY%)\r
\r
**❌ FORMATOS INCORRECTOS:**\r
```\r
ER: POSITIVO                                    ← Falta intensidad y porcentaje\r
RECEPTOR DE ESTRÓGENO: POSITIVO                 ← Falta intensidad y porcentaje\r
ER: POSITIVO FUERTE 3+ (80-90%)                 ← Usa código "ER" en vez de nombre completo\r
```\r
\r
**✅ FORMATOS CORRECTOS:**\r
```\r
RECEPTOR DE ESTRÓGENO: POSITIVO FUERTE 3+ (80-90%)\r
RECEPTOR DE PROGESTERONA: POSITIVO MODERADO 2+ (80-90%)\r
HER2: NEGATIVO (SCORE 1+)\r
Ki-67: 51-60%\r
```\r
\r
**Dónde buscar el valor correcto:**\r
En el debug_map → `ocr.texto_consolidado` → sección DESCRIPCIÓN MICROSCÓPICA → subsección "REPORTE DE BIOMARCADORES":\r
\r
```\r
REPORTE DE BIOMARCADORES:\r
-RECEPTOR DE ESTROGENOS: POSITIVO FUERTE 3+(80-90%).\r
-RECEPTOR DE PROGRESTERONA: POSITIVO MODERADO 2+ (80-90%)\r
-HER 2: NEGATIVO (Score 1+).\r
-Ki-67: 51-60%.\r
```\r
\r
**Cómo validar:**\r
1. Leer `debug_map['base_datos']['campos_criticos']['Factor pronostico']`\r
2. Verificar que cada biomarcador use **nombre completo** (no código)\r
3. Verificar que incluya **intensidad + grado + porcentaje**\r
4. Comparar con el texto del OCR en "REPORTE DE BIOMARCADORES"\r
\r
**Ejemplo de detección de error:**\r
\r
```python\r
# Valor en BD:\r
factor_bd = "ER: POSITIVO, RECEPTOR DE PROGRESTERONA: POSITIVO MODERADO 2+ (80-90%), HER2: NEGATIVO (Score 1+), Ki-67: 60%"\r
\r
# Valor correcto (OCR):\r
factor_ocr = "RECEPTOR DE ESTRÓGENO: POSITIVO FUERTE 3+ (80-90%), RECEPTOR DE PROGESTERONA: POSITIVO MODERADO 2+ (80-90%), HER2: NEGATIVO (SCORE 1+), Ki-67: 51-60%"\r
\r
# Errores detectados:\r
# 1. "ER" debe ser "RECEPTOR DE ESTRÓGENO"\r
# 2. Falta "FUERTE 3+ (80-90%)"\r
# 3. "Ki-67: 60%" debe ser "Ki-67: 51-60%"\r
```\r
\r
**Acción del agente:**\r
Al detectar este error, el agente debe:\r
1. ❌ Marcar validación como **ERROR** o **WARNING**\r
2. 📋 Generar reporte detallado en `herramientas_ia/resultados/` explicando:\r
   - Valor actual en BD\r
   - Valor correcto según OCR\r
   - Archivo y función responsable de construir el factor pronóstico\r
   - Código actual (problemático)\r
   - Código correcto (solución)\r
   - Líneas exactas a modificar\r
3. 🔍 Buscar TODOS los lugares donde se asigna valor al campo `Factor pronostico`\r
4. ✅ Validar que la solución cubra el 100% de los casos\r
\r

## ⭐ REGLAS DE ORO (CRÍTICAS)\r
\r
### REGLA DE ORO #1: FACTOR_PRONOSTICO - SOLO 4 BIOMARCADORES (FILTRADO ESTRICTO + FALLBACK v3.1.4)\r
**✅ IMPLEMENTADO:** `medical_extractor.py` v4.2.4 (filtrado estricto + fallback) + `unified_extractor.py` v4.2.6 (integración)\r
\r
**FACTOR_PRONOSTICO debe contener SOLO estos 4 biomarcadores principales:**\r
1. **HER2** (o HER-2)\r
2. **Ki-67** (o Ki67, KI-67)\r
3. **Receptor de Estrógenos** (o RECEPTOR DE ESTRÓGENO, ER, Estrogeno, Estrogenos)\r
4. **Receptor de Progesterona** (o RECEPTOR DE PROGESTERONA, PR, Progesterona)\r
\r
**FILOSOFÍA CORRECTA (v3.1.3):**\r
```\r
SI (HER2 OR Ki-67 OR Estrógenos OR Progesterona están en IHQ_ESTUDIOS_SOLICITADOS):\r
   FACTOR_PRONOSTICO = SOLO esos 4 biomarcadores (los que estén presentes)\r
SINO:\r
   FACTOR_PRONOSTICO = "NO APLICA"\r
```\r
\r
**❌ NO INCLUIR en FACTOR_PRONOSTICO (biomarcadores de TIPIFICACIÓN):**\r
- CKAE1AE3, S100, GATA3, TTF-1, PAX8, CDX2\r
- E-Cadherina, P53, TP53, P40, P16, P63\r
- CD10, CD56, CD34, CD117\r
- Sinaptofisina, Cromogranina\r
- CK7, CK20, CK5\r
- Cualquier otro biomarcador que NO sea de los 4 principales\r
\r
**✅ DESTINO CORRECTO:**\r
- Estos biomarcadores adicionales van SOLO en sus columnas individuales IHQ_*\r
- Ejemplo: E-Cadherina → columna `IHQ_E-CADHERINA` (NO en FACTOR_PRONOSTICO)\r
- Ejemplo: GATA3 → columna `IHQ_GATA3` (NO en FACTOR_PRONOSTICO)\r
\r
**🆕 FALLBACK AUTOMÁTICO (v3.1.4):**\r
\r
Si la extracción directa de FACTOR_PRONOSTICO falla (por formato PDF no estándar), el sistema construye automáticamente desde columnas individuales:\r
\r
```python\r
# Ejecutado automáticamente en unified_extractor.py (línea 577-595)\r
if FACTOR_PRONOSTICO vacío o "NO APLICA":\r
    Buscar en: IHQ_HER2, IHQ_KI-67, IHQ_RECEPTOR_ESTROGENOS, IHQ_RECEPTOR_PROGESTERONA\r
    if al menos 1 tiene valor:\r
        Construir: "HER2: X, Ki-67: Y, Receptor de Estrógeno: Z, Receptor de Progesterona: W"\r
    else:\r
        Mantener: "NO APLICA"\r
```\r
\r
**Función implementada:** `build_factor_pronostico_from_columns()` en `medical_extractor.py` línea 1145\r
\r
**Ejemplo FALLBACK (IHQ250984):**\r
- **Problema:** Biomarcadores en PDF fuera del bloque "REPORTE DE BIOMARCADORES" → extracción directa falla\r
- **Columnas IHQ_* pobladas:** ✅ HER2, Ki-67, Estrógenos, Progesterona extraídos correctamente\r
- **FACTOR_PRONOSTICO original:** ❌ "NO APLICA"\r
- **FALLBACK activado:** ✅ Construye desde columnas\r
- **Resultado:** `"HER2: POSITIVO (SCORE 3+), Ki-67: 60%, Receptor de Estrógeno: NEGATIVO, Receptor de Progesterona: NEGATIVO"`\r
\r
**Casos donde se activa el FALLBACK:**\r
- PDFs con biomarcadores fuera del bloque estándar "REPORTE DE BIOMARCADORES"\r
- Formatos de PDF no estándar o corruptos\r
- Biomarcadores divididos entre páginas\r
- OCR con errores que impiden patrones de extracción directa\r
- Casos con formato de reporte diferente al estándar HUV\r
\r
**IMPORTANTE:** Aunque E-Cadherina, P53, GATA3 o TTF-1 estén mencionados en el PDF, NO deben incluirse en el campo FACTOR_PRONOSTICO. Este campo está reservado EXCLUSIVAMENTE para los 4 biomarcadores principales de pronóstico.\r
\r

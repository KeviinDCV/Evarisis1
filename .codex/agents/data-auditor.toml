- **Estados:**\r
  - `OK` - Diagnóstico validado (estrategia 1, 2 o 3)\r
  - `WARNING` - No pudo validarse (puede ser falso positivo)\r
  - `OK` - "NO APLICA" si no hay estudio M previo\r
- **Output:** Estado + estrategia usada + mensaje descriptivo\r
- **IMPORTANTE:** Reduce falsos positivos por diferencias de formato (espacios, comillas, mayúsculas/minúsculas)\r
\r
#### 2.2 Validación DIAGNOSTICO_PRINCIPAL (⭐ REGLA DE ORO)\r
- **Función:** `_validar_diagnostico_principal_inteligente()`\r
- **REGLA DE ORO #4:** DIAGNOSTICO_PRINCIPAL NO debe contener datos del estudio M\r
  - ❌ **INCORRECTO:** "CARCINOMA MICROPAPILAR, INVASIVO GRADO HISTOLOGICO: 1 (SCORE 3/9)"\r
  - ✅ **CORRECTO:** "CARCINOMA MICROPAPILAR, INVASIVO"\r
  - **Debe limpiarse:** Eliminar grado histológico, score Nottingham, invasiones\r
\r
- **Qué valida:**\r
  - NO contiene grado Nottingham\r
  - NO contiene invasiones (linfovascular, perineural)\r
  - NO contiene score de gradación\r
  - Coincide semánticamente con PDF\r
- **Detecta:** 5 keywords prohibidos del estudio M ("GRADO", "NOTTINGHAM", "INVASIÓN", "SCORE", "IN SITU")\r
- **Output:** Estado + contaminación + línea correcta + sugerencia\r
- **IMPORTANTE:** Este es el ÚNICO campo que debe estar LIMPIO (sin datos del estudio M)\r
\r
#### 2.3 Validación FACTOR_PRONOSTICO (⭐ REGLAS DE ORO)\r
- **Función:** `_validar_factor_pronostico_regla_4()`\r
- **REGLA DE ORO #1:** FACTOR_PRONOSTICO debe contener **EXACTAMENTE 4 biomarcadores**:\r
  1. **HER2** (o HER-2)\r
  2. **Ki-67** (o Ki67, KI-67)\r
  3. **Receptor de Estrógeno** (o RECEPTOR DE ESTRÓGENOS, ER)\r
  4. **Receptor de Progesterona** (o RECEPTOR DE PROGESTERONA, PR)\r
\r
  **NO incluir otros biomarcadores** (E-Cadherina, CD56, etc.) aunque estén en el PDF.\r
\r
- **REGLA DE ORO #2:** Ki-67 debe normalizarse sin "Índice de proliferación celular"\r
  - ❌ **INCORRECTO:** `Índice de proliferación celular (Ki67): 21-30%`\r
  - ✅ **CORRECTO:** `Ki67: 21-30%` o `Ki-67: 21-30%`\r
\r
- **Qué valida:**\r
  - Contiene SOLO los 4 biomarcadores permitidos (no más, no menos)\r
  - Ki-67 sin descripción larga ("Índice de proliferación celular")\r
  - Si NO están presentes → debe ser "NO APLICA"\r
  - Formato COMPLETO (no códigos): "RECEPTOR DE ESTRÓGENO: POSITIVO FUERTE 3+ (80-90%)" NO "ER: POSITIVO"\r
  - NO contiene datos del estudio M (grado histológico, invasión)\r
  - Cobertura (biomarcadores en BD vs PDF) con búsqueda semántica\r
\r
**REGLA CRÍTICA DE FORMATO:**\r
- ❌ **INCORRECTO:** `ER: POSITIVO` (código sin detalles)\r
- ❌ **INCORRECTO:** `Índice de proliferación celular (Ki67): 21-30%` (descripción larga)\r
- ✅ **CORRECTO:** `RECEPTOR DE ESTRÓGENO: POSITIVO FUERTE 3+ (80-90%)` (formato completo con intensidad y porcentaje)\r
- ✅ **CORRECTO:** `Ki67: 21-30%` (sin descripción larga)\r
- **Todos los 4 biomarcadores deben usar formato completo y detallado**\r
- **Detecta:** 7 keywords prohibidos + cobertura % + normalización Ki-67\r
- **Output:** Estado + contaminación + cobertura + advertencias de formato + sugerencia\r
- **MEJORA v6.1.1:** Algoritmo de cobertura mejorado con variantes semánticas (singular/plural, acentos, espacios)\r
  - Reconoce "Receptor de Estrógeno" ↔ "RECEPTOR DE ESTROGENOS"\r
  - Reconoce "HER2" ↔ "HER 2"\r
  - Reconoce "Ki-67" ↔ "KI-67" ↔ "Ki67"\r
  - Elimina falsos positivos de cobertura < 100%\r
\r

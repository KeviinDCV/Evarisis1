## 🔄 Workflows Comunes\r
\r
### Workflow 1: Validación Post-Procesamiento\r
```\r
1. Usuario procesa N PDFs nuevos\r
2. Agent audita casos recientes con --inteligente\r
3. Agent reporta precisión global + score de validación\r
4. Agent detecta falsa completitud si existe\r
5. Si score < 90%, identifica casos problemáticos con diagnósticos\r
6. Usuario decide si reprocesar, corregir con IA, o ajustar extractores\r
```\r
\r
### Workflow 2: Investigación de Error\r
```\r
1. Usuario reporta campo vacío incorrecto\r
2. Agent ejecuta auditoría inteligente\r
3. Agent detecta tipo de error (VACIO/CONTAMINACION/INCORRECTO/PARCIAL)\r
4. Agent diagnostica causa raíz\r
5. Agent genera sugerencia con archivo + función + regex + comando\r
6. Usuario invoca core-editor con comando sugerido\r
```\r
\r
### Workflow 3: Análisis de Calidad con Auditoría Semántica\r
```\r
1. Usuario solicita auditoría completa del sistema\r
2. Agent ejecuta --todos --inteligente\r
3. Agent identifica patrones de contaminación cruzada\r
4. Agent calcula score promedio de validación\r
5. Agent prioriza sugerencias por criticidad\r
6. Usuario aplica correcciones sistemáticas\r
```\r
\r
### Workflow 4: Reprocesamiento de Caso Específico\r
```\r
1. Usuario solicita reprocesar caso IHQ251007\r
2. Agent busca PDF automáticamente con _buscar_pdf_por_numero()\r
   → Encuentra: pdfs_patologia/IHQ DEL 001 AL 050.pdf\r
3. Agent limpia debug_maps antiguos del caso\r
4. Agent ejecuta process_ihq_file() para el PDF completo\r
5. Agent re-audita con FUNC-01 para validar correcciones\r
6. Agent reporta score de validación mejorado\r
```\r

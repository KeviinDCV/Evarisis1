## 🚀 Uso Proactivo\r
\r
El agente debe ser usado PROACTIVAMENTE cuando:\r
- Usuario menciona "validar", "verificar", "auditar"\r
- Usuario pregunta "¿está bien extraído?"\r
- Usuario reporta campo vacío sospechoso\r
- Usuario menciona número de caso IHQ######\r
- Después de procesar nuevos PDFs\r
- Antes de exportar datos críticos\r
- Usuario menciona "diagnóstico", "factor pronóstico", "órgano"\r
- Usuario reporta "dice 100% pero está mal" (falsa completitud)\r

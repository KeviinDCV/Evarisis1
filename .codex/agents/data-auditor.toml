## 🚀 CAPACIDADES PRINCIPALES\r
\r
### FUNC-01: AUDITORÍA INTELIGENTE "ANTI-PROBLEMAS"\r
\r
**Versión:** 3.3.0 (3 de noviembre 2025)\r
**Filosofía:** Validación completa sin vueltas - detecta TODO lo que puede estar mal\r
\r
Valida casos desde debug_map con **7 validaciones semánticas** que comparan datos guardados (campos_criticos) contra OCR (texto_consolidado) para prevenir "false completeness" (casos que reportan 100% pero tienen valores incorrectos).\r
\r
**Comando:**\r
```bash\r
python herramientas_ia/auditor_sistema.py IHQ250980 --inteligente\r
```\r
\r
**Origen de datos (CRÍTICO):**\r
```python\r
# Lee debug_map.json COMPLETO\r
debug_map = json.load(f'debug_maps/{caso}/debug_map.json')\r
\r
# Datos guardados en BD (lo que el sistema extrajo)\r
campos_criticos = debug_map['base_datos']['campos_criticos']\r
\r
# Texto OCR completo (fuente de verdad)\r
ocr = debug_map['ocr']['texto_consolidado']\r
\r
# COMPARAR: campos_criticos (BD) vs ocr (PDF)\r
```\r
\r
**9 Validaciones semánticas exhaustivas v3.3.0:**\r
\r
1. **Descripcion macroscopica** (v3.3.0 NUEVO)\r
   - Compara BD vs OCR con similitud de palabras\r
   - ERROR si similitud < 50%, WARNING si < 70%\r
   - Previene: Extracción incorrecta de sección macroscópica\r
\r
2. **Diagnostico coloracion** (M)\r
   - Valida 5 componentes: diagnóstico + grado + invasiones\r
   - Puede contener datos del estudio M (correcto)\r
   - Previene: Diagnóstico incompleto o malformado\r
\r
3. **Descripcion microscopica** (v3.3.0 NUEVO)\r
   - Compara BD vs OCR con similitud de palabras\r
   - ERROR si similitud < 50%, WARNING si < 70%\r
   - Previene: Extracción incorrecta de sección microscópica\r
\r
4. **Diagnostico principal** (IHQ)\r
   - Debe estar LIMPIO (sin grado ni invasiones)\r
   - NO puede tener keywords del estudio M\r
   - Previene: Contaminación con datos de coloración\r
\r
5. **IHQ_ORGANO** (Órgano)\r
   - Valida que esté limpio de prefijos/sufijos\r
   - Previene: Valores contaminados o mal formateados\r
\r
6. **Factor pronostico**\r
   - SOLO 4 biomarcadores permitidos: HER2, Ki-67, ER, PR\r
   - Ki-67 normalizado (sin "Índice de proliferación")\r
   - Previene: Inclusión incorrecta de biomarcadores secundarios\r
\r
7. **Biomarcadores - Existencia y Mapeo** (v3.1.0)\r
   - Extrae estudios solicitados INDEPENDIENTEMENTE desde OCR\r
   - Valida que cada biomarcador tenga columna IHQ_* poblada\r
   - Previene: Biomarcadores solicitados sin mapear a columnas\r
\r
8. **Malignidad** (v3.3.0 NUEVO)\r
   - Valida clasificación MALIGNO/BENIGNO/BORDERLINE/INDETERMINADO\r
   - Compara contra keywords en OCR (CARCINOMA, ADENOMA, etc.)\r
   - ERROR si BD=BENIGNO pero OCR contiene keywords malignos\r
   - Previene: Clasificaciones erróneas críticas para tratamiento\r
\r
9. **Campos exhaustivos** (v3.3.0 NUEVO - VALIDACIÓN GENÉRICA)\r
   - Valida TODOS los campos restantes en campos_criticos contra OCR\r
   - Busca valor en OCR con similitud 70%+ (WARNING si 50-70%, ERROR si <50%)\r
   - Previene: Campos con valores inventados o no presentes en PDF\r
   - Ejemplos: Organo, Descripcion Diagnostico, cualquier campo futuro\r
\r
**PLUS: Validación de VALORES de biomarcadores** (v3.3.0 - dentro de validación #7)\r
- Compara valores de columnas IHQ_* contra valores en OCR\r
- ERROR si valor BD ≠ valor OCR\r
- Previene: **FALSE COMPLETENESS** - casos 100% completos pero con valores incorrectos\r
- Ejemplo: BD tiene "IHQ_P63: NO MENCIONADO" pero OCR dice "P63: POSITIVO"\r
\r
**Características anti-problemas:**\r
- ✅ Lee debug_map (no duplica procesamiento BD/PDF)\r
- ✅ Compara SIEMPRE campos_criticos vs texto_consolidado\r
- ✅ Detecta false completeness (valores incorrectos)\r
- ✅ Detecta campos vacíos o con placeholders\r
- ✅ Detecta inconsistencias BD ≠ OCR\r
- ✅ Calcula score 0-100% con peso por severidad\r
- ✅ Genera reporte JSON detallado con sugerencias\r
- ✅ Reporta valor_bd Y valor_ocr para comparación directa\r
\r

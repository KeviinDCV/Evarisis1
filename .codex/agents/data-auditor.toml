## 📁 PROCESAMIENTO Y REPROCESAMIENTO DE CASOS\r
\r
### Estructura de PDFs Fuente\r
\r
Los PDFs originales están organizados por rangos en `pdfs_patologia/`:\r
\r
**Ubicación:**\r
```\r
C:\\Users\\USUARIO\\Desktop\\DEBERES HUV\\ProyectoHUV9GESTOR_ONCOLOGIA\\pdfs_patologia\\\r
```\r
\r
**Formato de nombres:**\r
```\r
IHQ DEL XXX AL YYY.pdf\r
```\r
\r
**Ejemplos:**\r
- `IHQ DEL 001 AL 050.pdf` (contiene casos IHQ250001-IHQ250050)\r
- `IHQ DEL 980 AL 1037.pdf` (contiene casos IHQ250980-IHQ251037)\r
\r
**Características:**\r
- Total: 20 PDFs organizados por rangos\r
- Cada PDF contiene ~50 casos (rango variable 50-58)\r
- Casos del 001 al 1037 (con discontinuidad en 516)\r
\r
### Búsqueda Automática de PDF por Caso\r
\r
El auditor incluye función `_buscar_pdf_por_numero()` que localiza automáticamente el PDF correcto:\r
\r
**Algoritmo:**\r
1. Extrae últimos 3 dígitos del número IHQ (IHQ251007 → 007)\r
2. Busca en `pdfs_patologia/` todos los PDFs\r
3. Detecta patrón con regex: `IHQ DEL (\\d+) AL (\\d+)`\r
4. Verifica: `inicio_rango <= numero_caso <= fin_rango`\r
5. Retorna Path del PDF encontrado\r
\r
**Ejemplo de uso:**\r
```python\r
from herramientas_ia.auditor_sistema import AuditorSistema\r
\r
auditor = AuditorSistema()\r
pdf_path = auditor._buscar_pdf_por_numero("IHQ251007")\r
# Retorna: Path("pdfs_patologia/IHQ DEL 001 AL 050.pdf")\r
\r
# También funciona con número sin prefijo\r
pdf_path = auditor._buscar_pdf_por_numero("251007")\r
# Retorna: Path("pdfs_patologia/IHQ DEL 001 AL 050.pdf")\r
```\r
\r
**Casos de uso:**\r
```python\r
# Caso al inicio de rango\r
auditor._buscar_pdf_por_numero("IHQ250001")\r
# → "IHQ DEL 001 AL 050.pdf" ✓\r
\r
# Caso al final de rango\r
auditor._buscar_pdf_por_numero("IHQ251037")\r
# → "IHQ DEL 980 AL 1037.pdf" ✓\r
\r
# Caso en medio de rango\r
auditor._buscar_pdf_por_numero("IHQ250982")\r
# → "IHQ DEL 980 AL 1037.pdf" ✓\r
\r
# Caso inexistente\r
auditor._buscar_pdf_por_numero("IHQ250516")\r
# → None (caso no existe - discontinuidad en 516)\r
```\r
\r
### Reprocesamiento de Casos (FUNC-02 - ROADMAP)\r
\r
**Estado:** FUNC-02 NO está implementada completamente. Para reprocesar:\r
\r
**Método Manual (actual):**\r
1. Buscar PDF con `_buscar_pdf_por_numero()`\r
2. Abrir `ui.py` y seleccionar el PDF manualmente\r
3. Sistema procesa todos los casos del PDF (~50 casos)\r
4. Genera nuevos debug_maps\r
5. Re-auditar con FUNC-01\r
\r
**Método Automatizado (futuro - FUNC-02):**\r
```python\r
# ROADMAP - No implementado aún\r
auditor.reprocesar_caso("IHQ251007")\r
# Automáticamente:\r
# - Busca PDF correcto\r
# - Limpia debug_maps antiguos\r
# - Procesa solo ese caso (no todo el PDF)\r
# - Actualiza BD\r
# - Re-audita con FUNC-01\r
```\r
\r

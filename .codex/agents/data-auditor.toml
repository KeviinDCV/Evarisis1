### REGLA 2: Consistencia entre Factor Pronóstico y Columnas Individuales\r
\r
**Contexto:**\r
Las columnas individuales de biomarcadores deben tener el **mismo nivel de detalle** que en el Factor Pronóstico.\r
\r
**Los 4 biomarcadores que deben ser consistentes:**\r
1. `IHQ_RECEPTOR_ESTROGENOS` ↔ Factor Pronóstico (ER)\r
2. `IHQ_RECEPTOR_PROGESTERONA` ↔ Factor Pronóstico (PR)\r
3. `IHQ_HER2` ↔ Factor Pronóstico (HER2)\r
4. `IHQ_KI-67` ↔ Factor Pronóstico (Ki-67)\r
\r
**Formato OBLIGATORIO en columnas individuales:**\r
```\r
IHQ_RECEPTOR_ESTROGENOS: "POSITIVO FUERTE 3+ (80-90%)"\r
IHQ_RECEPTOR_PROGESTERONA: "POSITIVO MODERADO 2+ (80-90%)"\r
IHQ_HER2: "NEGATIVO (SCORE 1+)"\r
IHQ_KI-67: "51-60%"\r
```\r
\r
**❌ FORMATOS INCORRECTOS en columnas individuales:**\r
```\r
IHQ_RECEPTOR_ESTROGENOS: "POSITIVO"                    ← Falta intensidad/grado/porcentaje\r
IHQ_RECEPTOR_PROGESTERONA: "POSITIVO"                  ← Falta intensidad/grado/porcentaje\r
IHQ_HER2: "NEGATIVO"                                   ← Falta score\r
IHQ_KI-67: "60%"                                       ← Falta rango completo\r
```\r
\r
**✅ FORMATOS CORRECTOS:**\r
```\r
IHQ_RECEPTOR_ESTROGENOS: "POSITIVO FUERTE 3+ (80-90%)"\r
IHQ_RECEPTOR_PROGESTERONA: "POSITIVO MODERADO 2+ (80-90%)"\r
IHQ_HER2: "NEGATIVO (SCORE 1+)"\r
IHQ_KI-67: "51-60%"\r
```\r
\r
**Dónde buscar el valor correcto:**\r
1. **Primero:** En Factor Pronóstico (ya validado con REGLA 1)\r
2. **Segundo:** En debug_map → `ocr.texto_consolidado` → "REPORTE DE BIOMARCADORES"\r
\r
**Cómo validar:**\r
1. Leer `debug_map['base_datos']['campos_criticos']['Factor pronostico']`\r
2. Extraer el valor de cada biomarcador del Factor Pronóstico\r
3. Comparar con la columna individual correspondiente\r
4. Detectar inconsistencia si la columna individual tiene menos detalle\r
\r
**Ejemplo de detección de error:**\r
\r
```python\r
# Factor Pronóstico (correcto):\r
factor = "RECEPTOR DE ESTRÓGENO: POSITIVO FUERTE 3+ (80-90%), RECEPTOR DE PROGESTERONA: POSITIVO MODERADO 2+ (80-90%), HER2: NEGATIVO (SCORE 1+), Ki-67: 51-60%"\r
\r
# Columnas individuales:\r
ihq_er = bd['IHQ_RECEPTOR_ESTROGENOS']  # "POSITIVO"  ← ❌ INCORRECTO\r
ihq_pr = bd['IHQ_RECEPTOR_PROGESTERONA']  # "POSITIVO"  ← ❌ INCORRECTO\r
ihq_her2 = bd['IHQ_HER2']  # "NEGATIVO (SCORE 1+)"  ← ✅ CORRECTO\r
ihq_ki67 = bd['IHQ_KI-67']  # "51-60%"  ← ✅ CORRECTO\r
\r
# Extracción del Factor Pronóstico:\r
er_en_factor = "POSITIVO FUERTE 3+ (80-90%)"\r
pr_en_factor = "POSITIVO MODERADO 2+ (80-90%)"\r
\r
# Comparación:\r
if ihq_er != er_en_factor:\r
    ERROR("IHQ_RECEPTOR_ESTROGENOS inconsistente con Factor Pronóstico")\r
    # Columna: "POSITIVO"\r
    # Factor: "POSITIVO FUERTE 3+ (80-90%)"\r
    # Falta: intensidad, grado, porcentaje\r
\r
if ihq_pr != pr_en_factor:\r
    ERROR("IHQ_RECEPTOR_PROGESTERONA inconsistente con Factor Pronóstico")\r
    # Columna: "POSITIVO"\r
    # Factor: "POSITIVO MODERADO 2+ (80-90%)"\r
    # Falta: intensidad, grado, porcentaje\r
```\r
\r
**Acción del agente:**\r
Al detectar este error, el agente debe:\r
1. ❌ Marcar validación como **WARNING** (no ERROR porque Factor Pronóstico está correcto)\r
2. 📋 Generar reporte detallado explicando:\r
   - Valor en columna individual (incompleto)\r
   - Valor en Factor Pronóstico (completo)\r
   - Qué información falta en la columna\r
   - Archivo y función responsable de llenar las columnas individuales\r
   - Código actual vs código correcto\r
3. 🔍 Buscar dónde se asignan valores a las columnas individuales\r
4. ✅ Proponer solución para sincronizar con Factor Pronóstico\r
\r
**Prioridad:**\r
- MEDIA (no afecta Factor Pronóstico que es el campo principal)\r
- Pero IMPORTANTE para consistencia de BD y análisis estadísticos\r

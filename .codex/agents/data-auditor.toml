## ⚠️ Límites del Agente\r
\r
- NO modifica datos en la base de datos\r
- NO corrige errores automáticamente\r
- NO procesa nuevos PDFs\r
- Solo VALIDA y REPORTA discrepancias\r
- NO puede crear columna DIAGNOSTICO_COLORACION en BD (requiere core-editor)\r
\r
Para correcciones, usar el agente **core-editor** o **lm-studio-connector** (corrección IA).\r

         reloj lineal escribe la respiración del fondo y el
         acercamiento final — determinista, sin callbacks, seguro
         ante cualquier salto de fotograma del renderizador.
         --------------------------------------------------------- */
      var clock = { t: 0 };

      function writeFrame() {
        var t = clock.t;
        var b = Math.sin(t * 0.3);

        var push = 0;
        if (t > PUSH_AT) {
          var p = Math.min(1, (t - PUSH_AT) / 3.6);
          push = 0.022 * (p * p * (3 - 2 * p));
        }

        world.style.transform =
          "translate(" +
          (Math.sin(t * 0.21) * 3).toFixed(2) + "px," +
          (Math.sin(t * 0.273) * 1.6).toFixed(2) + "px) scale(" +
          (1 + 0.004 * b + push).toFixed(4) + ")";

        radial.style.transform = "scale(" + (1 + 0.05 * b).toFixed(4) + ")";
        radial.style.opacity = (0.55 + 0.18 * b).toFixed(4);
        grid.style.opacity = (0.04 + 0.012 * b).toFixed(4);
        hair.style.opacity = (0.55 + 0.22 * b).toFixed(4);
        veil.style.opacity = (0.48 + 0.16 * Math.sin(t * 0.42 + 1.1)).toFixed(4);
      }

      // el reloj recorre exactamente la duración declarada del root:
      // el fondo respira los 14,3 s sin una sola ventana congelada
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: writeFrame }, 0);
      writeFrame(); // semilla del fotograma 0

      /* ---------------------------------------------------------
         helpers de cursor (cursor-click-ripple, repeticiones finitas)
         --------------------------------------------------------- */
      var cursor = "#c10-cursor";

      function moveTo(x, y, at, dur) {
        tl.to(cursor, { x: x, y: y, duration: dur, ease: "power2.inOut" }, at);
      }

      function click(at) {
        // el cursor comprime más que el receptor: el cursor es el actor
        tl.to(cursor, { scale: 0.84, duration: 0.09, ease: "power2.in" }, at);
        tl.to(cursor, { scale: 1, duration: 0.15, ease: "power2.out" }, at + 0.09);
        tl.fromTo(
          ["#c10-ring-1", "#c10-ring-2"],
          { scale: 0, opacity: 0.52 },
          { scale: 2.6, opacity: 0, duration: 0.74, ease: "power2.out",
            stagger: 0.09, immediateRender: false },
          at + 0.03
        );
      }

      /* =========================================================
         BEAT 0 (0.0–2.6) — «Y aparte de la base de datos está el
         Dashboard,». La ventana del Dashboard llega y se arma:
         cromo, título, botón de filtros y la fila de vistas.
         ========================================================= */
      tl.fromTo("#c10-panel",
        { opacity: 0, y: 16, scale: 0.99 },
        { opacity: 1, y: 0, scale: 1, duration: 0.74, ease: "power3.out" }, 0);

      tl.fromTo("#c10-brand", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.25);
      tl.fromTo("#c10-mark", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.45);

      tl.fromTo("#c10-title",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" }, 0.42);
      tl.fromTo("#c10-filtros",
        { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.72);

      tl.fromTo("#c10-tabs .d10-tab",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out", stagger: 0.075 }, 1.05);

      tl.fromTo("#c10-tabrule",
        { scaleX: 0 }, { scaleX: 1, duration: 0.72, ease: "power3.out" }, 1.5);

      // el cursor entra desde fuera de la superficie
      tl.fromTo(cursor,
        { x: 1720, y: 900, opacity: 0 },
        { x: 1720, y: 900, opacity: 1, duration: 0.34, ease: "power2.out" }, 0.9);

      // la rejilla 2x2 llega con el esqueleto —los marcos vacíos, aún sin
      // trazar—: así el cuerpo del panel nunca se queda en blanco y el clic
      // de «Overview» tiene algo concreto que rellenar
      var cards = ["#c10-card-0", "#c10-card-1", "#c10-card-2", "#c10-card-3"];
      for (var i = 0; i < cards.length; i++) {
        tl.fromTo(cards[i],
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.55 + i * 0.15);
        tl.fromTo("#c10-ctitle-" + i,
          { opacity: 0, x: 12 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.69 + i * 0.15);
        tl.fromTo("#c10-crule-" + i,
          { scaleX: 0 }, { scaleX: 1, duration: 0.62, ease: "power3.out" }, 1.73 + i * 0.15);
      }

      /* =========================================================
         BEAT 1 (2.1–3.8) — el cursor pulsa «Overview» y la vista
         RESPONDE: la pestaña se hunde, se llena de navy y su
         subrayador ámbar se traza. Es el único ámbar de la escena.
         ========================================================= */
      moveTo(267, 323, 2.15, 0.92);
      click(3.12);

      tl.to("#c10-tab-0", { scale: 0.96, duration: 0.09, ease: "power2.in" }, 3.12);
      tl.to("#c10-tab-0", { scale: 1, duration: 0.18, ease: "power2.out" }, 3.21);
      tl.to("#c10-tab-0",
        { backgroundColor: "#2d3e5e", color: "#f4f6fa", duration: 0.34, ease: "power2.out" }, 3.16);
      tl.fromTo("#c10-amber",
        { scaleX: 0 }, { scaleX: 1, duration: 0.54, ease: "power3.out" }, 3.2);
      // el aro cierra sobre la pestaña un instante antes de que el pie acabe
      // de barrer: el foco queda como CONTORNO grueso, no como relleno, y
      // manda en el encuadre por encima de los emoji a color de la interfaz
      tl.fromTo("#c10-amber-ring",
        { opacity: 0, scale: 1.16 },
        { opacity: 1, scale: 1, duration: 0.46, ease: "power3.out" }, 3.18);

      /* =========================================================
         BEAT 2 (3.9–7.2) — «con cinco vistas de gráficos: el
         panorama general,». Los cuatro gráficos se DIBUJAN
         escalonados dentro de los marcos que ya estaban: la línea se
         traza, la tarta se llena, las barras crecen y las columnas
         suben. Son formas plausibles y NO llevan cifras: para estos
         gráficos no hay dato verificado.
         ========================================================= */
      // 1 · Informes por mes — svg-path-draw + relleno por barrido
      tl.fromTo("#c10-grid-0",
        { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, 3.88);
      tl.fromTo("#c10-line-0",
        { strokeDashoffset: 1.05 },
        { strokeDashoffset: 0, duration: 1.15, ease: "power1.inOut" }, 3.98);
      tl.fromTo("#c10-arear",
        { attr: { width: 0 } },
        { attr: { width: 712 }, duration: 1.15, ease: "power1.inOut" }, 3.98);
      tl.fromTo(".c10-dot",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.075 }, 4.18);

      // 2 · Distribución de Malignidad — la tarta se llena por sectores
      tl.fromTo("#c10-dtrack",
        { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power2.out" }, 4.7);
      // sectores: 67 / 21 / 12 por ciento del arco (offset = 292 − longitud)
      tl.fromTo("#c10-seg-0",
        { strokeDashoffset: 300 },
        { strokeDashoffset: 98.35, duration: 0.85, ease: "power2.inOut" }, 4.8);
      tl.fromTo("#c10-seg-1",
        { strokeDashoffset: 300 },
        { strokeDashoffset: 231.30, duration: 0.44, ease: "power2.inOut" }, 5.6);
      tl.fromTo("#c10-seg-2",
        { strokeDashoffset: 300 },
        { strokeDashoffset: 257.32, duration: 0.34, ease: "power2.inOut" }, 5.98);
      for (var g = 0; g < 3; g++) {
        tl.fromTo("#c10-leg-" + g,
          { opacity: 0, x: 14 },
          { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 5.72 + g * 0.13);
      }

      // 3 · Top Servicios — las barras crecen desde el eje
      tl.fromTo(".c10-slbl",
        { opacity: 0 },
        { opacity: 1, duration: 0.34, ease: "power2.out", stagger: 0.06 }, 5.55);
      tl.fromTo(".c10-sbar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.62, ease: "power3.out", stagger: 0.09 }, 5.7);

      // 4 · Top Órganos — las columnas suben desde la línea base
      tl.fromTo("#c10-obase",
        { scaleX: 0 }, { scaleX: 1, duration: 0.52, ease: "power3.out" }, 6.1);
      tl.fromTo(".c10-ocol",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.56, ease: "power3.out", stagger: 0.075 }, 6.22);
      tl.fromTo(".c10-oclbl",
        { opacity: 0 },
        { opacity: 1, duration: 0.32, ease: "power2.out", stagger: 0.06 }, 6.5);

      // el cursor acompaña el dibujo: pasa por la línea y baja a las columnas
      moveTo(640, 500, 3.85, 0.92);
      moveTo(1240, 690, 5.30, 0.85);

      /* =========================================================
         BEAT 3 (6.8–12.4) — «los biomarcadores, los tiempos de
         proceso, la calidad del dato, y un comparador que se arma a
         medida.» Las otras cuatro vistas se insinúan encendiéndose
         EN ORDEN, al ritmo exacto de la enumeración.
         ========================================================= */
      var HINTS = [
        { n: 1, on: 6.88, off: 7.72 },   // Biomarcadores
        { n: 2, on: 8.00, off: 8.86 },   // Tiempos
        { n: 3, on: 9.28, off: 10.18 },  // Calidad
        { n: 4, on: 10.50, off: 12.30 }  // Comparador (se sostiene: «a medida»)
      ];
      for (var k = 0; k < HINTS.length; k++) {
        var h = HINTS[k];
        tl.to("#c10-tab-" + h.n,
          { backgroundColor: "rgba(45,62,94,0.16)", color: "#22304a",
            duration: 0.3, ease: "power2.out" }, h.on);
        tl.fromTo("#c10-hint-" + h.n,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power3.out" }, h.on + 0.04);

        tl.to("#c10-tab-" + h.n,
          { backgroundColor: "rgba(45,62,94,0.05)", color: "rgba(34,48,74,0.58)",
            duration: 0.42, ease: "power2.inOut" }, h.off);
        tl.to("#c10-hint-" + h.n,
          { scaleX: 0, duration: 0.38, ease: "power2.inOut" }, h.off + 0.03);
      }

      // el cursor recorre la fila de vistas, una por una, sin pulsar:
      // sólo las señala mientras la voz las enumera
      moveTo(448, 323, 6.22, 0.66);
      moveTo(624, 323, 7.52, 0.48);
      moveTo(770, 323, 8.80, 0.46);
      moveTo(933, 323, 10.05, 0.44);

      /* =========================================================
         BEAT 4 (11.9–14.3) — el recorrido vuelve al panorama: el
         cursor regresa a «Overview», el plinto del panel se traza y
         el acercamiento sigue vivo en el último fotograma.
         ========================================================= */
      moveTo(267, 323, 11.95, 0.95);

      tl.fromTo("#c10-plinto",
        { scaleX: 0 }, { scaleX: 1, duration: 1.15, ease: "power2.inOut" }, 12.6);

      // el foco ámbar respira una vez al cerrar —aro y pie a la vez, son la
      // misma marca—: sigue siendo la vista activa cuando la escena se releva.
      // La respiración es corta (1 → 0.88) para que el foco no llegue nunca a
      // leerse como un relleno tenue.
      var AMBER = ["#c10-amber", "#c10-amber-ring"];
      tl.to(AMBER, { opacity: 0.88, duration: 0.55, ease: "sine.inOut" }, 12.95);
      tl.to(AMBER, { opacity: 1, duration: 0.7, ease: "sine.inOut" }, 13.5);

      window.__timelines = window.__timelines || {};

      // marcador-fuera: el numero de seccion CAMBIA entre escenas, asi que si
      // sigue encendido durante el encadenado se leen los dos a la vez y sale
      // el amasijo que vimos en la costura ("078//133--LASSVISTAS").
      tl.to("#c10-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 12.55);

      // suelta-contenido: al empezar el encadenado la escena deja ir su
      // CONTENIDO y se queda solo con el fondo. Como el fondo de las 13 es el
      // mismo navy, la imagen NO se corta: solo se releva lo que hay encima.
      tl.to(["#c10-clip-escena"], { opacity: 0, duration: 0.55, ease: "power2.in" }, 12.6);

      // marca-fuera: la marca de esquina vive FUERA del clip que se suelta,
      // asi que hay que apagarla aparte o se queda sobre la escena siguiente.
      tl.to("#c10-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 12.6);

      window.__timelines["10-dashboard"] = tl;
    })();
  </script>
</template>

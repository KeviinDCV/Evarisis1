      <div data-hf-id="hf-ggyu" class="s7-cap s7-mono" id="s7-cap-0">CINCO PÁGINAS</div>

  <script>
    (function () {
      var ID = "07-informe";
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var VW = 1760, VH = 800;            // el visor
      var SW = 1071, SH = 1515, GAP = 48; // la hoja
      var MAX = 2.0;                      // 1:1 contra el PNG de origen

      // Encuadra un rectángulo del mundo dentro del visor. Nunca amplía por
      // encima de MAX: pasado ese punto se estiraría el mapa de bits y el
      // texto se volvería papilla, que es justo el fallo que esto corrige.
      function encuadre(x, y, w, h) {
        var s = Math.min(VW / w, VH / h, MAX);
        return { scale: s, x: -x * s + (VW - w * s) / 2, y: -y * s + (VH - h * s) / 2 };
      }
      function hoja(i) { return i * (SW + GAP); }
      // rect de un bloque de página, en fracciones de la hoja
      function bloque(i, y0, y1, m) {
        m = m === undefined ? 0.06 : m;
        return encuadre(hoja(i) + SW * m, SH * y0, SW * (1 - 2 * m), SH * (y1 - y0));
      }

      var TODAS = encuadre(0, 0, 5 * SW + 4 * GAP, SH);
      var P1 = bloque(0, 0.02, 0.30);   // los indicadores
      var P2A = encuadre(hoja(1), 0, SW, SH);          // la página entera
      var P2B = bloque(1, 0.46, 0.68);  // la tabla de cobertura
      var P3 = bloque(2, 0.02, 0.34);
      var P4 = bloque(3, 0.02, 0.34);
      var P5 = bloque(4, 0.02, 0.34);

      function mover(dest, t, dur) {
        tl.to("#s7-world", {
          scale: dest.scale, x: dest.x, y: dest.y,
          duration: dur, ease: "power2.inOut"
        }, t);
      }
      // marco ámbar sobre el bloque que se nombra, en coordenadas del mundo
      function foco(i, y0, y1, t, dur, m) {
        m = m === undefined ? 0.06 : m;
        tl.set("#s7-foco", {
          left: hoja(i) + SW * m, top: SH * y0,
          width: SW * (1 - 2 * m), height: SH * (y1 - y0)
        }, t);
        tl.fromTo("#s7-foco", { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" }, t);
        tl.to("#s7-foco", { opacity: 0, duration: 0.45, ease: "power2.in" }, t + dur);
      }

      // ---- respiración de fondo: 47s cubiertos, sin fotograma congelado ----
      tl.to("#s7-aliento", { opacity: 0.86, duration: 4.7, repeat: 9,
        yoyo: true, ease: "sine.inOut" }, 0);
      tl.to("#s7-grid", { opacity: 0.6, duration: 7.8333, repeat: 5,
        yoyo: true, ease: "sine.inOut" }, 0);

      // ---- estado inicial de la cámara: el plano general ----
      tl.set("#s7-world", { scale: TODAS.scale, x: TODAS.x, y: TODAS.y }, 0);

      tl.fromTo("#s7-titular", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo("#s7-mark", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 0.9);
      // cada rótulo entra en su parada y sale cuando llega el siguiente
      function rotulo(i, t, tFin) {
        tl.fromTo("#s7-cap-" + i, { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t);
        if (tFin !== undefined) {
          tl.to("#s7-cap-" + i, { opacity: 0, duration: 0.3,
            ease: "power2.in" }, tFin - 0.3);
        }
      }
      rotulo(0, 1.1, 4.2);
      rotulo(1, 4.2, 11.1);
      rotulo(2, 11.1, 25.9);
      rotulo(3, 25.9, 31.1);
      rotulo(4, 31.1, 34.5);
      rotulo(5, 34.5, 39.0);
      rotulo(6, 39.0);
      tl.fromTo("#s7-hair", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 1.3);

      // las cinco hojas entran escalonadas: "un informe de cinco páginas"
      ["#s7-h1", "#s7-h2s", "#s7-h3", "#s7-h4", "#s7-h5"].forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.5 + i * 0.22);
      });

      // el titular se apaga y entra el rótulo de marca: empieza el recorrido
      tl.to("#s7-titular", { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 3.4);
      tl.fromTo("#s7-brand", { opacity: 0 },
        { opacity: 1, duration: 0.8, ease: "power1.out" }, 4.1);

      // ---- el recorrido, parada por parada ----
      mover(P1, 3.9, 1.5);
      foco(0, 0.02, 0.30, 5.0, 5.0);

      mover(P2A, 10.8, 1.4);   // la página 2 entera…
      mover(P2B, 15.2, 1.6);   // …y dentro, la tabla de cobertura
      foco(1, 0.46, 0.68, 16.4, 8.4);

      mover(P3, 25.6, 1.5);
      foco(2, 0.02, 0.34, 26.6, 3.4);

      mover(P4, 30.8, 1.4);
      foco(3, 0.02, 0.34, 31.7, 2.2);

      mover(P5, 34.2, 1.4);
      foco(4, 0.02, 0.34, 35.1, 2.3);

      // vuelta al plano general para el cierre
      mover(TODAS, 38.4, 2.0);

      // marcador-fuera: el numero de seccion cambia entre escenas, asi que

      // si sigue encendido durante el encadenado se ve doble y desplazado.

      // Se apaga justo antes de la costura; la marca de arriba NO se toca,

      // porque es identica en todas y superpuesta no se nota.

      tl.to("#s7-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 45.14);


      // suelta-contenido: al empezar el encadenado la escena deja ir su


      // CONTENIDO y se queda solo con el fondo. Asi en la costura no hay


      // dos textos superpuestos —que se veia como fantasma— y, como el


      // fondo de las dos escenas es el mismo navy, el fondo NO cambia:


      // la imagen sigue, solo se releva lo que hay encima.


      tl.to(["#s7-clip-doc", "#s7-clip-cromo"], { opacity: 0, duration: 0.55, ease: "power2.in" }, 45.19);



      // marca-fuera: la marca de esquina vive fuera de los clips que se



      // sueltan, asi que hay que apagarla aparte o se queda encima de lo



      // que trae la escena siguiente.



      tl.to("#s7-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 45.19);




      // reescalado-a-la-voz: la coreografia se escribio contra una voz que




      // duraba 46.89s; la nueva dura 50.58s. tl.duration() reescala TODA la




      // linea de tiempo de golpe —incluidos los tiempos que salen de




      // constantes como ETAPA_IN, que un buscar-y-reemplazar no ve— y deja




      // la coreografia pegada a la narracion sin tocar un solo numero.




      tl.duration(50.58);





      window.__timelines[ID] = tl;
    })();
  </script>

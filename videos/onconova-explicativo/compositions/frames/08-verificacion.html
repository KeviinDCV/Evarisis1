  <script>
    (function () {
      var ID = "08-verificacion";
      var tl = gsap.timeline({ paused: true,
        // immediateRender:false POR DEFECTO. Sin esto, cada fromTo escribe
        // su estado FROM al CONSTRUIR la linea de tiempo, no al llegar a su
        // marca: el ultimo declarado gana y el elemento aparece en pantalla
        // desde el fotograma 0. Aqui provoco un chip duplicado visible 8s
        // antes de tiempo, un punto viajero clavado 23s y un parpadeo del
        // diagnostico. Como default de la timeline lo hereda todo hijo.
        defaults: { immediateRender: false } });

      var $ = function (s) { return document.querySelector(s); };

      var amb        = $(".v8-amb");
      var radialWrap = $(".v8-radial-wrap");
      var aliento    = $("#v8-aliento");
      var chip       = $("#v8-chip");
      var hl         = $("#v8-hl");
      var numEl      = $("#v8-num");
      var pctEl      = $("#v8-pct");
      var path1      = $("#v8-path1");
      var path2      = $("#v8-path2");
      var trav       = $("#v8-trav");
      var travGlow   = $("#v8-travglow");

      /* ─────────────────────────────────────────────────────────────────────
         ESCENA 1 (0.0–4.0) · "se puede comprobar"
         El escenario abre y el rótulo de sección sube tras una máscara.
         ──────────────────────────────────────────────────────────────────── */

      // ambient-glow-bloom: radial navy tenue del lado del foco
      tl.fromTo(".v8-radial",
        { opacity: 0, scale: 0.88 },
        { opacity: 0.34, scale: 1, duration: 1.6, ease: "power2.out" }, 0);
      tl.fromTo(".v8-grid",
        { opacity: 0 }, { opacity: 1, duration: 1.9, ease: "power1.out" }, 0.1);

      // discrete-text-sequence: una sola palabra, subida enmascarada
      tl.fromTo("#v8-hero",
        { yPercent: 105, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.95, ease: "power3.out" }, 0.15);

      tl.fromTo(".v8-hair",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 1.5, ease: "power2.out" }, 0.3);

      // anclas de borde
      tl.fromTo(".v8-brand", { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.9, ease: "power2.out" }, 1.1);
      tl.fromTo(".v8-mark", { opacity: 0, x: 14 },
        { opacity: 1, x: 0, duration: 0.9, ease: "power2.out" }, 1.4);

      // sine-wave-loop (registro bajo): la respiración ÚNICA del fondo, 0→29s.
      // Un solo proxy alimenta los tres decorativos: nunca hay ventana quieta.
      var breath = { p: 0 };
      var BR_CYCLES = 3.0;
      tl.fromTo(breath, { p: 0 }, {
        p: Math.PI * 2 * BR_CYCLES,
        duration: 29.0,
        ease: "none",
        onUpdate: function () {
          var s = Math.sin(breath.p);
          if (amb) gsap.set(amb, { opacity: 0.96 + s * 0.04 });
          if (radialWrap) gsap.set(radialWrap, { scale: 1 + s * 0.016 });
          if (aliento) gsap.set(aliento, { opacity: 0.58 + s * 0.14 });
        }
      }, 0);

      /* ─────────────────────────────────────────────────────────────────────
         ESCENA 2 (2.0–7.6) · "cada diagnóstico se contrastó contra el texto
         de su propio informe". Entra la fila; su valor SE ENCIENDE; después
         entra el informe con el hueco de la palabra todavía vacío.
         ──────────────────────────────────────────────────────────────────── */

      tl.fromTo(".v8-label-l",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.75, ease: "power2.out" }, 2.0);

      // split-tilt-cards: llega del ala izquierda con el giro de libro
      tl.fromTo(".v8-card-left",
        { opacity: 0, x: -74, rotateY: 7 },
        { opacity: 1, x: 0, rotateY: 0, duration: 1.0, ease: "power3.out" }, 2.35);

      tl.fromTo(".v8-rowl",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, stagger: 0.14, ease: "power2.out" }, 3.05);

      // el rótulo se apaga cuando la tabla se abre
      tl.fromTo("#v8-hero",
        { opacity: 1 }, { opacity: 0.30, duration: 1.1, ease: "sine.inOut" }, 4.2);

      // EL VALOR SE ENCIENDE: la celda barre y el texto pasa de apagado a tinta
      tl.fromTo(".v8-cell",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 4.35);
      tl.fromTo("#v8-dx",
        { color: '#8296b5' },
        { color: '#22304a', duration: 0.75, ease: "power1.inOut" }, 4.45);

      // el ala derecha, ~0.2s detrás del ritmo de la izquierda
      tl.fromTo(".v8-label-r",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.75, ease: "power2.out" }, 5.4);
      tl.fromTo(".v8-card-right",
        { opacity: 0, x: 74, rotateY: -7 },
        { opacity: 1, x: 0, rotateY: 0, duration: 1.0, ease: "power3.out" }, 5.75);

      tl.fromTo("#v8-rfld",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.3);
      tl.fromTo("#v8-r1",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" }, 6.45);
      tl.fromTo("#v8-r3",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" }, 6.7);

      // el hueco espera: fantasma de la frase + su renglón
      tl.fromTo("#v8-hl",
        { opacity: 0 }, { opacity: 0.16, duration: 0.7, ease: "sine.out" }, 7.05);
      tl.fromTo("#v8-slotrule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 7.15);

      /* ─────────────────────────────────────────────────────────────────────
         ESCENA 3 (7.55–12.8) · EL TRAZO.
         svg-path-draw dibuja el rail cruzando el hueco; el valor se despega
         de su celda, lo recorre y aterriza sobre las mismas palabras del
         informe. Ahí, y solo ahí, entra el ámbar.
         ──────────────────────────────────────────────────────────────────── */

      // svg-path-draw: longitud MEDIDA, nunca adivinada
      var L1 = 0, L2 = 0;
      if (path1 && path1.getTotalLength) { L1 = path1.getTotalLength(); }
      if (path2 && path2.getTotalLength) { L2 = path2.getTotalLength(); }
      if (!L1) { L1 = 312; }
      if (!L2) { L2 = 486; }
      if (path1) {
        path1.style.strokeDasharray = String(L1);
        path1.style.strokeDashoffset = String(L1);
      }
      if (path2) {
        path2.style.strokeDasharray = String(L2);
        path2.style.strokeDashoffset = String(L2);
      }

      tl.fromTo("#v8-path1", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 7.55);
      tl.fromTo("#v8-path1",
        { strokeDashoffset: L1 },
        { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" }, 7.6);
      tl.fromTo("#v8-node1", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 7.7);
      tl.fromTo("#v8-node2", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 9.05);

      // el duplicado se despega de la celda
      tl.fromTo("#v8-chiptx", { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power1.out" }, 8.1);
      tl.fromTo("#v8-dx", { opacity: 1 }, { opacity: 0.32, duration: 0.5, ease: "power1.inOut" }, 8.1);
      tl.fromTo("#v8-chipbg", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 8.15);

      /* Vuelo. Un solo proxy lineal gobierna despegue + travesía, así que
         ningún tween pisa a otro sobre el mismo transform y el seek es exacto.
         Geometría (comprobada contra la maqueta, en px de escenario):
           salida  → chip left 100 / top 500  (texto en 116 / 510)
           llegada → chip left 1060 / top 472 (texto en 1076 / 482)
         es decir dx = +960, dy = −28, con un arco de 56px de altura. */
      var LIFT_DUR = 0.65, FLY_DUR = 2.35, MOVE_DUR = LIFT_DUR + FLY_DUR;
      var DX = 960, DY = -28, LIFT = -18, ARC = 56;
      var move = { t: 0 };
      tl.fromTo(move, { t: 0 }, {
        t: 1,
        duration: MOVE_DUR,
        ease: "none",
        onUpdate: function () {
          var s = move.t * MOVE_DUR, x, y, k;
          if (s <= LIFT_DUR) {
            var a = s / LIFT_DUR;
            var e = 1 - Math.pow(1 - a, 3);          // power2.out
            x = 0; y = LIFT * e; k = 1 + 0.03 * e;
          } else {
            var q = (s - LIFT_DUR) / FLY_DUR;
            if (q > 1) { q = 1; }
            // power1.inOut
            var p = q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
            x = DX * p;
            y = LIFT + (DY - LIFT) * p - ARC * Math.sin(Math.PI * p);
            k = 1 + 0.03 * (1 - p * p * p);
          }
          if (chip) { gsap.set(chip, { x: x, y: y, scale: k }); }
        }
      }, 8.1);

      // aterrizaje: card-morph-anchor — el duplicado se disuelve sobre el
      // ancla idéntica al píxel (misma familia, cuerpo, interlínea y posición)
      tl.fromTo("#v8-chipbg", { opacity: 1 }, { opacity: 0, duration: 0.32, ease: "power1.in" }, 11.0);
      tl.fromTo("#v8-chiptx", { opacity: 1 }, { opacity: 0, duration: 0.32, ease: "power1.inOut" }, 11.18);
      tl.fromTo("#v8-hl", { opacity: 0.16 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 11.18);
      tl.fromTo("#v8-slotrule", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.inOut" }, 11.2);

      // EL FOCO: el ámbar barre la frase literal del informe
      var sweep = { v: 0 };
      tl.fromTo(sweep, { v: 0 }, {
        v: 1,
        duration: 1.15,
        ease: "power2.inOut",
        onUpdate: function () {
          if (hl) { hl.style.backgroundSize = (sweep.v * 100).toFixed(2) + "% 100%"; }
        }
      }, 11.65);

      // el valor vuelve a encenderse en su celda: ahora está en los dos sitios
      tl.fromTo("#v8-dx", { opacity: 0.32 }, { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 12.3);

      /* ─────────────────────────────────────────────────────────────────────
         ESCENA 4 (13.5–20.4) · "2.034 de 2.076 … el resto, anotados uno a uno"
         counting-dynamic-scale + stat-bars-and-fills, un gesto cada vez.
         ──────────────────────────────────────────────────────────────────── */

      tl.fromTo("#v8-metric",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 13.55);

      // counting-dynamic-scale: el valor cuenta mientras el transform crece
      var COUNT_DUR = 2.25, COUNT_EASE = "power2.out";
      tl.fromTo("#v8-num", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 13.85);
      tl.fromTo("#v8-num", { scale: 0.78 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, 13.9);
      var count = { v: 0 };
      tl.fromTo(count, { v: 0 }, {
        v: 2034,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: function () {
          if (!numEl) { return; }
          var n = Math.round(count.v);
          var s = "" + n;
          numEl.textContent = s.length > 3
            ? s.slice(0, s.length - 3) + "." + s.slice(s.length - 3)
            : s;
        }
      }, 13.9);

      tl.fromTo("#v8-den",
        { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 14.7);

      // stat-bars-and-fills: el carril primero, el relleno después
      tl.fromTo("#v8-track",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 15.6);

      tl.fromTo("#v8-pct", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 16.6);
      // relleno y porcentaje comparten arranque, duración y ease: un solo latido
      tl.fromTo("#v8-fill",
        { scaleX: 0 }, { scaleX: 0.98, duration: 1.7, ease: "power2.inOut" }, 16.6);
      var pct = { v: 0 };
      tl.fromTo(pct, { v: 0 }, {
        v: 98,
        duration: 1.7,
        ease: "power2.inOut",
        onUpdate: function () {
          if (pctEl) { pctEl.textContent = "· " + Math.round(pct.v) + " %"; }
        }
      }, 16.6);

      // el resto: el tramo que falta se raya, y se marca uno a uno
      tl.fromTo("#v8-tail",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.75, ease: "power2.out" }, 18.55);
      tl.fromTo(".v8-tick",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.5, stagger: 0.26, ease: "power2.out" }, 19.3);

      /* ─────────────────────────────────────────────────────────────────────
         ESCENA 5 (21.2–28.6) · "la cifra se puede seguir hasta la frase
         que la sostiene". Cae la música: un gesto cada vez, con aire.
         ──────────────────────────────────────────────────────────────────── */

      // segundo trazo: de la cifra proyectada de vuelta a su frase
      tl.fromTo("#v8-path2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 21.2);
      tl.fromTo("#v8-path2",
        { strokeDashoffset: L2 },
        { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, 21.25);

      // y algo lo recorre: bezier evaluado a mano, misma curva que el path
      var P0 = [660, 728], P1 = [850, 736], P2 = [990, 690], P3 = [1040, 500];
      var walk = { p: 0 };
      tl.fromTo("#v8-trav", { opacity: 0 }, { opacity: 0.95, duration: 0.3, ease: "power1.out" }, 23.45);
      tl.fromTo("#v8-travglow", { opacity: 0 }, { opacity: 0.16, duration: 0.3, ease: "power1.out" }, 23.45);
      tl.fromTo(walk, { p: 0 }, {
        p: 1,
        duration: 1.75,
        ease: "sine.inOut",
        onUpdate: function () {
          var t = walk.p, u = 1 - t;
          var a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
          var cx = a * P0[0] + b * P1[0] + c * P2[0] + d * P3[0];
          var cy = a * P0[1] + b * P1[1] + c * P2[1] + d * P3[1];
          if (trav) { gsap.set(trav, { attr: { cx: cx, cy: cy } }); }
          if (travGlow) { gsap.set(travGlow, { attr: { cx: cx, cy: cy } }); }
        }
      }, 23.55);

      // relevo: el punto llega y se queda como nodo en el borde de la tarjeta
      tl.fromTo("#v8-node3", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 25.3);
      tl.fromTo("#v8-trav", { opacity: 0.95 }, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 25.3);
      tl.fromTo("#v8-travglow", { opacity: 0.16 }, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 25.3);

      // último gesto: la frase que sostiene la cifra respira una sola vez
      tl.fromTo("#v8-halo",
        { opacity: 0 }, { opacity: 0.30, duration: 3.0, ease: "sine.inOut" }, 25.55);

      window.__timelines = window.__timelines || {};
      // marcador-fuera: el numero de seccion cambia entre escenas, asi que
      // si sigue encendido durante el encadenado se ve doble y desplazado.
      // Se apaga justo antes de la costura; la marca de arriba NO se toca,
      // porque es identica en todas y superpuesta no se nota.
      tl.to(".v8-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 25.26);

      // suelta-contenido: al empezar el encadenado la escena deja ir su

      // CONTENIDO y se queda solo con el fondo. Asi en la costura no hay

      // dos textos superpuestos —que se veia como fantasma— y, como el

      // fondo de las dos escenas es el mismo navy, el fondo NO cambia:

      // la imagen sigue, solo se releva lo que hay encima.

      tl.to(['[id="08-verificacion-escena"]'], { opacity: 0, duration: 0.55, ease: "power2.in" }, 25.31);


      // marca-fuera: la marca de esquina vive fuera de los clips que se


      // sueltan, asi que hay que apagarla aparte o se queda encima de lo


      // que trae la escena siguiente.


      tl.to(".v8-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 25.31);



      // reescalado-a-la-voz: la coreografia se escribio contra una voz que



      // duraba 27.01s; la nueva dura 29.35s. tl.duration() reescala TODA la



      // linea de tiempo de golpe —incluidos los tiempos que salen de



      // constantes como ETAPA_IN, que un buscar-y-reemplazar no ve— y deja



      // la coreografia pegada a la narracion sin tocar un solo numero.



      tl.duration(29.35);




      window.__timelines[ID] = tl;
    })();
  </script>
</template>

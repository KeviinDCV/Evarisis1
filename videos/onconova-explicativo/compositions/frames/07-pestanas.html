  <script>
    (function () {
      var D = 44.52;
      var tl = gsap.timeline({ paused: true });

      var world = document.getElementById("p7-world");
      var radial = document.getElementById("p7-radial");
      var grid = document.getElementById("p7-grid");
      var hair = document.getElementById("p7-hair");
      var veil = document.getElementById("p7-veil");
      var vistaEl = document.getElementById("p7-vista");
      var indiceEl = document.getElementById("p7-indice");

      /* ---------------------------------------------------------------
         Geometría de la fila de pestañas. El ámbar nace con el ancho de
         la primera (270px) y viaja escalándose al ancho de cada una: un
         solo elemento acentuado en todo el cuadro.
         --------------------------------------------------------------- */
      var TABX = [0, 276, 540, 724, 920, 1196, 1400];
      var TABW = [270, 258, 178, 190, 270, 198, 190];
      var CX   = [259, 529, 753, 943, 1179, 1419, 1619];  // centros, coords de página
      var CY   = 260;

      // el instante en que la voz nombra cada vista
      var T = [3.50, 9.50, 15.00, 19.50, 25.50, 32.50, 36.50];

      var VISTAS = [
        "VISTA · ESTADÍSTICAS GENERALES",
        "VISTA · VISUALIZADOR DE DATOS",
        "VISTA · POR PACIENTE",
        "VISTA · BIOMARCADORES",
        "VISTA · ANÁLISIS DE MALIGNIDAD",
        "VISTA · IMPORTAR DATOS",
        "VISTA · EXPORTACIONES"
      ];
      var INDICES = ["01 / 07", "02 / 07", "03 / 07", "04 / 07", "05 / 07", "06 / 07", "07 / 07"];

      var PUSH_AT = 41.2;   // acercamiento final: sigue en curso en el último fotograma

      /* ---------------------------------------------------------------
         ESCENARIO FIJO. Un único reloj lineal escribe la respiración del
         fondo y los rótulos del plinto — determinista, sin callbacks y
         seguro ante cualquier salto de fotograma del renderizador.
         --------------------------------------------------------------- */
      var clock = { t: 0 };
      var lastV = null, lastI = null;

      function writeFrame() {
        var t = clock.t;
        var b = Math.sin(t * 0.3);

        // smoothstep del 1,8 %: nace en 41,2 s y NO termina dentro de la escena
        var push = 0;
        if (t > PUSH_AT) {
          var p = Math.min(1, (t - PUSH_AT) / 3.6);
          push = 0.018 * (p * p * (3 - 2 * p));
        }

        world.style.transform =
          "translate(" +
          (Math.sin(t * 0.21) * 3).toFixed(2) + "px," +
          (Math.sin(t * 0.273) * 1.6).toFixed(2) + "px) scale(" +
          (1 + 0.004 * b + push).toFixed(4) + ")";

        radial.style.transform = "scale(" + (1 + 0.05 * b).toFixed(4) + ")";
        radial.style.opacity = (0.55 + 0.18 * b).toFixed(4);
        grid.style.opacity = (0.04 + 0.012 * b).toFixed(4);
        hair.style.opacity = (0.55 + 0.22 * b).toFixed(4);
        veil.style.opacity = (0.46 + 0.16 * Math.sin(t * 0.42 + 1.1)).toFixed(4);

        // el plinto nombra la vista que se acaba de abrir
        var v = "GESTIÓN DE LA BASE DE DATOS", ix = "7 VISTAS";
        for (var k = 0; k < T.length; k++) {
          if (t >= T[k]) { v = VISTAS[k]; ix = INDICES[k]; }
        }
        if (v !== lastV) { vistaEl.textContent = v; lastV = v; }
        if (ix !== lastI) { indiceEl.textContent = ix; lastI = ix; }
      }

      // el reloj recorre exactamente la duración declarada: el fondo
      // respira los 44,52 s sin una sola ventana congelada
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: writeFrame }, 0);
      writeFrame(); // semilla del fotograma 0

      /* ---------------------------------------------------------------
         helpers: cursor, clic con onda, y activación de pestaña
         --------------------------------------------------------------- */
      var cursor = "#p7-cursor";
      var amber = "#p7-amber";

      function moveTo(x, y, at, dur) {
        tl.to(cursor, { x: x, y: y, duration: dur, ease: "power2.inOut" }, at);
      }

      // el cursor va a la pestaña i y la deja resaltada al llegar (respuesta
      // de hover antes del clic: la interfaz reacciona, no espera)
      function irAPestana(i, at, dur) {
        moveTo(CX[i], CY, at, dur);
        tl.to("#p7-tab-" + i,
          { backgroundColor: "rgba(45,62,94,0.12)", duration: 0.3, ease: "power2.out" },
          at + dur - 0.06);
      }

      function activar(i, at) {
        var press = at - 0.10;

        // el cursor comprime más que el receptor: el cursor es el actor
        tl.to(cursor, { scale: 0.84, duration: 0.09, ease: "power2.in" }, press);
        tl.to(cursor, { scale: 1, duration: 0.15, ease: "power2.out" }, press + 0.09);
        tl.fromTo("#p7-rg-" + i + " i",
          { scale: 0, opacity: 0.5 },
          { scale: 2.5, opacity: 0, duration: 0.72, ease: "power2.out",
            stagger: 0.09, immediateRender: false },
          press + 0.03);

        // la pestaña se HUNDE bajo el clic
        tl.to("#p7-tab-" + i, { scale: 0.965, duration: 0.09, ease: "power2.in" }, press);
        tl.to("#p7-tab-" + i, { scale: 1, duration: 0.2, ease: "power2.out" }, press + 0.09);

        // la anterior se apaga y suelta su miniatura
        if (i > 0) {
          tl.to("#p7-fill-" + (i - 1), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
          tl.to("#p7-lbl-" + (i - 1), { color: "rgba(34,48,74,0.62)", duration: 0.3, ease: "power2.inOut" }, at);
          tl.to("#p7-tab-" + (i - 1), { backgroundColor: "rgba(45,62,94,0.06)", duration: 0.42, ease: "power2.inOut" }, at);
          tl.to("#p7-view-" + (i - 1), { opacity: 0, duration: 0.28, ease: "power2.in" }, at);
        }

        // la nueva toma el navy y el texto claro (así es el notebook real)
        tl.fromTo("#p7-fill-" + i,
          { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out", immediateRender: false }, at);
        tl.to("#p7-lbl-" + i, { color: "rgba(244,246,250,0.98)", duration: 0.3, ease: "power2.out" }, at + 0.04);

        // el ÁMBAR se desliza hasta ella y adopta su ancho
        if (i === 0) {
          tl.fromTo(amber, { x: 0, scaleX: 0 },
            { x: 0, scaleX: 1, duration: 0.52, ease: "power3.out" }, at + 0.02);
        } else {
          tl.to(amber, { x: TABX[i], scaleX: TABW[i] / 270, duration: 0.58, ease: "power3.inOut" }, at + 0.02);
        }

        // y debajo entra la miniatura de esa vista
        tl.fromTo("#p7-view-" + i,
          { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, at + 0.14);
      }

      /* =========================================================
         BEAT 0 (0.0–3.5) — «La base de datos tiene siete vistas.»
         Llega la ventana y las siete pestañas caen una tras otra.
         ========================================================= */
      tl.fromTo("#p7-panel",
        { opacity: 0, y: 16, scale: 0.99 },
        { opacity: 1, y: 0, scale: 1, duration: 0.74, ease: "power3.out" }, 0);

      tl.fromTo("#p7-tit",
        { yPercent: 110 }, { yPercent: 0, duration: 0.66, ease: "power3.out" }, 0.28);

      // waterfall-entry: las SIETE, en su orden, mientras la voz las anuncia
      tl.fromTo(".p7-tab",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.19 }, 0.55);

      tl.fromTo("#p7-tabline",
        { scaleX: 0 }, { scaleX: 1, duration: 0.85, ease: "power3.out" }, 1.95);

      tl.fromTo("#p7-status",
        { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.35);

      // el cursor entra desde fuera de la superficie y sube a la primera
      tl.fromTo(cursor,
        { x: 1700, y: 880, opacity: 0 },
        { x: 1700, y: 880, opacity: 1, duration: 0.34, ease: "power2.out" }, 1.05);
      irAPestana(0, 2.45, 0.92);

      /* =========================================================
         BEAT 1 (3.5–9.5) — «Estadísticas Generales: los indicadores
         del servicio y los diagnósticos más frecuentes.»
         ========================================================= */
      activar(0, T[0]);

      tl.fromTo(".p7-v0c",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out", stagger: 0.3, immediateRender: false }, 3.78);
      tl.fromTo("#p7-cifra-2076",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 4.12);
      tl.fromTo(".p7-v0b",
        { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out", stagger: 0.3, immediateRender: false }, 4.42);

      tl.fromTo("#p7-v0-sect",
        { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, 5.55);
      tl.fromTo(".p7-v0h",
        { opacity: 0, x: 22 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.13, immediateRender: false }, 5.95);
      tl.fromTo(".p7-v0r",
        { opacity: 0, y: 16 },
        { opacity: 0.72, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.32, immediateRender: false }, 6.45);

      moveTo(620, 620, 4.75, 1.15);   // el cursor baja a la tabla mientras se puebla
      irAPestana(1, 8.45, 0.92);

      /* =========================================================
         BEAT 2 (9.5–15.0) — «Visualizador de Datos: la tabla completa,
         estudio por estudio, con buscador y filtros.»
         ========================================================= */
      activar(1, T[1]);

      tl.fromTo("#p7-v1-tit",
        { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.52, ease: "power3.out", immediateRender: false }, 9.62);
      tl.fromTo("#p7-v1-search",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.52, ease: "power3.out", immediateRender: false }, 9.78);
      tl.fromTo("#p7-v1-ph",
        { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power2.out", immediateRender: false }, 10.05);
      tl.fromTo(".p7-v1f",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out", stagger: 0.16, immediateRender: false }, 10.35);

      tl.fromTo(".p7-v1h",
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.1, immediateRender: false }, 11.1);
      tl.fromTo(".p7-v1r",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.25, immediateRender: false }, 11.6);

      // el cursor pasa por la primera fila y la fila responde
      moveTo(700, 486, 12.55, 1.05);
      tl.fromTo("#p7-v1-wash",
        { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power2.out", immediateRender: false }, 13.35);
      tl.to("#p7-v1-wash", { opacity: 0, duration: 0.42, ease: "power2.inOut" }, 13.95);

      irAPestana(2, 13.95, 0.92);

      /* =========================================================
         BEAT 3 (15.0–19.5) — «Por Paciente: los estudios agrupados
         por cédula.»
         ========================================================= */
      activar(2, T[2]);

      tl.fromTo("#p7-v2-sw",
        { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power2.out", immediateRender: false }, 15.3);
      tl.fromTo("#p7-v2-swlab",
        { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.46, ease: "power3.out", immediateRender: false }, 15.38);
      // el interruptor se pone: el knob viaja y la pista se llena de navy
      tl.fromTo("#p7-v2-knob",
        { x: 0 }, { x: 22, duration: 0.42, ease: "power3.inOut", immediateRender: false }, 15.85);
      tl.to("#p7-v2-sw", { backgroundColor: "rgba(45,62,94,0.22)", duration: 0.42, ease: "power2.out" }, 15.85);

      tl.fromTo(".p7-v2h",
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.12, immediateRender: false }, 16.15);
      tl.fromTo(".p7-v2r",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.26, immediateRender: false }, 16.75);

      moveTo(560, 520, 17.5, 1.0);
      irAPestana(3, 18.45, 0.92);

      /* =========================================================
         BEAT 4 (19.5–25.5) — «Biomarcadores: cuántos se pidieron y
         con qué positividad.»
         ========================================================= */
      activar(3, T[3]);

      tl.fromTo(".p7-v3c",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.58, ease: "power3.out", stagger: 0.26, immediateRender: false }, 19.82);
      tl.fromTo(".p7-v3b",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.out", stagger: 0.26, immediateRender: false }, 20.42);
      // «…y con qué positividad»: las barras crecen una a una
      tl.fromTo(".p7-v3f",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.72, ease: "power3.out", stagger: 0.3, immediateRender: false }, 22.05);

      moveTo(900, 500, 21.15, 1.1);
      irAPestana(4, 24.3, 1.0);

      /* =========================================================
         BEAT 5 (25.5–32.5) — «Análisis de Malignidad: el cruce entre
         cada biomarcador y el resultado del caso.»
         ========================================================= */
      activar(4, T[4]);

      tl.fromTo(".p7-v4c",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.3, immediateRender: false }, 25.82);
      tl.fromTo(".p7-v4b",
        { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out", stagger: 0.3, immediateRender: false }, 26.1);
      tl.fromTo("#p7-cifra-671",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.66, ease: "power3.out", immediateRender: false }, 27.05);

      tl.fromTo(".p7-v4h",
        { opacity: 0, x: 26 },
        { opacity: 1, x: 0, duration: 0.52, ease: "power3.out", stagger: 0.14, immediateRender: false }, 27.85);
      tl.fromTo(".p7-v4r",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.34, immediateRender: false }, 28.6);
      // el cruce: cada cifra aterriza de izquierda a derecha, fila a fila
      tl.fromTo(".p7-v4v",
        { opacity: 0, y: 9 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.07, immediateRender: false }, 29.25);

      moveTo(1010, 600, 30.0, 1.15);
      irAPestana(5, 31.3, 1.0);

      /* =========================================================
         BEAT 6 (32.5–36.5) — «Importar Datos, que es por donde
         acabamos de entrar.»
         ========================================================= */
      activar(5, T[5]);

      tl.fromTo(".p7-v5btn",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.22, immediateRender: false }, 32.8);
      tl.fromTo("#p7-v5-tree",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 33.28);
      tl.fromTo(".p7-v5r",
        { opacity: 0, x: 20 },
        { opacity: 1, x: 0, duration: 0.44, ease: "power3.out", stagger: 0.17, immediateRender: false }, 33.5);
      tl.fromTo("#p7-v5-log",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 34.35);
      tl.fromTo(".p7-v5l",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.42, ease: "power2.out", stagger: 0.12, immediateRender: false }, 34.6);

      moveTo(480, 560, 34.15, 1.0);
      irAPestana(6, 35.4, 0.94);

      /* =========================================================
         BEAT 7 (36.5–44.52) — «Y Exportaciones, donde queda todo lo
         que se ha generado.» La última vista se construye entera y la
         escena se queda mirándola con un acercamiento que NO resuelve.
         ========================================================= */
      activar(6, T[6]);

      tl.fromTo("#p7-v6-izq",
        { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, 36.8);
      tl.fromTo(".p7-v6r",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.3, immediateRender: false }, 37.15);

      tl.fromTo("#p7-v6-der",
        { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, 38.3);
      tl.fromTo(".p7-v6v",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.44, ease: "power2.out", stagger: 0.19, immediateRender: false }, 38.75);

      // el cursor baja a la lista y el archivo generado responde al pasar
      moveTo(430, 560, 39.7, 1.2);
      tl.fromTo("#p7-v6-wash",
        { opacity: 0 }, { opacity: 1, duration: 0.38, ease: "power2.out", immediateRender: false }, 41.0);
      moveTo(1000, 620, 41.75, 1.2);

      window.__timelines = window.__timelines || {};

      // marcador-fuera: el numero de seccion CAMBIA entre escenas, asi que si
      // sigue encendido durante el encadenado se leen los dos a la vez y sale
      // el amasijo que vimos en la costura ("078//133--LASSVISTAS").
      tl.to("#p7-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 42.77);

      // suelta-contenido: al empezar el encadenado la escena deja ir su
      // CONTENIDO y se queda solo con el fondo. Como el fondo de las 13 es el
      // mismo navy, la imagen NO se corta: solo se releva lo que hay encima.
      tl.to(["#p7-clip-escena"], { opacity: 0, duration: 0.55, ease: "power2.in" }, 42.82);

      // marca-fuera: la marca de esquina vive FUERA del clip que se suelta,
      // asi que hay que apagarla aparte o se queda sobre la escena siguiente.
      tl.to("#p7-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 42.82);

      window.__timelines["07-pestanas"] = tl;
    })();
  </script>
</template>

  <script>
    (function () {
      var ID = "05-abre";
      var D = 17.51;
      var tl = gsap.timeline({ paused: true });

      var world = document.getElementById("f05-abre-world");
      var radial = document.getElementById("f05-abre-radial");
      var grid = document.getElementById("f05-abre-grid");
      var hair = document.getElementById("f05-abre-hair");
      var veil = document.getElementById("f05-abre-veil");

      /* ---------------------------------------------------------
         ESCENARIO FIJO. Un único reloj lineal escribe la respiración
         del fondo y el acercamiento final: determinista, sin
         callbacks, seguro ante cualquier salto de fotograma.
         --------------------------------------------------------- */
      var PUSH_AT = 14.6;      // el acercamiento arranca y NO termina:
      var PUSH_DUR = 3.2;      // en el último fotograma sigue en curso,
      var PUSH_AMT = 0.02;     // así el montaje hereda la escena en movimiento

      var clock = { t: 0 };

      function writeFrame() {
        var t = clock.t;
        var b = Math.sin(t * 0.3);

        var push = 0;
        if (t > PUSH_AT) {
          var p = Math.min(1, (t - PUSH_AT) / PUSH_DUR);
          push = PUSH_AMT * (p * p * (3 - 2 * p));
        }

        world.style.transform =
          "translate(" +
          (Math.sin(t * 0.19) * 3).toFixed(2) + "px," +
          (Math.sin(t * 0.263) * 1.5).toFixed(2) + "px) scale(" +
          (1 + 0.0035 * b + push).toFixed(4) + ")";

        radial.style.transform = "scale(" + (1 + 0.05 * b).toFixed(4) + ")";
        radial.style.opacity = (0.55 + 0.18 * b).toFixed(4);
        grid.style.opacity = (0.04 + 0.012 * b).toFixed(4);
        hair.style.opacity = (0.55 + 0.22 * b).toFixed(4);
        veil.style.opacity = (0.46 + 0.16 * Math.sin(t * 0.42 + 1.1)).toFixed(4);
      }

      // el reloj recorre exactamente la duración declarada: el fondo
      // respira los 17,51 s sin una sola ventana congelada
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: writeFrame }, 0);
      writeFrame(); // semilla del fotograma 0

      /* --------- helpers de cursor (cursor-click-ripple, finito) --------- */
      var cursor = "#f05-abre-cursor";

      function moveTo(x, y, at, dur) {
        tl.to(cursor, { x: x, y: y, duration: dur, ease: "power2.inOut" }, at);
      }

      /* =========================================================
         BEAT 0 (0.0–4.5) — «Así abre el programa: a pantalla
         completa, sin instalación y sin contraseña.»
         La ventana crece y se asienta; el cromo y la cabecera
         llegan detrás, sin splash y sin pedir nada.
         ========================================================= */
      tl.fromTo("#f05-abre-win",
        { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo("#f05-abre-win",
        { scale: 0.968, y: 14 },
        { scale: 1, y: 0, duration: 0.86, ease: "power3.out" }, 0);

      tl.fromTo("#f05-abre-chrome-txt",
        { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" },
        { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.62, ease: "power2.out" }, 0.18);
      tl.fromTo("#f05-abre-dots",
        { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, 0.42);

      tl.fromTo("#f05-abre-lock",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.66, ease: "power3.out" }, 0.40);
      tl.fromTo("#f05-abre-user",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.68);
      tl.fromTo("#f05-abre-pill",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.82);
      tl.fromTo("#f05-abre-hrule",
        { scaleX: 0 }, { scaleX: 1, duration: 0.66, ease: "power3.out" }, 0.92);

      // el botón del menú ya está ahí desde que abre: es parte de la app
      tl.fromTo("#f05-abre-btn",
        { opacity: 0, scale: 0.84 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.1);

      tl.fromTo("#f05-abre-bigiso",
        { opacity: 0, y: 16, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 1.28);
      tl.fromTo("#f05-abre-h1",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 2.2);
      tl.fromTo("#f05-abre-sub-1",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" }, 3.1);
      tl.fromTo("#f05-abre-sub-2",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" }, 3.45);

      /* =========================================================
         BEAT 1 (4.5–7.0) — «Esta es la pantalla de bienvenida.»
         Se completa el texto de la bienvenida y aparece el atajo.
         ========================================================= */
      tl.fromTo("#f05-abre-sel-1",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 4.75);
      tl.fromTo("#f05-abre-sel-2",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 5.1);
      tl.fromTo("#f05-abre-hint",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power2.out" }, 6.0);

      // el cursor entra por la derecha, fuera del recorrido del texto
      tl.fromTo(cursor,
        { x: 1430, y: 842, opacity: 0 },
        { x: 1430, y: 842, opacity: 1, duration: 0.34, ease: "power2.out" }, 6.05);

      /* =========================================================
         BEAT 2 (7.0–11.5) — «Y abajo a la izquierda, el botón que
         despliega el panel de navegación.»
         El cursor baja al botón, éste se enciende en navy, se hunde
         al clic —ÚNICO ámbar de la escena— y el panel entra
         deslizándose desde el borde izquierdo.
         ========================================================= */
      // la punta se posa en el cuadrante inferior del botón: sobre el centro
      // exacto, el cuerpo de la flecha tapaba la tercera raya del icono
      moveTo(198, 831, 6.6, 1.3);

      // reposo -> hover: relleno navy, rayas en blanco (estado real del producto)
      tl.to("#f05-abre-btn",
        { backgroundColor: "rgb(45,62,94)", borderColor: "rgba(45,62,94,1)", duration: 0.3, ease: "power2.out" }, 7.92);
      tl.to(["#f05-abre-slat-1", "#f05-abre-slat-2", "#f05-abre-slat-3"],
        { backgroundColor: "rgb(233,238,247)", duration: 0.3, ease: "power2.out" }, 7.94);

      // el clic: el cursor comprime más que el receptor
      tl.to(cursor, { scale: 0.84, duration: 0.09, ease: "power2.in" }, 10.25);
      tl.to(cursor, { scale: 1, duration: 0.15, ease: "power2.out" }, 10.34);
      tl.to("#f05-abre-btn", { scale: 0.93, duration: 0.1, ease: "power2.in" }, 10.27);
      tl.to("#f05-abre-btn", { scale: 1, duration: 0.24, ease: "power2.out" }, 10.37);

      // EL ÁMBAR: el aro del botón se enciende y dos ondas salen de él
      tl.fromTo("#f05-abre-rim",
        { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 10.26);
      tl.fromTo(["#f05-abre-ring-1", "#f05-abre-ring-2"],
        { scale: 0.55, opacity: 0.75 },
        { scale: 2.3, opacity: 0, duration: 0.62, ease: "power2.out", stagger: 0.1, immediateRender: false },
        10.28);
      tl.to("#f05-abre-rim", { opacity: 0.35, duration: 0.45, ease: "power2.inOut" }, 10.72);

      // el panel ENTRA desde x = -300, con ease-out, como en la app
      tl.fromTo("#f05-abre-nav",
        { x: -300 }, { x: 0, duration: 0.48, ease: "power2.out" }, 10.55);

      // el contenido del panel llega arrastrando, sin dejarlo vacío al deslizar
      tl.fromTo("#f05-abre-navhead",
        { opacity: 0.25, x: -16 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 10.66);
      tl.fromTo("#f05-abre-navrule",
        { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 10.78);
      tl.fromTo(["#f05-abre-item-0", "#f05-abre-item-1", "#f05-abre-item-2", "#f05-abre-item-3"],
        { opacity: 0.3, x: -24 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.09 }, 10.72);
      tl.fromTo("#f05-abre-close",
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 11.5);

      // el ítem activo se pinta: fondo navy, texto blanco
      tl.fromTo("#f05-abre-fill-0",
        { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 11.28);
      tl.to("#f05-abre-txt-0",
        { color: "rgb(244,246,250)", duration: 0.35, ease: "power2.out" }, 11.42);

      /* =========================================================
         BEAT 3 (11.5–16.0) — «Desde ahí se llega a todo: Inicio,
         Base de Datos y Dashboard.»
         El cursor sube por el menú y cada destino nombrado responde.
         El cuarto ítem —Interoperabilidad QHORTE— está, como en la
         app, pero ni se nombra ni se resalta.
         ========================================================= */
      moveTo(270, 486, 12.6, 0.75);                    // Inicio
      tl.fromTo("#f05-abre-uline",
        { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 13.42);

      moveTo(270, 546, 14.05, 0.55);                   // Base de Datos
      tl.to("#f05-abre-wash-1", { opacity: 1, duration: 0.3, ease: "power2.out" }, 14.62);
      tl.fromTo("#f05-abre-bar-1",
        { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 14.66);
      tl.to("#f05-abre-wash-1", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 15.3);
      tl.to("#f05-abre-bar-1", { scaleY: 0, duration: 0.35, ease: "power2.inOut" }, 15.3);

      moveTo(270, 606, 15.25, 0.55);                   // Dashboard
      tl.to("#f05-abre-wash-2", { opacity: 1, duration: 0.3, ease: "power2.out" }, 15.82);
      tl.fromTo("#f05-abre-bar-2",
        { scaleY: 0 }, { scaleY: 1, duration: 0.42, ease: "power3.out" }, 15.86);

      // el cursor se queda vivo hasta el corte: sigue moviéndose cuando
      // el montaje releva la escena
      moveTo(276, 614, 16.6, 0.9);

      window.__timelines = window.__timelines || {};

      // marcador-fuera: el numero de seccion CAMBIA entre escenas, asi que si
      // sigue encendido durante el encadenado se leen los dos a la vez y sale
      // el amasijo que vimos en la costura ("078//133--LASSVISTAS").
      tl.to("#f05-abre-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 15.76);

      // suelta-contenido: al empezar el encadenado la escena deja ir su
      // CONTENIDO y se queda solo con el fondo. Como el fondo de las 13 es el
      // mismo navy, la imagen NO se corta: solo se releva lo que hay encima.
      tl.to(["#f05-abre-clip-escena"], { opacity: 0, duration: 0.55, ease: "power2.in" }, 15.81);

      // marca-fuera: la marca de esquina vive FUERA del clip que se suelta,
      // asi que hay que apagarla aparte o se queda sobre la escena siguiente.
      tl.to("#f05-abre-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 15.81);

      window.__timelines[ID] = tl;
    })();
  </script>

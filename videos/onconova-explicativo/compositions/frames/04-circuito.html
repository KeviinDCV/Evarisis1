    (function () {

      tl.fromTo("#c4-res-line", { scaleX: 0 },

      // si sigue encendido durante el encadenado se ve doble y desplazado.

      // Se apaga justo antes de la costura; la marca de arriba NO se toca,

      // porque es identica en todas y superpuesta no se nota.

      tl.to(".c4-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 31.34);


      // suelta-contenido: al empezar el encadenado la escena deja ir su


      // CONTENIDO y se queda solo con el fondo. Asi en la costura no hay


      // dos textos superpuestos —que se veia como fantasma— y, como el


      // fondo de las dos escenas es el mismo navy, el fondo NO cambia:


      // la imagen sigue, solo se releva lo que hay encima.


      



      // marca-fuera: la marca de esquina vive fuera de los clips que se



      // sueltan, asi que hay que apagarla aparte o se queda encima de lo



      // que trae la escena siguiente.



      tl.to(".c4-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 31.39);




      // reescalado-a-la-voz: la coreografia se escribio contra una voz que




      // duraba 33.09s; la nueva dura 39.59s. tl.duration() reescala TODA la




      // linea de tiempo de golpe —incluidos los tiempos que salen de




      // constantes como ETAPA_IN, que un buscar-y-reemplazar no ve— y deja




      // la coreografia pegada a la narracion sin tocar un solo numero.




      // suelta-contenido, anclada al reloj FINAL. Esta linea de tiempo se
      // reescala abajo con tl.duration(), asi que un instante escrito a
      // pelo NO cae donde parece: hay que dividir por el factor. Se toma
      // AQUI, antes de añadir nada, porque tl.duration() sin argumento
      // devuelve la duracion autorizada.
      // Arranca a la vez que la escena siguiente y dura 0,72 s: la
      // saliente se va MIENTRAS la entrante llega, para que no quede ni

      tl.duration(39.59);





      window.__timelines[ID] = tl;

      var root = document.querySelector('[data-composition-id="' + ID + '"]');

      var q = function (s) { return root.querySelector(s); };

      var world = q("#c4-world");
      var obj = q("#c4-obj");
      var radial = q("#c4-radial");
      var grid = q("#c4-grid");
      var hair = q("#c4-hair");

      /* =========================================================
         RELOJ DE CÁMARA — función pura del tiempo.
         viewport-change: una sola envoltura .world con transform
         compuesto translate()scale(); la posición en pantalla de un
         punto p del mundo es 960 + (p-960)*S + Tx.
         multi-phase-camera: cuatro paradas encadenadas + deriva sinusoidal.
         El truco de la escena: la cámara PERSIGUE al objeto con
         LAG segundos de retardo, así el documento se adelanta en
         pantalla durante el traslado y vuelve al centro al llegar.
         ========================================================= */
      var STOP = [960, 2320, 3680, 5040, 6400];
      var MOVE = [
        { at: 6.50, dur: 1.10, a: 0, b: 1 },
        { at: 14.50, dur: 1.05, a: 1, b: 2 },
        { at: 18.50, dur: 1.05, a: 2, b: 3 },
        { at: 25.90, dur: 1.10, a: 3, b: 4 }
      ];
      var LAG = 0.12;
      var SCALE = [
        { at: 6.60, dur: 1.20, a: 1.00, b: 1.05 },
        { at: 14.40, dur: 1.10, a: 1.05, b: 1.00 },
        { at: 27.40, dur: 5.20, a: 1.00, b: 1.03 }
      ];

      function ez(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
      function ramp(t, at, dur, a, b) {
        if (t <= at) return a;
        if (t >= at + dur) return b;
        return a + (b - a) * ez((t - at) / dur);
      }
      function trackX(t, lag) {
        var v = STOP[0];
        for (var i = 0; i < MOVE.length; i++) {
          var m = MOVE[i];
          if (t >= m.at + lag) v = ramp(t, m.at + lag, m.dur, STOP[m.a], STOP[m.b]);
        }
        return v;
      }
      function scaleAt(t) {
        var s = 1;
        for (var i = 0; i < SCALE.length; i++) {
          var m = SCALE[i];
          if (t >= m.at) s = ramp(t, m.at, m.dur, m.a, m.b);
        }
        return s;
      }

      var clock = { t: 0 };
      function writeFrame() {
        var t = clock.t;

        var b2 = Math.sin(t * 0.21);
        var S = scaleAt(t);
        var camX = trackX(t, LAG);
        var objX = trackX(t, 0);
        var Tx = -(camX - 960) * S + b2 * 5;
        var Ty = Math.sin(t * 0.273) * 3;

        world.style.transform =
          "translate(" + Tx.toFixed(2) + "px," + Ty.toFixed(2) + "px) scale(" + S.toFixed(4) + ")";
        obj.style.transform = "translate(" + (objX - 960).toFixed(2) + "px,0px)";

        radial.style.transform = "scale(" + (1 + 0.045 * b1).toFixed(4) + ")";
        radial.style.opacity = (0.52 + 0.16 * b1).toFixed(4);
        grid.style.opacity = (0.04 + 0.011 * b1).toFixed(4);
        hair.style.opacity = (0.52 + 0.22 * b2).toFixed(4);
      }
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: writeFrame }, 0);
      writeFrame();

      /* =========================================================
         0.0–3.5  "El circuito tiene cinco pasos."

      var FILL_AT = [3.55, 7.35, 15.30, 19.30, 26.80];

      /* =========================================================

          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 19.05 + i * 0.18);
        // 19.05, no 19.95: el rotulo de etapa entra en 19.25 y las casillas
        // llegaban 0.7s despues, dejando el cuadro casi vacio ese rato.
      }

      var CHIP = [
        { at: 20.85, x: -213, y: -18 },
        { at: 21.75, x: 213, y: -18 },
        { at: 22.65, x: -213, y: 138 },
        { at: 23.55, x: 213, y: 138 }
      ];
      for (i = 0; i < 4; i++) {
        var c = CHIP[i];
        var chip = q("#c4-chip-" + i);
        tl.fromTo(chip,
          { opacity: 0, scale: 0.72, x: 0, y: -244 },
          { opacity: 1, scale: 1, x: 0, y: -212, duration: 0.3, ease: "power2.out" }, c.at);
        tl.fromTo(chip,
          { x: 0, y: -212 },
          { x: c.x, y: c.y, duration: 0.78, ease: "power3.inOut", immediateRender: false },
          c.at + 0.3);
        tl.fromTo(chip,
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 0.92, duration: 0.34, ease: "power2.in", immediateRender: false },
          c.at + 1.02);

        var dock = c.at + 1.02;
        tl.fromTo(heads[i], { opacity: 0.32 },
          { opacity: 1, duration: 0.42, ease: "power2.out" }, dock);
        tl.fromTo(barsA[i], { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power3.out" }, dock + 0.06);
        tl.fromTo(barsB[i], { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power3.out" }, dock + 0.22);
      }

      tl.fromTo(q("#c4-dato-campos"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 24.75);
      tl.fromTo(q("#c4-dato-campos"),
        { opacity: 1, y: 0 },
        { opacity: 0, y: -12, duration: 0.5, ease: "power2.in", immediateRender: false }, 26.35);

      /* =========================================================
         27.0–31.6 "Y cinco: lo guarda en una base de datos que vive
                    en el hospital."
         card-morph-anchor: las cuatro casillas se compactan sobre la
         línea de la fila y se entregan a la fila real, que entra
         debajo. Detrás se van apilando más filas.
         ========================================================= */
      var COMPACT = [
        { dx: -102, dy: -62 },
        { dx: -318, dy: -62 },
        { dx: 318, dy: -218 },
        { dx: 102, dy: -218 }
      ];
      tl.fromTo(q("#c4-slab-1"), { opacity: 1 },
        { opacity: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 25.95);
      for (i = 0; i < 4; i++) {
        tl.fromTo(slots[i],
          { x: 0, y: 0, scale: 1 },
          { x: COMPACT[i].dx, y: COMPACT[i].dy, scale: 0.52,
            duration: 1.05, ease: "power2.inOut", immediateRender: false }, 25.95);
        tl.fromTo(slots[i], { opacity: 1 },
          { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 26.62);
      }

      var filas = qa(".c4-fila");
      tl.fromTo(filas[0],
        { opacity: 0, scaleX: 0.86, scaleY: 0.5 },
        { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.55, ease: "power3.out" }, 26.75);
      tl.fromTo(q("#c4-thead"),
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 27.25);

      var FONDO = [0.86, 0.74, 0.62, 0.5, 0.4];
      for (i = 1; i < filas.length; i++) {
        tl.fromTo(filas[i],
          { opacity: 0, y: 30 },
          { opacity: FONDO[i - 1], y: 0, duration: 0.62, ease: "power3.out" },
          27.85 + (i - 1) * 0.52);
      }

      tl.fromTo(q("#c4-dato-bd"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 28.55);

      /* sostenido final: la base respira, no se congela */
      tl.fromTo(q("#c4-tabla"), { scale: 1 },
        { scale: 1.012, duration: 2.0, ease: "power1.out" }, 30.60);
    })();
  </script>

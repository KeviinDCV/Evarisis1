                <span class="d5-mono c5-pc-4">HER2 · RE</span>
                <span class="d5-mono c5-pc-5">15/10/2025</span>
              </div>
            </div>

          <div class="d5-track" id="c5-track"></div>
          <div class="d5-thumb" id="c5-thumb"></div>

          <div class="d5-status" id="c5-status">
            <span id="c5-vista">VISTA · VISUALIZADOR DE DATOS</span>
            <span class="d5-right">
              <span id="c5-orden">ORDEN · FECHA</span>
              <svg width="11" height="8" viewBox="0 0 11 8" aria-hidden="true">
                <path d="M1 1.6 L5.5 6.4 L10 1.6" fill="none" stroke='#22304a' stroke-opacity="0.5" stroke-width="1.6" />
              </svg>
            </span>
          </div>
        </div>

        <!-- ================= CIFRAS VERIFICADAS ================= -->
        <div class="d5-side" id="c5-side">
          <div class="d5-stat" id="c5-stat-0"><b>22.547</b><p>estudios</p></div>
          <div class="d5-stat" id="c5-stat-1">
            <b>18.271</b><p>pacientes</p><span class="d5-u" id="c5-u-1"></span>
          </div>
          <div class="d5-stat" id="c5-stat-2"><b>189</b><p>campos por estudio</p></div>
        </div>

        <!-- ondas de clic, ancladas al punto exacto de cada clic -->
        <div class="d5-ring" id="c5-ring-a1" style="left: 420px; top: 337px"></div>
        <div class="d5-ring" id="c5-ring-a2" style="left: 420px; top: 337px"></div>
        <div class="d5-ring" id="c5-ring-b1" style="left: 777px; top: 262px"></div>
        <div class="d5-ring" id="c5-ring-b2" style="left: 777px; top: 262px"></div>
        <div class="d5-ring" id="c5-ring-c1" style="left: 430px; top: 441px"></div>
        <div class="d5-ring" id="c5-ring-c2" style="left: 430px; top: 441px"></div>

        <div class="d5-cursor" id="c5-cursor">
          <svg width="30" height="43" viewBox="0 0 30 43" aria-hidden="true">
            <path d="M3 2 L3 33 L11.2 25.4 L16.4 38.6 L22.4 36.1 L17.2 23.2 L27.6 22.6 Z"
                  fill="#e9eef7" stroke='#141d2b' stroke-width="2.6" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <div class="d5-brand d5-mono" id="c5-brand">ONCONOVA · GESTOR ONCOLÓGICO HUV</div>
      <div class="d5-mark d5-mono" id="c5-mark">08 / 13 — LOS DATOS</div>
    </div>
  </div>

  <script>
    (function () {
      var D = 29;
      var tl = gsap.timeline({ paused: true });

      var world = document.getElementById("c5-world");
      var radial = document.getElementById("c5-radial");
      var grid = document.getElementById("c5-grid");
      var hair = document.getElementById("c5-hair");
      var veil = document.getElementById("c5-veil");
      var qEl = document.getElementById("c5-q");
      var caretEl = document.getElementById("c5-caret");
      var vistaEl = document.getElementById("c5-vista");

      /* --------- marcas de tiempo compartidas por el reloj y la linea --------- */
      var QUERY = "carcinoma ductal";
      var FOCUS_AT = 7.05;          // clic en el buscador -> se enciende el ambar
      var TYPE_AT = 7.35;           // primera tecla
      var TYPE_DUR = 2.10;          // 16 caracteres, ritmo humano
      var CARET_OFF = 11.62;        // el campo pierde el cursor al cambiar de pestana
      var VISTA_AT = 12.05;         // el plinto anuncia la vista nueva
      var PUSH_AT = 26.4;           // acercamiento final, muy leve

      /* ---------------------------------------------------------
         ESCENARIO FIJO: la camara no viaja. Un unico reloj lineal
         escribe la respiracion del fondo, el texto tecleado, el
         parpadeo del cursor de texto y el conteo de filas — todo
         deterministico, sin callbacks, seguro ante cualquier salto
         de fotograma.
         --------------------------------------------------------- */
      var clock = { t: 0 };
      var lastQ = null, lastCaret = null, lastV = null;

      function writeFrame() {
        var t = clock.t;
        var b = Math.sin(t * 0.3);

        // acercamiento final: smoothstep, 2,4% — sigue en curso en el ultimo
        // fotograma (el corte al plano siguiente lo hereda en movimiento) y
        // nunca llega a la franja del rotulo de esquina
        var push = 0;
        if (t > PUSH_AT) {
          var p = Math.min(1, (t - PUSH_AT) / 3.6);
          push = 0.024 * (p * p * (3 - 2 * p));
        }

        world.style.transform =
          "translate(" +
          (Math.sin(t * 0.21) * 3).toFixed(2) + "px," +
          (Math.sin(t * 0.273) * 1.6).toFixed(2) + "px) scale(" +
          (1 + 0.004 * b + push).toFixed(4) + ")";

        radial.style.transform = "scale(" + (1 + 0.05 * b).toFixed(4) + ")";
        radial.style.opacity = (0.55 + 0.18 * b).toFixed(4);
        grid.style.opacity = (0.04 + 0.012 * b).toFixed(4);
        hair.style.opacity = (0.55 + 0.22 * b).toFixed(4);
        veil.style.opacity = (0.46 + 0.16 * Math.sin(t * 0.42 + 1.1)).toFixed(4);

        // el campo se escribe letra a letra
        var shown = 0;
        if (t > TYPE_AT) {
          shown = Math.floor(((t - TYPE_AT) / TYPE_DUR) * QUERY.length);
          if (shown > QUERY.length) shown = QUERY.length;
        }
        var nx = QUERY.substring(0, shown);
        if (nx !== lastQ) { qEl.textContent = nx; lastQ = nx; }

        // cursor de texto: fijo mientras se teclea, parpadeo cuadrado antes y despues
        var on = 0;
        if (t >= FOCUS_AT && t <= CARET_OFF) {
          on = (t >= TYPE_AT && t <= TYPE_AT + TYPE_DUR)
            ? 1
            : (Math.sin((t - FOCUS_AT) * Math.PI / 0.55) > 0 ? 1 : 0);
        }
        if (on !== lastCaret) { caretEl.style.opacity = on; lastCaret = on; }


        var v = t >= VISTA_AT ? "VISTA · POR PACIENTE" : "VISTA · VISUALIZADOR DE DATOS";
        if (v !== lastV) { vistaEl.textContent = v; lastV = v; }
      }

      // el reloj recorre exactamente la duracion declarada del root:
      // el fondo respira los 29 s sin una sola ventana congelada
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: writeFrame }, 0);
      writeFrame(); // semilla del fotograma 0

      /* ---------------------------------------------------------
         helpers de cursor (cursor-click-ripple, sin yoyo infinito)
         --------------------------------------------------------- */
      var cursor = "#c5-cursor";

      function moveTo(x, y, at, dur) {
        tl.to(cursor, { x: x, y: y, duration: dur, ease: "power2.inOut" }, at);
      }

      function click(at, ringA, ringB) {
        // el cursor comprime mas que el receptor: el cursor es el actor
        tl.to(cursor, { scale: 0.84, duration: 0.09, ease: "power2.in" }, at);
        tl.to(cursor, { scale: 1, duration: 0.15, ease: "power2.out" }, at + 0.09);
        tl.fromTo(
          [ringA, ringB],
          { scale: 0, opacity: 0.55 },
          { scale: 2.6, opacity: 0, duration: 0.74, ease: "power2.out", stagger: 0.09, immediateRender: false },
          at + 0.03
        );
      }

      /* =========================================================
         BEAT 0 (0.0–2.0) — «Así se ve el resultado.»
         La superficie llega y la tabla se puebla fila a fila.
         ========================================================= */
      tl.fromTo("#c5-panel",
        { opacity: 0, y: 14, scale: 0.99 },
        { opacity: 1, y: 0, scale: 1, duration: 0.72, ease: "power3.out" }, 0);

      tl.fromTo("#c5-tabs span",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power2.out", stagger: 0.055 }, 0.3);

      tl.fromTo("#c5-tabbar",
        { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.52);

      tl.fromTo("#c5-search",
        { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.45);

      tl.fromTo("#c5-ehead",
        { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.6);

      // waterfall-entry: las ocho filas aterrizan una tras otra
      var estOrder = ["#c5-r-0", "#c5-gh-0", "#c5-r-1", "#c5-gh-1", "#c5-r-2",
                      "#c5-r-3", "#c5-gh-2", "#c5-r-4"];
      for (var i = 0; i < estOrder.length; i++) {
        var isGhost = estOrder[i].indexOf("gh") > -1;
        tl.fromTo(estOrder[i],
          { opacity: 0, y: 20 },
          { opacity: isGhost ? 0.62 : 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.7 + i * 0.075);
      }

      tl.fromTo(["#c5-track", "#c5-thumb"],
        { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.15);
      tl.fromTo("#c5-status",
        { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.2);

      // el cursor entra desde fuera de la superficie
      tl.fromTo(cursor,
        { x: 1720, y: 880, opacity: 0 },
        { x: 1720, y: 880, opacity: 1, duration: 0.32, ease: "power2.out" }, 0.85);

      /* =========================================================
         BEAT 1 (2.0–6.3) — «Cada fila es un estudio, con sus
         ciento ochenta y nueve campos.» El cursor RECORRE la fila
         y cada columna se enciende a su paso.
         ========================================================= */
      moveTo(300, 441, 1.45, 1.15);

      // la fila se pinta como unidad, siguiendo al cursor
      tl.fromTo("#c5-sw-0",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 1.6, ease: "power1.inOut" }, 2.95);
      moveTo(1400, 441, 2.95, 1.6);

      // cada cabecera se oscurece cuando el cursor cruza su columna
      for (var h = 0; h < 6; h++) {
        tl.to("#c5-eh-" + h, { color: '#22304a', duration: 0.24, ease: "power2.out" }, 3.0 + h * 0.28);
        tl.to("#c5-eh-" + h, { color: "rgba(34,48,74,0.72)", duration: 0.5, ease: "power2.inOut" }, 3.62 + h * 0.28);
      }
      tl.to("#c5-sw-0", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.9);

      // las cifras verificadas entran a la derecha
      tl.fromTo("#c5-stat-0", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.66, ease: "power3.out" }, 2.3);
      tl.fromTo("#c5-stat-1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.66, ease: "power3.out" }, 3.3);
      tl.fromTo("#c5-stat-2", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.66, ease: "power3.out" }, 4.45);

      /* =========================================================
         BEAT 2 (6.3–10.6) — «Se busca, se ordena y se filtra.»
         El cursor sube al buscador, hace clic (EL ambar), teclea, y
         la tabla FILTRA de verdad: caen las filas que no casan y
         las que quedan cierran el hueco.
         ========================================================= */
      moveTo(860, 372, 5.25, 0.95);
      moveTo(420, 337, 6.3, 0.62);
      click(FOCUS_AT, "#c5-ring-a1", "#c5-ring-a2");

      // el campo toma el foco: unico ambar de la escena
      tl.fromTo("#c5-fbord", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, FOCUS_AT + 0.04);
      tl.to("#c5-search", { borderColor: "rgba(45,62,94,0.10)", duration: 0.3, ease: "power2.out" }, FOCUS_AT + 0.04);
      tl.to("#c5-ph", { opacity: 0, duration: 0.2, ease: "power2.out" }, FOCUS_AT + 0.06);

      // --- caida de las filas que no casan + recolocacion de las que quedan ---
      var DROPS = [
        { row: "#c5-gh-0", at: 7.95, below: ["#c5-r-1", "#c5-gh-1", "#c5-r-2", "#c5-r-3", "#c5-gh-2", "#c5-r-4"], to: -46 },
        { row: "#c5-gh-1", at: 8.50, below: ["#c5-r-2", "#c5-r-3", "#c5-gh-2", "#c5-r-4"], to: -92 },
        { row: "#c5-gh-2", at: 9.05, below: ["#c5-r-4"], to: -138 }
      ];
      for (var d = 0; d < DROPS.length; d++) {
        // la fila que no casa se va de lado y se apaga ANTES de que las de
        // abajo pasen por su sitio: nunca se solapan dos filas legibles
        tl.to(DROPS[d].row, { x: -120, opacity: 0, duration: 0.32, ease: "power2.in" }, DROPS[d].at);
        tl.to(DROPS[d].below,
          { y: DROPS[d].to, duration: 0.46, ease: "power2.out", stagger: 0.04 },
          DROPS[d].at + 0.26);
        // el conteo late en cada baja
      }

      // el pulgar de la barra crece: ya cabe todo el resultado
      tl.to("#c5-thumb", { height: 398, duration: 1.15, ease: "power2.inOut" }, 8.1);

      // el termino buscado queda marcado en las filas que sobreviven
      for (var m = 0; m < 5; m++) {
        tl.fromTo("#c5-mk-" + m,
          { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power2.out" },
          9.55 + m * 0.085);
      }

      /* =========================================================
         BEAT 3 (10.6–14.5) — «…la vista Por Paciente los agrupa por
         cédula.» El subrayado SE DESLIZA y entran las seis columnas
         reales, una tras otra.
         ========================================================= */
      moveTo(777, 262, 10.75, 0.72);
      click(11.62, "#c5-ring-b1", "#c5-ring-b2");
      tl.to("#c5-tab-2", { scale: 0.95, duration: 0.09, ease: "power2.in" }, 11.62);
      tl.to("#c5-tab-2", { scale: 1, duration: 0.16, ease: "power2.out" }, 11.71);

      // el subrayado viaja de «Visualizador de Datos» a «Por Paciente»
      tl.to("#c5-tabbar", { x: 274, scaleX: 0.5897, duration: 0.62, ease: "power3.inOut" }, 11.66);
      tl.to("#c5-tab-1", { color: "rgba(34,48,74,0.72)", duration: 0.4, ease: "power2.inOut" }, 11.68);
      tl.to("#c5-tab-2", { color: '#22304a', duration: 0.4, ease: "power2.inOut" }, 11.68);

      // el filtro sigue puesto: el ambar baja de tono pero no se apaga
      tl.to("#c5-fbord", { opacity: 0.6, duration: 0.5, ease: "power2.inOut" }, 11.7);

      // la vista anterior se retira y la nueva se construye por columnas
      tl.to("#c5-eview", { opacity: 0, y: -14, duration: 0.4, ease: "power2.in" }, 11.7);
      tl.fromTo("#c5-pview", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 12.0);
      tl.fromTo("#c5-phead", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 12.02);
      for (var c = 0; c < 6; c++) {
        tl.fromTo(".c5-pc-" + c,
          { opacity: 0, x: 30 },
          { opacity: 1, x: 0, duration: 0.56, ease: "power3.out" },
          12.05 + c * 0.15);
      }
      tl.to("#c5-status", { opacity: 0.4, duration: 0.18, ease: "power2.in" }, 11.86);
      tl.to("#c5-status", { opacity: 1, duration: 0.34, ease: "power2.out" }, 12.06);

      /* =========================================================
         BEAT 4 (14.5–19.5) — «dieciocho mil doscientos setenta y un
         pacientes, con toda su historia en una sola línea.»
         ========================================================= */
      moveTo(900, 533, 13.15, 1.0);                       // el cursor baja a la lista
      tl.to("#c5-pw-2", { opacity: 1, duration: 0.3, ease: "power2.out" }, 14.2);

      tl.to(["#c5-stat-0", "#c5-stat-2"], { opacity: 0.5, duration: 0.6, ease: "power2.inOut" }, 14.55);
      tl.fromTo("#c5-u-1", { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.72, ease: "power3.out" }, 14.6);
      tl.to("#c5-stat-1", { scale: 1.05, duration: 0.9, ease: "power3.out" }, 14.6);

      tl.to("#c5-pw-2", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 15.55);
      moveTo(900, 441, 15.6, 0.85);                       // sube a la primera cédula
      tl.to("#c5-pw-0", { opacity: 0.7, duration: 0.3, ease: "power2.out" }, 16.45);

      // «en una sola línea»: la fila se subraya de lado a lado
      tl.fromTo("#c5-pline", { scaleX: 0 },
        { scaleX: 1, duration: 0.95, ease: "power2.inOut" }, 16.8);

      tl.to(["#c5-stat-0", "#c5-stat-2"], { opacity: 1, duration: 0.7, ease: "power2.inOut" }, 17.6);

      // el numero de estudios de esa cédula se subraya: es lo que va a abrirse
      tl.fromTo("#c5-tick3", { scaleX: 0 },
        { scaleX: 1, duration: 0.62, ease: "power2.out" }, 18.25);

      /* =========================================================
         BEAT 5 (19.5–29.0) — «Al abrir uno se ve su ficha completa:
         los datos del informe, el diagnóstico y los biomarcadores de
         cada estudio.» La fila se ABRE hacia abajo.
         ========================================================= */
      moveTo(430, 441, 19.45, 0.72);
      click(20.45, "#c5-ring-c1", "#c5-ring-c2");
      tl.to("#c5-pw-0", { opacity: 1, duration: 0.28, ease: "power2.out" }, 20.5);

      // la ficha crece y las filas de abajo le hacen sitio, al unisono
      tl.to("#c5-ficha", { height: 184, duration: 0.72, ease: "power3.out" }, 20.55);
      tl.to(["#c5-p-1", "#c5-p-2", "#c5-p-3", "#c5-p-4"],
        { y: 184, duration: 0.72, ease: "power3.out" }, 20.55);
      tl.to("#c5-thumb", { height: 330, duration: 0.7, ease: "power2.inOut" }, 20.6);

      // los tres estudios del mismo paciente
      for (var s = 0; s < 3; s++) {
        tl.fromTo("#c5-s-" + s,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          20.95 + s * 0.52);
      }

      // ...y el biomarcador de cada uno
      for (var b2 = 0; b2 < 3; b2++) {
        tl.fromTo("#c5-chip-" + b2,
          { opacity: 0, scale: 0.86 },
          { opacity: 1, scale: 1, duration: 0.52, ease: "power3.out" },
          23.4 + b2 * 0.68);
      }

      moveTo(600, 530, 22.9, 1.05);
      moveTo(770, 608, 25.7, 1.15);

      // el cursor se posa sobre el último biomarcador
      tl.to("#c5-chip-2", { scale: 1.035, duration: 0.5, ease: "power2.out" }, 27.0);
      tl.to("#c5-chip-2", { scale: 1, duration: 0.7, ease: "sine.inOut" }, 27.7);

      // hilo que ata los tres biomarcadores a la misma cédula
      tl.fromTo("#c5-crail", { scaleY: 0 },
        { scaleY: 1, duration: 1.45, ease: "power2.inOut" }, 27.35);

      window.__timelines = window.__timelines || {};
      // marcador-fuera: el numero de seccion cambia entre escenas, asi que
      // si sigue encendido durante el encadenado se ve doble y desplazado.
      // Se apaga justo antes de la costura; la marca de arriba NO se toca,
      // porque es identica en todas y superpuesta no se nota.
      tl.to("#c5-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 26.09);

      // suelta-contenido: al empezar el encadenado la escena deja ir su

      // CONTENIDO y se queda solo con el fondo. Asi en la costura no hay

      // dos textos superpuestos —que se veia como fantasma— y, como el

      // fondo de las dos escenas es el mismo navy, el fondo NO cambia:

      // la imagen sigue, solo se releva lo que hay encima.

      


      // marca-fuera: la marca de esquina vive fuera de los clips que se


      // sueltan, asi que hay que apagarla aparte o se queda encima de lo


      // que trae la escena siguiente.


      



      // reescalado-a-la-voz: la coreografia se escribio contra una voz que



      // duraba 27.84s; la nueva dura 30.18s. tl.duration() reescala TODA la



      // linea de tiempo de golpe —incluidos los tiempos que salen de



      // constantes como ETAPA_IN, que un buscar-y-reemplazar no ve— y deja



      // la coreografia pegada a la narracion sin tocar un solo numero.



      // suelta-contenido, anclada al reloj FINAL. Esta linea de tiempo se
      // reescala abajo con tl.duration(), asi que un instante escrito a
      // pelo NO cae donde parece: hay que dividir por el factor. Se toma
      // AQUI, antes de añadir nada, porque tl.duration() sin argumento
      // devuelve la duracion autorizada.
      // Arranca a la vez que la escena siguiente y dura 0,72 s: la
      // saliente se va MIENTRAS la entrante llega, para que no quede ni
      // un fotograma con el cuadro vacio.
      tl.duration(30.18);




      window.__timelines["05-datos"] = tl;
    })();
  </script>
</template>

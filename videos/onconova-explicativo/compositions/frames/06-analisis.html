      var h2 = q("#s6-h2"), w1 = q("#s6-w1"), w2 = q("#s6-w2");
      var k1 = q("#s6-k1"), k2 = q("#s6-k2"), k3 = q("#s6-k3"), k4 = q("#s6-k4");
      var n1 = q("#s6-n1"), n2 = q("#s6-n2"), n3 = q("#s6-n3"), n4 = q("#s6-n4");
      var l1 = q("#s6-l1"), l2 = q("#s6-l2"), l3 = q("#s6-l3"), l4 = q("#s6-l4");
      var r1 = q("#s6-r1"), r3 = q("#s6-r3"), r4 = q("#s6-r4");
      var arc = q("#s6-arc"), halo = q("#s6-halo");
      var glow = q("#s6-glow");
      var table = q("#s6-table"), tchrome = q("#s6-tchrome");
      var thead = q("#s6-thead"), hitems = qa(".s6-hitem"), axis = q("#s6-axis");
      var sidesM = qa(".s6-row .s6-side-m");
      var sidesB = qa(".s6-row .s6-side-b");
      var brand = q("#s6-brand"), mark = q("#s6-mark"), cap = q("#s6-cap");

      /* ---------------------------------------------------------------- */
      /* respiracion unica compartida por los 3 decorativos + deriva       */
      /* (multi-phase-camera: canal de deriva, un solo escritor por nodo)  */
      /* Cubre los 29 s enteros: nunca hay una ventana sin tween.          */
      /* ---------------------------------------------------------------- */
      var amb = { p: 0 };
      tl.to(
        amb,
        {
          p: Math.PI * 2 * 1.4,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(amb.p);
            var c = Math.sin(amb.p * 1.3);
            drift.style.transform =
              "translate(" + (s * 5).toFixed(3) + "px," + (c * 3).toFixed(3) + "px)";
            radial.style.opacity = (0.62 + 0.22 * s).toFixed(4);
            radial.style.transform = "scale(" + (1 + 0.045 * s).toFixed(4) + ")";
            grid.style.opacity = (0.9 + 0.1 * c).toFixed(4);
            hair.style.opacity = (0.65 + 0.25 * s).toFixed(4);
          }
        },
        0
      );
      /* velo de aliento: 5,8 s x 5 pasadas = 29,0 s exactos, repeat finito */
      tl.fromTo(
        aliento,
        { opacity: 0.52 },
        { opacity: 0.88, duration: 5.8, repeat: 4, yoyo: true, ease: "sine.inOut" },
        0
      );

      /* ---------------------------------------------------------------- */
      /* ESCENA 1 (0.0-5.0) — titular enmascarado + hairline + primer KPI  */
      /* waterfall-entry: cada palabra sube desde su propia mascara        */
      /* ---------------------------------------------------------------- */
      tl.fromTo(w1, { yPercent: 100 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(w2, { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 0.28);

      tl.fromTo(hair, { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 0.9);
      tl.fromTo(brand, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.3);
      tl.fromTo(mark, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.55);

      /* ---------------------------------------------------------------- */
      /* counting-dynamic-scale — el numero crece por transform, no por    */
      /* font-size; el grafico pareado comparte inicio, duracion y ease.   */
      /* La cifra materializa EN el instante 'at': ni cero de relleno      */
      /* visible ni pinchazo de escala antes del conteo.                   */
      /* ---------------------------------------------------------------- */
      function miles(v) {
        var s = String(Math.round(v)), out = "", c = 0;
        for (var i = s.length - 1; i >= 0; i--) {
          out = s.charAt(i) + out;
          c++;
          if (c % 3 === 0 && i > 0) out = "." + out;
        }
        return out;
      }
      function pct(v) {
        return (Math.round(v * 10) / 10).toFixed(1).replace(".", ",") + " %";
      }
      function countUp(el, target, at, dur, render) {
        var st = { v: 0 };
        tl.to(
          st,
          {
            v: target,
            duration: dur,
            ease: "power3.out",
            onUpdate: function () { el.textContent = render(st.v); }
          },
          at
        );
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, at);
        tl.fromTo(el, { scale: 0.55 }, { scale: 1, duration: dur, ease: "power3.out" }, at);
      }
      function shell(card, label, at) {
        tl.fromTo(card, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
        tl.fromTo(label, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, at + 0.5);
      }

      /* KPI 1 — 2.076 casos IHQ */
      shell(k1, l1, 1.5);
      countUp(n1, 2076, 2.3, 2.2, miles);
      tl.fromTo(r1, { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power3.out" }, 2.3);

      /* ---------------------------------------------------------------- */
      /* ESCENA 2 (5.0-16.5) — KPI focal: la cifra cuenta Y el arco dibuja */
      /* stat-bars-and-fills (forma anillo): 0,671 de la circunferencia,   */
      /* mismo inicio, misma duracion y mismo ease que el conteo, para que */
      /* numero y proporcion aterricen como un solo golpe.                 */
      /* C = 2*pi*59 = 370,71 ; offset final = 370,71 * (1 - 0,671)        */
      /* ---------------------------------------------------------------- */
      shell(k2, l2, 5.3);
      countUp(n2, 67.1, 6.1, 2.3, pct);
      tl.fromTo(arc, { strokeDashoffset: 370.71 }, { strokeDashoffset: 121.96, duration: 2.3, ease: "power3.out" }, 6.1);
      tl.fromTo(k2, { borderColor: "rgba(233,238,247,0.14)" }, { borderColor: "#e9a33c", duration: 1.4, ease: "power2.out" }, 6.1);
      /* ambient-glow-bloom detras del focal */
      tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 2.2, ease: "power1.inOut" }, 7.3);
      /* el anillo exterior cierra el gesto una vez el arco ha aterrizado */
      tl.fromTo(halo, { opacity: 0 }, { opacity: 0.55, duration: 0.9, ease: "power1.inOut" }, 8.4);

      /* coordinate-target-zoom (envoltorios anidados: fuera escala, dentro
         traslada). Centro medido de la tarjeta focal en la reticula
         1fr 1,45fr 1fr 1fr con hueco 26 sobre 1760 de ancho:
         1fr = 378,0 ; focal = 548,1.
         x = 80 + 378 + 26 + 274,05 = 758,05 ; y = 252 + 95 = 347.
         Se recorre solo el 58 % del desplazamiento: inclinacion sobria,
         sin sacar la cuarta tarjeta del cuadro. */
      /* immediateRender:false en toda fase encadenada: si no, el estado
         inicial de la ULTIMA fromTo se pinta en t=0 y el plano arranca
         desplazado. */
      var LEAN = 0.58;
      var FOC_X = (960 - 758.05) * LEAN;
      var FOC_Y = (540 - 347) * LEAN;
      tl.fromTo(zo, { scale: 1 }, { scale: 1.07, duration: 2.8, ease: "power2.out" }, 6.3);
      tl.fromTo(zi, { x: 0, y: 0 }, { x: FOC_X, y: FOC_Y, duration: 2.8, ease: "power2.out" }, 6.3);
      tl.fromTo(zo, { scale: 1.07 }, { scale: 1, duration: 3.0, ease: "power2.inOut", immediateRender: false }, 10.4);
      tl.fromTo(zi, { x: FOC_X, y: FOC_Y }, { x: 0, y: 0, duration: 3.0, ease: "power2.inOut", immediateRender: false }, 10.4);

      /* KPI 3 — 195 categorias anatomicas */
      shell(k3, l3, 9.6);
      countUp(n3, 195, 10.3, 2.1, miles);
      tl.fromTo(r3, { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power3.out" }, 10.3);

      /* KPI 4 — 122 biomarcadores distintos */
      shell(k4, l4, 13.4);
      countUp(n4, 122, 14.0, 2.1, miles);
      tl.fromTo(r4, { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power3.out" }, 14.0);

      /* respiracion de camara entre el regreso y el empuje final: el plano
         nunca queda quieto en la ventana 13,4-19,4. Cierra acelerando para
         enlazar sin costura con el empuje lineal que viene detras. */
      tl.fromTo(zo, { scale: 1 }, { scale: 1.012, duration: 6.0, ease: "sine.in", immediateRender: false }, 13.4);

      /* ---------------------------------------------------------------- */
      /* ESCENA 3 (16.5-29.0) — se levanta el eje y crecen las barras      */
      /* ---------------------------------------------------------------- */
      tl.fromTo(table, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 16.5);
      tl.fromTo(tchrome, { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 16.5);
      /* el eje se traza ANTES que los datos: es la linea desde la que las
         barras divergen, malignos a un lado y benignos al otro */
      tl.fromTo(axis, { scaleY: 0 }, { scaleY: 1, duration: 1.5, ease: "power2.inOut" }, 17.2);

      tl.fromTo(thead, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 18.2);
      tl.fromTo(hitems, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.09, ease: "power2.out" }, 18.35);

      /* el bloom cede: la atencion pasa del KPI a la tabla, pero el foco
         ambar sigue marcado por la cifra, el arco y el borde de la tarjeta */
      tl.fromTo(glow, { opacity: 1 }, { opacity: 0.24, duration: 1.6, ease: "power1.inOut", immediateRender: false }, 18.8);
      /* s6-h2 se apaga al abrirse la tabla: si no, el empuje de camara lo
         lleva sobre el rotulo de esquina al final de la escena. */
      tl.fromTo(h2, { opacity: 1 }, { opacity: 0, duration: 0.9, ease: "power2.inOut" }, 19.2);

      /* waterfall-entry en cascada + stat-bars-and-fills: cada fila entra y
         sus cuatro barras crecen desde el eje; la cifra exacta aterriza en
         la punta de su barra. Escala comun 259 = 606 px para todas. */
      var rowAt = [19.5, 20.5, 21.45, 22.35, 23.2];
      for (var i = 0; i < rowAt.length; i++) {
        var n = i + 1;
        var row = q("#s6-row" + n);
        var bars = qa("#s6-row" + n + " .s6-bar");
        var valsM = qa("#s6-row" + n + " .s6-side-m .s6-v");
        var valsB = qa("#s6-row" + n + " .s6-side-b .s6-v");
        var t = rowAt[i];
        tl.fromTo(row, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        tl.fromTo(bars, { scaleX: 0 }, { scaleX: 1, duration: 0.85, stagger: 0.07, ease: "power3.out" }, t + 0.22);
        tl.fromTo(valsM, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.08, ease: "power2.out" }, t + 0.62);
        tl.fromTo(valsB, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.08, ease: "power2.out" }, t + 0.62);
      }

      tl.fromTo(cap, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 24.2);

      /* la voz nombra primero los malignos y despues los benignos: cada
         mitad del eje toma el turno y luego se devuelve la lectura entera */
      tl.fromTo(sidesB, { opacity: 1 }, { opacity: 0.32, duration: 1.0, ease: "power1.inOut" }, 24.8);
      tl.fromTo(sidesB, { opacity: 0.32 }, { opacity: 1, duration: 1.0, ease: "power1.inOut", immediateRender: false }, 26.5);
      tl.fromTo(sidesM, { opacity: 1 }, { opacity: 0.4, duration: 1.0, ease: "power1.inOut" }, 26.5);
      tl.fromTo(sidesM, { opacity: 0.4 }, { opacity: 1, duration: 0.9, ease: "power1.inOut", immediateRender: false }, 27.9);

      /* multi-phase-camera, fase final: empuje lento, constante y sin resolver
         sobre la tabla. Termina EXACTAMENTE en 29,0 s y con ease lineal, asi
         que el plano sigue moviendose en el ultimo fotograma sin que ningun
         tween sobrepase la marca (nunca es una salida). */
      tl.fromTo(zo, { scale: 1.012 }, { scale: 1.058, duration: 9.6, ease: "none", immediateRender: false }, 19.4);
      tl.fromTo(zi, { y: 0 }, { y: -32, duration: 9.6, ease: "none", immediateRender: false }, 19.4);

      window.__timelines = window.__timelines || {};
      // marcador-fuera: el numero de seccion cambia entre escenas, asi que
      // si sigue encendido durante el encadenado se ve doble y desplazado.
      // Se apaga justo antes de la costura; la marca de arriba NO se toca,
      // porque es identica en todas y superpuesta no se nota.
      tl.to("#s6-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 26.41);

      // suelta-contenido: al empezar el encadenado la escena deja ir su

      // CONTENIDO y se queda solo con el fondo. Asi en la costura no hay

      // dos textos superpuestos —que se veia como fantasma— y, como el

      // fondo de las dos escenas es el mismo navy, el fondo NO cambia:

      // la imagen sigue, solo se releva lo que hay encima.

      tl.to(["#s6-clip-mundo", "#s6-clip-cromo"], { opacity: 0, duration: 0.55, ease: "power2.in" }, 26.46);


      // marca-fuera: la marca de esquina vive fuera de los clips que se


      // sueltan, asi que hay que apagarla aparte o se queda encima de lo


      // que trae la escena siguiente.


      tl.to("#s6-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 26.46);



      // reescalado-a-la-voz: la coreografia se escribio contra una voz que



      // duraba 28.16s; la nueva dura 30.63s. tl.duration() reescala TODA la



      // linea de tiempo de golpe —incluidos los tiempos que salen de



      // constantes como ETAPA_IN, que un buscar-y-reemplazar no ve— y deja



      // la coreografia pegada a la narracion sin tocar un solo numero.



      tl.duration(30.63);




      window.__timelines[ID] = tl;
    })();
  </script>
</template>

    (function () {
      var ID = "09-cierre";

      // ambient-glow-bloom (forma A): radial navy tenue centrado sobre el foco

        { opacity: 0, scale: 0.88 },
        { opacity: 0.32, scale: 1, duration: 1.6, ease: "power2.out" }, 0);
      tl.fromTo(".c9-grid",
        { opacity: 0 }, { opacity: 1, duration: 1.9, ease: "power1.out" }, 0.1);

      // el único movimiento: la marca se posa (scale-swap-transition, registro contenido)
      tl.fromTo(".c9-h1",
        { opacity: 0, scale: 0.968, y: 16 },
        { opacity: 1, scale: 1, y: 0, duration: 1.35, ease: "power3.out" }, 0.15);

      /* ── Escena 2 (1.75–3.25s) — la hairline institucional se extiende ─── */

      tl.fromTo(".c9-hair",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 0.9, duration: 1.5, ease: "power2.inOut" }, 1.75);

      // respiración lenta ÚNICA y compartida de los TRES decorativos
      // (radial + retícula + hairline) — sine-wave-loop, registro bajo
      var BREATH_START = 2.2, BREATH_DUR = 13.2, BREATH_CYCLES = 1.47;
      var HAIR_IN = 1.05;   // la hairline entra al bucle justo cuando termina su trazo (t=3.25s)
      var breath = { p: 0 };
      tl.to(breath, {
        p: Math.PI * 2 * BREATH_CYCLES,
        duration: BREATH_DUR,
        ease: "none",
        onUpdate: function () {
          var t = breath.p / (Math.PI * 2 * BREATH_CYCLES);
          var el = t * BREATH_DUR;                       // segundos desde BREATH_START
          var env = t < 0.8 ? 1 : (1 - t) / 0.2;         // settle-and-fade
          var s = Math.sin(breath.p);
          if (amb) gsap.set(amb, { opacity: 0.96 + s * 0.04 * env });
          if (radialWrap) gsap.set(radialWrap, { scale: 1 + s * 0.014 * env });
          if (hair && el >= HAIR_IN) {
            // rampa desde 0 para engancharse al seno sin salto al terminar el trazo
            var ramp = Math.min(1, (el - HAIR_IN) / 1.4);
            gsap.set(hair, { opacity: 0.9 + s * 0.1 * ramp * env });
          }
        }
      }, BREATH_START);

      /* ── Escena 3 (2.8–9.0s) — la línea de cierre, palabra a palabra ───── */

      tl.fromTo(".c9-seg-a",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 2.8);

      // "consultable, analizable y verificable." — cada una llega con su palabra

        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.8, stagger: 1.15, ease: "power2.out" }, 5.15);

      // micro-deriva bajo la retención (registro micro-drift, apenas perceptible)

        { scale: 1.01, duration: 7.0, ease: "power1.inOut" }, 8.0);

      /* ── Escena 4 (9.4–15.3s) — la nota de confidencialidad. Quietud. ──── */

      tl.fromTo(".c9-sub",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 1.1, ease: "power2.out" }, 9.6);

      tl.fromTo(".c9-seal",
        { opacity: 0, y: 10 },
        { opacity: 0.72, y: 0, duration: 1.2, ease: "power2.out" }, 12.6);

      /* ── Escena 5 (15.3–17s) — fundido a navy (fotograma final) ────────── */

      tl.fromTo(".c9-veil",
        { opacity: 0 },
        { opacity: 1, duration: 1.9, ease: "power2.inOut" }, 18.1);
      // ^ el fundido se movió de 15,3s a 18,1s al alargar la escena a 20s:
      //   con el calendario viejo la imagen quedaba en navy plano casi tres
      //   segundos y la firma del hospital no llegaba a leerse.

      window.__timelines = window.__timelines || {};
      tl.to("#c9-aliento", { opacity: 0.88, duration: 5.0,
        repeat: 3, yoyo: true, ease: "sine.inOut" }, 0);

      // La firma de la casa cierra el vídeo, entrando cuando la voz la nombra.
      tl.fromTo("#c9-huv", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 1.3, ease: "power2.out" }, 14.0);
      // ^ respiración de fondo: cubre los 17s completos, sin zonas muertas
      tl.fromTo("#c9-iso", { opacity: 0, y: 18, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "power3.out" }, 0.15);

      // reescalado-a-la-voz: la coreografia se escribio contra una voz que

      // duraba 20.00s; la nueva dura 21.94s. tl.duration() reescala TODA la

      // linea de tiempo de golpe —incluidos los tiempos que salen de

      // constantes como ETAPA_IN, que un buscar-y-reemplazar no ve— y deja

      // la coreografia pegada a la narracion sin tocar un solo numero.

      tl.duration(21.94);


      window.__timelines[ID] = tl;
    })();
  </script>

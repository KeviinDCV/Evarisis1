  <script>
    (function () {
      var ID = "06-cargar";
      var D = 33.42;
      var tl = gsap.timeline({ paused: true });

      var world = document.getElementById("f6-world");
      var radial = document.getElementById("f6-radial");
      var grid = document.getElementById("f6-grid");
      var hair = document.getElementById("f6-hair");
      var veil = document.getElementById("f6-veil");

      var expTitle = document.getElementById("f6-exp-title");
      var footTx = document.getElementById("f6-foottx");
      var mstat = document.getElementById("f6-mstat");
      var fill = document.getElementById("f6-fill");
      var val = [
        document.getElementById("f6-v-0"),
        document.getElementById("f6-v-1"),
        document.getElementById("f6-v-2"),
        document.getElementById("f6-v-3")
      ];

      /* --------- marcas de tiempo compartidas con la narracion --------- */
      var OPEN_AT = 3.05;        // se abre la carpeta 2026
      var PROC_A = 18.85;        // arranca la barra de progreso
      var PROC_B = 26.15;        // la barra llega al final
      var PUSH_AT = 30.2;        // acercamiento final, muy leve

      // los cuatro nombres reales del lote; el resto del lote son filas sin
      // nombre en el arbol (no se inventa ningun nombre de archivo)
      // el lote son las DOS pendientes que el boton acaba de marcar, en su
      // orden. Ni una fila ✓: esas ya estaban.
      var LOTE = [
        "IHQ260101 al IHQ260150.pdf",
        "IHQ260151 al IHQ260200.pdf"
      ];

      function sstep(t, a, b) {
        var p = (t - a) / (b - a);
        if (p <= 0) return 0;
        if (p >= 1) return 1;
        return p * p * (3 - 2 * p);
      }

      /* ---------------------------------------------------------
         ESCENARIO FIJO: un unico reloj lineal escribe la respiracion
         del fondo, el rotulo del explorador, el contador del lote, el
         ancho y las rayas de la barra y las cuatro cifras del resumen
         — todo deterministico, sin callbacks, seguro ante cualquier
         salto de fotograma.
         --------------------------------------------------------- */
      var clock = { t: 0 };
      var lastTitle = null, lastFoot = null, lastStat = null, lastVal = [null, null, null, null];

      function writeFrame() {
        var t = clock.t;
        var b = Math.sin(t * 0.3);

        // acercamiento final: la rampa termina DESPUES del corte (34,6 s), asi
        // que en el ultimo fotograma sigue subiendo y el montaje hereda la
        // escena en movimiento. Nunca invade la franja de los rotulos de
        // esquina (viven fuera del mundo que escala).
        var push = 0.018 * sstep(t, PUSH_AT, 34.6);

        world.style.transform =
          "translate(" +
          (Math.sin(t * 0.19) * 3).toFixed(2) + "px," +
          (Math.sin(t * 0.263) * 1.6).toFixed(2) + "px) scale(" +
          (1 + 0.0035 * b + push).toFixed(4) + ")";

        radial.style.transform = "scale(" + (1 + 0.05 * b).toFixed(4) + ")";
        radial.style.opacity = (0.55 + 0.18 * b).toFixed(4);
        grid.style.opacity = (0.04 + 0.012 * b).toFixed(4);
        hair.style.opacity = (0.55 + 0.22 * b).toFixed(4);
        veil.style.opacity = (0.46 + 0.16 * Math.sin(t * 0.42 + 1.1)).toFixed(4);

        // el titulo del explorador sigue a la carpeta abierta
        var ttl = t < OPEN_AT ? "pdfs_patologia" : "2026";
        if (ttl !== lastTitle) { expTitle.textContent = ttl; lastTitle = ttl; }

        // el pie cuenta lo que el cursor va eligiendo. 404 = los elementos
        // reales de pdfs_patologia/2026 (medidos en disco); la lista solo
        // enseña los primeros, por eso el total no puede ser 5.
        var ft = "404 elementos";
        if (t >= 8.66) ft = "404 elementos  |  carpeta 2026 seleccionada";
        else if (t >= 7.80) ft = "404 elementos  |  3 seleccionados";
        else if (t >= 7.10) ft = "404 elementos  |  2 seleccionados";
        else if (t >= 6.36) ft = "404 elementos  |  1 seleccionado";
        if (ft !== lastFoot) { footTx.textContent = ft; lastFoot = ft; }

        // la barra de progreso: ancho real, rayas en marcha y contador
        var pp = (t - PROC_A) / (PROC_B - PROC_A);
        if (pp < 0) pp = 0;
        if (pp > 1) pp = 1;
        fill.style.width = (pp * 720).toFixed(1) + "px";
        fill.style.backgroundPosition = (-((t * 62) % 25.46)).toFixed(2) + "px 0px";

        // ui.py:11144 -> f"Procesando ({idx + 1}/{total}): {filename}", y ese
        // total es total_files: el lote son CUATRO archivos, no doce.
        var idx = Math.floor(pp * LOTE.length) + 1;
        if (idx > LOTE.length) idx = LOTE.length;
        var st = "Procesando (" + idx + "/" + LOTE.length + "): " + LOTE[idx - 1];
        if (st !== lastStat) { mstat.textContent = st; lastStat = st; }

        // el resumen: cada cifra sube a su sitio, una despues de otra.
        // Las cuatro son REALES, medidas sobre estos mismos cuatro PDF con la
        // funcion que llama la aplicacion (core.validation_checker.
        // analizar_batch_registros): 347 casos unicos -> 327 completos, 20
        // incompletos, 94,2% de exito. El total NO es 351 (82+92+93+84) porque
        // cuatro casos aparecen en dos PDF: son los arrastrados.
        var v0 = String(Math.round(98 * sstep(t, 26.95, 27.85)));
        var v1 = String(Math.round(96 * sstep(t, 27.55, 28.45)));
        var v2 = String(Math.round(2 * sstep(t, 28.15, 28.95)));
        // el badge de la aplicacion imprime f"{porcentaje_exito:.1f}%"
        var v3 = (98.0 * sstep(t, 28.75, 29.95)).toFixed(1) + "%";
        var vs = [v0, v1, v2, v3];
        for (var k = 0; k < 4; k++) {
          if (vs[k] !== lastVal[k]) { val[k].textContent = vs[k]; lastVal[k] = vs[k]; }
        }
      }

      // el reloj recorre exactamente la duracion declarada del root:
      // el fondo respira los 33,42 s sin una sola ventana congelada
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: writeFrame }, 0);
      writeFrame(); // semilla del fotograma 0

      /* ---------------------------------------------------------
         helpers de cursor (cursor-click-ripple, sin repeticion infinita)
         --------------------------------------------------------- */
      var cursor = "#f6-cursor";

      function moveTo(x, y, at, dur) {
        tl.to(cursor, { x: x, y: y, duration: dur, ease: "power2.inOut" }, at);
      }

      function click(at, rings) {
        // el cursor comprime mas que el receptor: el cursor es el actor
        tl.to(cursor, { scale: 0.84, duration: 0.09, ease: "power2.in" }, at);
        tl.to(cursor, { scale: 1, duration: 0.15, ease: "power2.out" }, at + 0.09);
        tl.fromTo(rings,
          { scale: 0, opacity: 0.55 },
          { scale: 2.6, opacity: 0, duration: 0.74, ease: "power2.out", stagger: 0.09, immediateRender: false },
          at + 0.03);
      }

      /* =========================================================
         BEAT 0 (0.0–3.0) — «El trabajo empieza en la carpeta donde
         el servicio deja los informes, ordenados por año.»
         ========================================================= */
      tl.fromTo("#f6-exp",
        { opacity: 0, y: 14, scale: 0.99 },
        { opacity: 1, y: 0, scale: 1, duration: 0.68, ease: "power3.out" }, 0);

      tl.fromTo(["#f6-sn-root", "#f6-sn-2025", "#f6-sn-2026"],
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power2.out", stagger: 0.09 }, 0.42);

      tl.fromTo("#f6-a-0",
        { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.66);
      tl.fromTo("#f6-a-1",
        { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.78);
      tl.fromTo("#f6-foottx",
        { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.05);

      // el cursor entra desde fuera de la superficie
      tl.fromTo(cursor,
        { x: 1420, y: 720, opacity: 0 },
        { x: 1420, y: 720, opacity: 1, duration: 0.34, ease: "power2.out" }, 0.9);

      // rotulos de esquina
      tl.fromTo("#f6-brand", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.fromTo("#f6-mark", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.72);

      /* =========================================================
         BEAT 1 (2.1–6.0) — se abre 2026 y aparecen los informes
         ========================================================= */
      moveTo(760, 456, 2.05, 1.05);
      click(2.86, ["#f6-rg-open-a"]);
      click(3.02, ["#f6-rg-open-b"]);

      // la vista de la raiz se retira y entra el contenido de 2026
      tl.to("#f6-gA", { opacity: 0, y: -16, duration: 0.34, ease: "power2.in" }, 3.06);

      var gbOrden = ["#f6-b-0", "#f6-b-1", "#f6-b-2", "#f6-b-3", "#f6-b-4"];
      for (var g = 0; g < gbOrden.length; g++) {
        tl.fromTo(gbOrden[g],
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
          3.28 + g * 0.24);
      }

      // la ruta baja un nivel y el arbol lateral se despliega
      tl.fromTo("#f6-bc-tail",
        { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 3.2);
      tl.fromTo("#f6-sn-col",
        { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 3.62);
      tl.to("#f6-sn-2026", { color: "rgb(34,48,74)", duration: 0.4, ease: "power2.out" }, 3.16);

      /* =========================================================
         BEAT 2 (6.0–9.4) — «Se eligen los archivos, o la carpeta
         entera.» Tres clics, y luego el nodo de la carpeta.
         ========================================================= */
      moveTo(720, 456, 6.00, 0.66);
      click(6.33, ["#f6-rg-s1"]);
      tl.fromTo("#f6-fw-1", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 6.36);

      moveTo(720, 532, 6.74, 0.46);
      click(7.07, ["#f6-rg-s2"]);
      tl.fromTo("#f6-fw-2", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 7.10);

      moveTo(720, 608, 7.44, 0.46);
      click(7.77, ["#f6-rg-s3"]);
      tl.fromTo("#f6-fw-3", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 7.80);

      // ...o la carpeta entera: el nodo 2026 se ilumina y caen las cinco filas
      moveTo(330, 372, 8.16, 0.52);
      click(8.63, ["#f6-rg-side"]);
      tl.fromTo("#f6-sw-2026", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 8.66);
      tl.to(["#f6-fw-0", "#f6-fw-1", "#f6-fw-2", "#f6-fw-3", "#f6-fw-4"],
        { opacity: 1, duration: 0.34, ease: "power2.out", stagger: 0.05 }, 8.68);

      /* =========================================================
         BEAT 3 (9.4–13.0) — la aplicacion, pestaña «Importar Datos».
         El explorador se va y la pantalla del producto ocupa su sitio.
         ========================================================= */
      moveTo(900, 520, 9.06, 0.72);

      tl.to("#f6-exp", { opacity: 0, scale: 1.045, duration: 0.42, ease: "power2.in" }, 9.16);
      tl.fromTo("#f6-app",
        { opacity: 0, scale: 0.958, y: 12 },
        { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "power3.out" }, 9.34);

      tl.fromTo(".f6-tab",
        { opacity: 0, y: 9 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.045 }, 9.58);
      tl.fromTo("#f6-tab-5",
        { scale: 0.94 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 9.92);

      tl.fromTo("#f6-h1",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 9.86);
      tl.fromTo("#f6-subt",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 10.06);

      tl.fromTo("#f6-btn-file",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.30);
      tl.fromTo("#f6-btn-dir",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.48);

      // el cursor pasa por los dos selectores: son los dos caminos de entrada
      moveTo(450, 526, 10.62, 0.62);
      tl.to("#f6-btn-file", { backgroundColor: "rgba(45,62,94,0.07)", duration: 0.26, ease: "power2.out" }, 11.06);
      tl.to("#f6-btn-file", { backgroundColor: "rgba(45,62,94,0)", duration: 0.34, ease: "power2.inOut" }, 11.52);
      moveTo(450, 602, 11.40, 0.5);
      tl.to("#f6-btn-dir", { backgroundColor: "rgba(45,62,94,0.07)", duration: 0.26, ease: "power2.out" }, 11.80);
      tl.to("#f6-btn-dir", { backgroundColor: "rgba(45,62,94,0)", duration: 0.34, ease: "power2.inOut" }, 12.30);

      tl.fromTo("#f6-rule",
        { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 10.72);
      tl.fromTo("#f6-btn-pend",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.90);
      tl.fromTo("#f6-btn-proc",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.10);

      // «El programa marca cuáles ya analizó...»: el arbol se puebla
      tl.fromTo("#f6-treelbl",
        { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 10.34);
      tl.fromTo("#f6-treebox",
        { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.58, ease: "power3.out" }, 10.46);

      // ninguna fila nace seleccionada: la barra de seleccion esta plegada
      for (var z = 0; z < 14; z++) {
        tl.set("#f6-tb-" + z, { scaleY: 0 }, 0);
      }

      for (var r = 0; r < 9; r++) {
        tl.fromTo("#f6-t-" + r,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          10.72 + r * 0.185);
      }
      tl.fromTo("#f6-tthumb",
        { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 12.10);
      tl.fromTo("#f6-legend",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 12.46);

      // el cursor acompaña al arbol mientras se puebla
      moveTo(1180, 430, 12.42, 0.62);

      /* =========================================================
         BEAT 4 (13.0–17.4) — «...y con un botón selecciona solo los
         pendientes.» Se marcan las filas ◐ y ●, y el arbol rueda
         para enseñar que hay mas debajo.
         ========================================================= */
      moveTo(450, 730, 13.14, 0.72);
      click(13.96, ["#f6-rg-pend-a", "#f6-rg-pend-b"]);
      tl.to("#f6-btn-pend", { y: 2, duration: 0.09, ease: "power2.in" }, 13.96);
      tl.to("#f6-btn-pend", { y: 0, duration: 0.18, ease: "power2.out" }, 14.05);
      tl.to("#f6-btn-pend", { backgroundColor: "rgba(45,62,94,0.10)", duration: 0.2, ease: "power2.out" }, 13.98);
      tl.to("#f6-btn-pend", { backgroundColor: "rgba(45,62,94,0)", duration: 0.5, ease: "power2.inOut" }, 14.42);

      // solo lo pendiente. Los UNICOS pendientes del arbol son las dos filas
      // con nombre: la ◐ (31/50) y la ● (0/48). Las demas ya estan analizadas,
      // asi que el boton marca dos y el lote procesa esas dos. Antes marcaba 12
      // y procesaba 4 —y ademas empezaba por una fila ✓—, o sea que la imagen
      // desmentia la frase de la voz cuatro segundos despues de decirla.
      for (var s = 2; s < 4; s++) {
        tl.fromTo("#f6-tw-" + s,
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power2.out" },
          14.12 + (s - 2) * 0.11);
        tl.fromTo("#f6-tb-" + s,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.34, ease: "power3.out" },
          14.16 + (s - 2) * 0.11);
      }

      // el arbol rueda: los pendientes no caben en la caja
      tl.fromTo("#f6-roll",
        { y: 0 }, { y: -92, duration: 1.15, ease: "power2.inOut" }, 15.70);
      tl.fromTo("#f6-tthumb",
        { y: 0 }, { y: 58, duration: 1.15, ease: "power2.inOut" }, 15.70);

      moveTo(1120, 560, 15.30, 0.85);

      /* =========================================================
         BEAT 5 (17.4–18.5) — «Se pulsa Procesar seleccionados.»
         EL AMBAR DE LA ESCENA: el foco cae sobre el boton verde.
         ========================================================= */
      moveTo(450, 815, 16.96, 0.62);
      click(17.62, ["#f6-rg-proc-a", "#f6-rg-proc-b"]);

      // el boton se hunde de verdad
      tl.to("#f6-btn-proc", { y: 3, duration: 0.10, ease: "power2.in" }, 17.62);
      tl.to("#f6-btn-proc", { y: 0, duration: 0.20, ease: "power2.out" }, 17.72);
      tl.to("#f6-btn-proc", { backgroundColor: "rgb(38,116,87)", duration: 0.12, ease: "power2.in" }, 17.62);
      tl.to("#f6-btn-proc", { backgroundColor: "rgb(47,143,107)", duration: 0.38, ease: "power2.out" }, 17.78);

      // el unico elemento ambar de la escena, sobre el foco. Entra grande y
      // se cierra sobre el boton, late una vez y se queda: el ojo no tiene
      // donde ir salvo aqui.
      tl.fromTo("#f6-amber",
        { opacity: 0, scale: 1.09 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 17.58);
      tl.to("#f6-amber", { scale: 1.035, duration: 0.16, ease: "power2.out" }, 18.02);
      tl.to("#f6-amber", { scale: 1, duration: 0.34, ease: "power2.inOut" }, 18.18);
      tl.to("#f6-amber", { opacity: 0.94, duration: 0.6, ease: "sine.inOut" }, 18.14);

      /* =========================================================
         BEAT 6 (18.5–26.4) — «A partir de ahí no hay que hacer nada
         más: lee cada informe, lo separa en casos y lo guarda.»
         ========================================================= */
      tl.fromTo("#f6-dim",
        { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, 18.20);
      // La opacidad y la escala van POR SEPARADO a proposito. Con una sola
      // tween de 0,5s la ventana pasaba medio segundo translucida y se leia el
      // arbol POR DEBAJO del dialogo: el mismo artefacto de «se ve lo de
      // detras» que ya nos toco corregir en la marca de esquina. Asi la
      // ventana es opaca en 0,16s y el muelle de la escala se conserva entero.
      tl.fromTo("#f6-modal",
        { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 18.34);
      tl.fromTo("#f6-modal",
        { scale: 0.94 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 18.34);

      moveTo(1520, 730, 18.60, 0.95);

      /* =========================================================
         BEAT 7 (26.4–31.9) — «Al terminar avisa de cuántos quedaron
         completos y cuántos incompletos.»
         ========================================================= */
      // el progreso se va del todo ANTES de que entre el resumen: dos ventanas
      // translucidas superpuestas eran un amasijo de texto sobre texto
      tl.to("#f6-modal", { opacity: 0, duration: 0.16, ease: "power2.in" }, 26.24);
      tl.to("#f6-modal", { scale: 0.972, duration: 0.34, ease: "power2.in" }, 26.24);
      tl.fromTo("#f6-res",
        { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 26.46);
      tl.fromTo("#f6-res",
        { scale: 0.952 }, { scale: 1, duration: 0.62, ease: "power3.out" }, 26.46);

      tl.fromTo("#f6-rtitle",
        { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" }, 26.60);
      tl.fromTo("#f6-rsub",
        { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 26.86);
      tl.fromTo("#f6-rrule-a",
        { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 26.94);

      for (var c = 0; c < 4; c++) {
        tl.fromTo("#f6-card-" + c,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          27.02 + c * 0.6);
      }

      moveTo(1560, 700, 27.30, 0.9);

      // el cierre del resumen: la regla inferior se dibuja despacio y la
      // cifra de exito se asienta — la escena sigue viva hasta el corte,
      // pero NO se despide: el relevo lo hace el montaje.
      tl.fromTo("#f6-rrule-b",
        { scaleX: 0 }, { scaleX: 1, duration: 3.40, ease: "power2.inOut" }, 29.60);
      tl.to("#f6-card-3", { scale: 1.03, duration: 3.00, ease: "sine.inOut" }, 30.40);

      window.__timelines = window.__timelines || {};

      // marcador-fuera: el numero de seccion CAMBIA entre escenas, asi que si
      // sigue encendido durante el encadenado se leen los dos a la vez y sale
      // el amasijo que vimos en la costura ("078//133--LASSVISTAS").
      tl.to("#f6-mark", { opacity: 0, duration: 0.5, ease: "power2.in" }, 31.67);

      // suelta-contenido: al empezar el encadenado la escena deja ir su
      // CONTENIDO y se queda solo con el fondo. Como el fondo de las 13 es el
      // mismo navy, la imagen NO se corta: solo se releva lo que hay encima.
      tl.to(["#f6-clip-escena"], { opacity: 0, duration: 0.55, ease: "power2.in" }, 31.72);

      // marca-fuera: la marca de esquina vive FUERA del clip que se suelta,
      // asi que hay que apagarla aparte o se queda sobre la escena siguiente.
      tl.to("#f6-brand", { opacity: 0, duration: 0.5, ease: "power2.in" }, 31.72);

      window.__timelines[ID] = tl;
    })();
  </script>
</template>

          jx: 84, jy: 72, w: 152, h: 198, rot: 5.4, op: 0.42,
          at0: 5.60, span: 4.90, caida: 520, mk: true },
        { id: "frente", cols: 5, rows: 3, x0: -96, y0: -96, cw: 422, ch: 424,
          jx: 96, jy: 80, w: 204, h: 266, rot: 3.8, op: 0.62,
          at0: 10.20, span: 3.70, caida: 580, mk: true }
      ];

      /* las 6 láminas que muerden el claro al final: posición explícita,
         calculada contra los márgenes libres del contador y del titular */
      var MORDIDA = [
        { x: 244, y: 262, rot: -3.4, at: 13.30 },
        { x: 1470, y: 236, rot: 3.0, at: 13.75 },
        { x: 226, y: 430, rot: 2.6, at: 14.20 },
        { x: 1488, y: 398, rot: -2.4, at: 14.65 },
        { x: 250, y: 560, rot: 3.2, at: 15.05 },
        { x: 1452, y: 588, rot: -3.6, at: 15.45 }
      ];
      var MORDIDA_W = 216, MORDIDA_H = 282, MORDIDA_OP = 0.74;

      /* coloca una lámina: rejilla jitreada → empuje fuera del claro →
         reserva del rótulo → vector de caída */
      function colocar(C, ci, i) {
        var col = i % C.cols, fila = Math.floor(i / C.cols);
        var gi = ci * 97 + i;
        var cx = C.x0 + C.cw * col + C.cw / 2 + (hsh(gi, 1) * 2 - 1) * C.jx;
        var cy = C.y0 + C.ch * fila + C.ch / 2 + (hsh(gi, 2) * 2 - 1) * C.jy;

        var rx = ERX + C.w / 2, ry = ERY + C.h / 2;
        function fuera(px, py) {
          var dx = px - CLX, dy = py - CLY;
          var q = (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry);
          if (q >= 1) return [px, py];
          if (q < 1e-6) {
            var a = hsh(gi, 12) * 6.28318;
            dx = Math.cos(a) * rx; dy = Math.sin(a) * ry; q = 1;
          }
          var s = 1.045 / Math.sqrt(q);
          return [CLX + dx * s, CLY + dy * s];
        }
        var pos = fuera(cx, cy);
        cx = pos[0]; cy = pos[1];
        if (C.mk && cx + C.w / 2 > MKX && cy + C.h / 2 > MKY) {
          // el rótulo 02 / 09 manda: la lámina sube y, si al subir vuelve a
          // entrar en el claro, se aparta hacia el borde derecho del claro
          cy = MKY - C.h / 2 - 14;
          var k = 1 - ((cy - CLY) / ry) * ((cy - CLY) / ry);
          if (k > 0) cx = Math.max(cx, CLX + rx * Math.sqrt(k) * 1.045);
        }

        var rot = (hsh(gi, 3) * 2 - 1) * C.rot;
        var lateral = hsh(gi, 7) < 0.30;
        var sx, sy;
        if (lateral) {
          sx = (cx < CLX ? -1 : 1) * (320 + 190 * hsh(gi, 8));
          sy = -(210 + 150 * hsh(gi, 9));
        } else {
          sx = (hsh(gi, 8) * 2 - 1) * 140;
          sy = -(C.caida + 190 * hsh(gi, 9));
        }
        var ndx = (cx - CLX) / 960, ndy = (cy - CLY) / 540;
        return {
          cx: cx, cy: cy, rot: rot, sx: sx, sy: sy,
          rs: rot + (hsh(gi, 10) * 2 - 1) * 15,
          // cada lámina algo distinta de tono: papel apilado, no un tramado
          op: C.op * (0.80 + 0.40 * hsh(gi, 13)),
          orden: -Math.sqrt(ndx * ndx + ndy * ndy) + (hsh(gi, 11) - 0.5) * 0.55
        };
      }

      /* ── la caída ───────────────────────────────────────────────────────
         Cada lámina entra fuera de cuadro y cae en dos tiempos:
         acelera (power1.in, gravedad) y se posa (power2.out, sin rebote).
         Dentro de cada capa aterrizan de fuera hacia dentro: el cuadro se
         cierra sobre el claro en vez de rellenarse como una rejilla. */
      function caer(el, p, at, op) {
        var mx = p.sx * 0.28, my = p.sy * 0.28;
        var mr = p.rot + (p.rs - p.rot) * 0.28;
        tl.fromTo(el, { opacity: 0 },
          { opacity: op, duration: 0.26, ease: "power1.out" }, at);
        tl.fromTo(el,
          { x: p.sx, y: p.sy, rotation: p.rs, scale: 1.07 },
          { x: mx, y: my, rotation: mr, scale: 1.03,
            duration: 0.30, ease: "power1.in" }, at);
        tl.fromTo(el,
          { x: mx, y: my, rotation: mr, scale: 1.03 },
          { x: 0, y: 0, rotation: p.rot, scale: 1,
            duration: 0.36, ease: "power2.out", immediateRender: false },
          at + 0.30);
      }

      CAPAS.forEach(function (C, ci) {
        var els = root.querySelectorAll("#f02-encerrado-capa-" + C.id + " .f02-doc");
        var piezas = [];
        for (var i = 0; i < els.length; i++) {
          var p = colocar(C, ci, i);
          els[i].style.left = (p.cx - C.w / 2) + "px";
          els[i].style.top = (p.cy - C.h / 2) + "px";
          piezas.push({ el: els[i], p: p });
        }
        piezas.sort(function (a, b) { return a.p.orden - b.p.orden; });
        piezas.forEach(function (it, k) {
          var t = piezas.length > 1 ? k / (piezas.length - 1) : 0;
          caer(it.el, it.p, C.at0 + t * C.span, it.p.op);
        });
      });

      /* ── la mordida: el claro deja de ser un claro ─────────────────────── */
      var mords = root.querySelectorAll("#f02-encerrado-capa-mordida .f02-doc");
      for (var m = 0; m < mords.length && m < MORDIDA.length; m++) {
        var M = MORDIDA[m];
        mords[m].style.left = M.x + "px";
        mords[m].style.top = M.y + "px";
        var lado = M.x < CLX ? -1 : 1;
        caer(mords[m], {
          sx: lado * (300 + 90 * hsh(m, 4)),
          sy: -(230 + 130 * hsh(m, 5)),
          rot: M.rot,
          rs: M.rot + (hsh(m, 6) * 2 - 1) * 11
        }, M.at, MORDIDA_OP);
      }

      /* ── el claro abre en reposo ───────────────────────────────────────── */
      tl.fromTo("#f02-encerrado-claro",
        { opacity: 0, scale: 0.974 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power2.inOut" }, 0);

      /* ── el contador: la cifra verificada, y el ámbar llega primero ────
         (counting-dynamic-scale · valor y escala en la misma posición y ease)

         La cifra se escribe desde un 'modifier', no desde onUpdate: el
         renderizador salta de fotograma en fotograma y GSAP difiere el
         cálculo del valor, así que un onUpdate leía todavía el 0 inicial y
         el contador se congelaba en cero en cada salto. El modifier corre
         dentro del propio pipeline de render, con lazy desactivado, y por
         eso da el valor exacto en cualquier fotograma al que se salte. */
      function fmt(n) {
        return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      }
      /* La línea se arma entera en los dos primeros segundos —un contador a
         cero, centrado— y a partir de ahí lo que narra es la cifra subiendo,
         cada una en su pie de voz. */
      var ESC0 = 0.88;
      var GRUPOS = [
        { sel: ".f02-g1", sep: null, to: 765, ver: 0.25, at: 0.90, dur: 2.70 },
        { sel: ".f02-g2", sep: ".f02-s1", to: 36243, ver: 0.90, at: 4.10, dur: 2.20 },
        { sel: ".f02-g3", sep: ".f02-s2", to: 22547, ver: 1.40, at: 7.00, dur: 3.30 }
      ];
      GRUPOS.forEach(function (G) {
        var grp = root.querySelector(G.sel);
        var numEl = grp.querySelector(".f02-num");
        var objetivo = G.sep ? [root.querySelector(G.sep), grp] : [grp];
        tl.set(numEl, { scale: ESC0 }, 0);
        tl.fromTo(objetivo, { opacity: 0 },
          { opacity: 1, duration: 0.40, ease: "power2.out" }, G.ver);
        var cuenta = { v: 0 };
        tl.fromTo(cuenta, { v: 0 }, {
          v: G.to, duration: G.dur, ease: "power3.out",
          lazy: false, immediateRender: false,
          modifiers: {
            v: function (v) { numEl.textContent = fmt(v); return v; }
          }
        }, G.at);
        tl.fromTo(numEl, { scale: ESC0 },
          { scale: 1, duration: G.dur, ease: "power3.out" }, G.at);
      });

      /* ── el veredicto, ya con la pila encima ──────────────────────────── */
      tl.fromTo("#f02-encerrado-titular",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" }, 14.30);

      /* ── el cuadro se cierra: viñeta + una compresión mínima de la pila ── */
      tl.fromTo("#f02-encerrado-vineta", { opacity: 0 },
        { opacity: 1, duration: 9.00, ease: "power2.inOut" }, 9.40);
      tl.fromTo(pila, { scale: 1 },
        { scale: 1.022, duration: 5.80, ease: "power2.out" }, 12.80);

      /* ── escenario y ancla ────────────────────────────────────────────── */
      tl.fromTo("#f02-encerrado-decor", { opacity: 0 },
        { opacity: 1, duration: 1.50, ease: "power2.out" }, 0);
      tl.fromTo("#f02-encerrado-hrule", { scaleX: 0.20 },
        { scaleX: 1, duration: 1.60, ease: "power3.out" }, 0.15);
      tl.fromTo("#f02-encerrado-marca", { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.90, ease: "power2.out" }, 1.00);

      /* ── una sola respiración lenta compartida (sine-wave-loop) ─────────
         Envolvente en los dos extremos: la escena entra y sale en reposo,
         pero nunca hay una ventana sin tween corriendo. */
      var CICLOS = 6;
      var amb = { p: 0 };
      tl.to(amb, {
        p: 6.28318 * CICLOS, duration: D, ease: "none",
        onUpdate: function () {
          var prog = amb.p / (6.28318 * CICLOS);
          var env = prog < 0.07 ? prog / 0.07
                  : prog > 0.80 ? (1 - prog) / 0.20 : 1;
          var s = Math.sin(amb.p) * env;
          glow.style.transform = "scale(" + (1 + s * 0.018) + ")";
          glow.style.opacity = String(0.90 + s * 0.09);
          grid.style.transform = "scale(" + (1 + s * 0.004) + ")";
          grid.style.opacity = String(0.92 + s * 0.08);
          respira.style.transform =
            "translateY(" + (s * 3.2) + "px) scale(" + (1 + s * 0.005) + ")";
          contador.style.textShadow =
            "0 0 " + (26 + s * 11) + "px rgba(233, 163, 60, " + (0.28 + s * 0.10) + ")";
        }
      }, 0);

      tl.to("#f02-encerrado-aliento", {
        opacity: 0.88, duration: 4.75, repeat: 3, yoyo: true, ease: "sine.inOut"
      }, 0);
    })();
  </script>
</template>
